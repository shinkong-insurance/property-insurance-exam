<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>產險考照練功房</title>
<meta name="description" content="財產保險業務員資格測驗練習網頁：分類練習、全真模擬考、錯題本、收藏與學習進度，離線於瀏覽器本機運作。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --bg:#EEF0F5;
  --surface:#FFFFFF;
  --surface-2:#F5F6FA;
  --border:#DBDFE9;
  --text:#1A2030;
  --text-dim:#5B6478;
  --text-faint:#8992A6;
  --accent:#B9791E;
  --accent-ink:#FFFFFF;
  --accent-soft:#F3E4C6;
  --success:#2F8F63;
  --success-soft:#DFF3E9;
  --danger:#C94A3B;
  --danger-soft:#FBE4E0;
  --shadow:0 1px 2px rgba(23,29,45,.06), 0 8px 24px -12px rgba(23,29,45,.16);
  --radius-card:14px;
  --radius-sm:8px;
  --font-display:'Noto Serif TC', 'PMingLiU', serif;
  --font-body:'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  --font-mono:'JetBrains Mono', 'Consolas', monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141C;
    --surface:#171D29;
    --surface-2:#1E2532;
    --border:#2A3242;
    --text:#EAEBF2;
    --text-dim:#A2AABF;
    --text-faint:#6B7488;
    --accent:#E8A93C;
    --accent-ink:#1A1204;
    --accent-soft:rgba(232,169,60,.16);
    --success:#4CC08A;
    --success-soft:rgba(76,192,138,.14);
    --danger:#E5695A;
    --danger-soft:rgba(229,105,90,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -12px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#10141C;
  --surface:#171D29;
  --surface-2:#1E2532;
  --border:#2A3242;
  --text:#EAEBF2;
  --text-dim:#A2AABF;
  --text-faint:#6B7488;
  --accent:#E8A93C;
  --accent-ink:#1A1204;
  --accent-soft:rgba(232,169,60,.16);
  --success:#4CC08A;
  --success-soft:rgba(76,192,138,.14);
  --danger:#E5695A;
  --danger-soft:rgba(229,105,90,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -12px rgba(0,0,0,.55);
}

/* ============================= RESET ============================= */
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
h1,h2,h3,h4{font-family:var(--font-display);text-wrap:balance;margin:0;}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--accent-soft);}
button, [role="button"], .clickable{cursor:pointer;}
button:focus-visible, a:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}
.tabular{font-variant-numeric:tabular-nums;font-family:var(--font-mono);}

/* ============================= LAYOUT SHELL ============================= */
#app{max-width:920px;margin:0 auto;padding:0 16px 96px;}
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:920px;margin:0 auto;padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:17px;}
.brand-mark{
  width:30px;height:30px;border-radius:8px;
  background:var(--accent);
  background:linear-gradient(155deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--danger)));
  display:flex;align-items:center;justify-content:center;color:var(--accent-ink);
  font-family:var(--font-display);font-weight:700;font-size:14px;flex:none;
}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:none;border:1px solid var(--border);color:var(--text-dim);
  padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;
}
.back-btn:hover{color:var(--text);border-color:var(--text-faint);}
.theme-toggle{
  background:none;border:1px solid var(--border);color:var(--text-dim);
  width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none;
}
.theme-toggle:hover{color:var(--text);border-color:var(--text-faint);}
.theme-toggle svg{width:16px;height:16px;}

main{padding-top:20px;}
.view{animation:rise .28s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion: reduce){.view{animation:none;}}

/* ============================= TICKET HEADER (home) ============================= */
.ticket{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow);
  padding:26px 24px 20px;
  overflow:hidden;
  margin-bottom:22px;
}
.ticket::before{
  content:"";position:absolute;inset:0 0 auto 0;height:5px;
  background:repeating-linear-gradient(90deg, var(--accent) 0 14px, transparent 14px 22px);
  opacity:.8;
}
.ticket-eyebrow{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);font-weight:700;
}
.ticket h1{font-size:26px;margin-top:6px;color:var(--text);}
.ticket p.sub{color:var(--text-dim);margin-top:6px;font-size:14px;max-width:56ch;}
.ticket-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  margin-top:20px;border-top:1px dashed var(--border);padding-top:16px;
  position:relative;
}
.ticket-stats::before{
  content:"";position:absolute;left:-24px;top:-9px;width:18px;height:18px;border-radius:50%;
  background:var(--bg);border:1px solid var(--border);border-left:none;
}
.ticket-stats::after{
  content:"";position:absolute;right:-24px;top:-9px;width:18px;height:18px;border-radius:50%;
  background:var(--bg);border:1px solid var(--border);border-right:none;
}
.tstat{text-align:center;}
.tstat b{display:block;font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--text);}
.tstat span{display:block;font-size:11.5px;color:var(--text-faint);margin-top:2px;}

/* ============================= CARDS / GRID ============================= */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);
  box-shadow:var(--shadow);padding:20px;
}
.section-title{
  font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--text);
  display:flex;align-items:center;gap:8px;margin:28px 0 12px;
}
.section-title .icon{color:var(--accent);flex:none;}
.grid-features{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;
}
.feature-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);
  padding:18px;text-align:left;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;transition:transform .15s ease, border-color .15s ease;
}
.feature-card:hover{transform:translateY(-2px);border-color:var(--accent);}
.feature-card .icon-wrap{
  width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.feature-card .icon-wrap svg{width:20px;height:20px;}
.feature-card h3{font-size:16px;color:var(--text);}
.feature-card p{font-size:12.5px;color:var(--text-dim);}
.feature-card .meta{margin-top:auto;font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);}

.info-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);
  padding:18px 20px;box-shadow:var(--shadow);
}
table.exam-info{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
table.exam-info th, table.exam-info td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);}
table.exam-info th{color:var(--text-faint);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;}
table.exam-info td.num{font-family:var(--font-mono);}
.tip-list{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;}
.tip-list li{display:flex;gap:9px;font-size:13.5px;color:var(--text-dim);}
.tip-list li .dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px;}
.tip-list li b{color:var(--text);font-weight:600;}

/* ============================= BUTTONS ============================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:999px;border:1px solid transparent;padding:10px 20px;font-size:14px;font-weight:700;
  font-family:var(--font-body);
}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;}
.btn-ghost{background:none;border-color:var(--border);color:var(--text);}
.btn-ghost:hover{border-color:var(--text-faint);}
.btn-sm{padding:7px 14px;font-size:12.5px;border-radius:999px;}
.btn-block{width:100%;}
.btn-danger-ghost{background:none;border:1px solid var(--danger);color:var(--danger);}

/* ============================= CATEGORY LIST ============================= */
.cat-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.cat-row{
  display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px 16px;box-shadow:var(--shadow);
}
.cat-row .cat-main{flex:1;min-width:0;}
.cat-row h4{font-size:14.5px;font-weight:700;color:var(--text);}
.cat-row .bar-track{height:6px;border-radius:4px;background:var(--surface-2);margin-top:8px;overflow:hidden;}
.cat-row .bar-fill{height:100%;background:var(--accent);border-radius:4px;}
.cat-row .cat-figs{font-size:11.5px;color:var(--text-faint);margin-top:6px;font-family:var(--font-mono);}
.cat-row .cat-count{
  font-family:var(--font-mono);font-size:12px;color:var(--text-dim);flex:none;
  background:var(--surface-2);border-radius:999px;padding:4px 10px;
}

/* ============================= QUIZ / SESSION ============================= */
.session-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;
}
.progress-track{flex:1;min-width:120px;height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .25s ease;}
.session-meta{font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);white-space:nowrap;}
.timer-chip{
  font-family:var(--font-mono);font-weight:700;font-size:13.5px;color:var(--text);
  background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:5px 12px;
  display:inline-flex;align-items:center;gap:6px;
}
.timer-chip.low{color:var(--danger);border-color:var(--danger);background:var(--danger-soft);}

.q-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);
  box-shadow:var(--shadow);padding:22px;
}
.q-card .q-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.q-tag{
  font-family:var(--font-mono);font-size:11px;color:var(--accent);background:var(--accent-soft);
  border-radius:999px;padding:3px 10px;font-weight:700;letter-spacing:.02em;
}
.bookmark-btn{
  background:none;border:1px solid var(--border);border-radius:999px;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;color:var(--text-faint);flex:none;
}
.bookmark-btn svg{width:16px;height:16px;}
.bookmark-btn.active{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}
.q-stem{font-size:17px;line-height:1.75;color:var(--text);margin-top:14px;font-weight:500;}
.q-options{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.opt-btn{
  display:flex;align-items:flex-start;gap:12px;text-align:left;
  background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 14px;font-size:14.5px;color:var(--text);width:100%;
}
.opt-btn:hover:not(:disabled){border-color:var(--accent);}
.opt-btn .opt-letter{
  flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--text-dim);
}
.opt-btn.selected{border-color:var(--accent);}
.opt-btn.correct{border-color:var(--success);background:var(--success-soft);}
.opt-btn.correct .opt-letter{background:var(--success);border-color:var(--success);color:#fff;}
.opt-btn.wrong{border-color:var(--danger);background:var(--danger-soft);}
.opt-btn.wrong .opt-letter{background:var(--danger);border-color:var(--danger);color:#fff;}
.opt-btn:disabled{cursor:default;}
.opt-btn.flagged-mark{position:relative;}

.q-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap;}
.q-footer .left-actions{display:flex;gap:8px;flex-wrap:wrap;}
.result-banner{
  margin-top:16px;border-radius:var(--radius-sm);padding:10px 14px;font-size:13.5px;font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.result-banner.ok{background:var(--success-soft);color:var(--success);}
.result-banner.no{background:var(--danger-soft);color:var(--danger);}

.jump-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.jump-cell{
  width:30px;height:30px;border-radius:7px;font-family:var(--font-mono);font-size:11px;font-weight:700;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);display:flex;align-items:center;justify-content:center;flex:none;
}
.jump-cell.current{border-color:var(--accent);color:var(--accent);}
.jump-cell.done{background:var(--accent-soft);color:var(--accent);border-color:transparent;}
.jump-cell.flagged{box-shadow:inset 0 -3px 0 var(--danger);}

/* ============================= EXAM SETUP ============================= */
.mode-list{display:flex;flex-direction:column;gap:12px;margin-top:14px;}
.mode-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);
  padding:18px 20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.mode-card .mode-main{flex:1;min-width:180px;}
.mode-card h4{font-size:15.5px;color:var(--text);}
.mode-card p{font-size:12.5px;color:var(--text-dim);margin-top:4px;}
.mode-card .mode-figs{display:flex;gap:16px;font-family:var(--font-mono);font-size:12px;color:var(--text-faint);margin-top:8px;}

/* ============================= RESULT / STATS ============================= */
.score-hero{
  text-align:center;padding:28px 20px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-card);box-shadow:var(--shadow);
}
.score-hero .big-score{font-family:var(--font-mono);font-size:52px;font-weight:700;color:var(--text);}
.score-hero .pass-pill{
  display:inline-flex;margin-top:8px;padding:5px 16px;border-radius:999px;font-weight:700;font-size:13px;
}
.score-hero .pass-pill.pass{background:var(--success-soft);color:var(--success);}
.score-hero .pass-pill.fail{background:var(--danger-soft);color:var(--danger);}
.subject-breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px;}
.subject-breakdown .sb-item{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px;text-align:left;}
.subject-breakdown .sb-item .label{font-size:11.5px;color:var(--text-faint);}
.subject-breakdown .sb-item .val{font-family:var(--font-mono);font-size:20px;font-weight:700;margin-top:2px;}

.progress-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px;}
.progress-table th, .progress-table td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);}
.progress-table th{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}
.progress-table td.num{font-family:var(--font-mono);text-align:right;}
.mini-bar-track{width:70px;height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:inline-block;vertical-align:middle;}
.mini-bar-fill{height:100%;background:var(--accent);}

.record-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 0;border-bottom:1px solid var(--border);font-size:13px;
}
.record-row:last-child{border-bottom:none;}
.record-row .rd-left{display:flex;flex-direction:column;gap:2px;}
.record-row .rd-left .date{color:var(--text-faint);font-size:11.5px;font-family:var(--font-mono);}
.record-row .badge{
  font-family:var(--font-mono);font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;
}
.record-row .badge.pass{background:var(--success-soft);color:var(--success);}
.record-row .badge.fail{background:var(--danger-soft);color:var(--danger);}

.empty-state{
  text-align:center;padding:48px 20px;color:var(--text-faint);
}
.empty-state svg{width:40px;height:40px;color:var(--text-faint);margin-bottom:12px;}
.empty-state p{font-size:14px;}

.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.setting-row:last-child{border-bottom:none;}
.chip-select{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);
  border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;
}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

footer.site-footer{
  max-width:920px;margin:40px auto 0;padding:20px 16px;text-align:center;
  color:var(--text-faint);font-size:11.5px;
}

@media (max-width:520px){
  .ticket h1{font-size:22px;}
  .q-stem{font-size:15.5px;}
  .score-hero .big-score{font-size:42px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div id="topbar-left" class="brand">
      <span class="brand-mark">產</span>
      <span>產險考照練功房</span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="切換深色／淺色模式" title="切換深色／淺色模式">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
    </button>
  </div>
</div>

<div id="app">
  <main id="main"></main>
</div>

<footer class="site-footer">產險考照練功房 · 財產保險業務員資格測驗練習 · 所有紀錄僅保存在本機瀏覽器<br>© 2026 產險考照練功房。內容僅供個人備考練習使用，禁止複製、擷取、轉載或作商業用途。</footer>

<script>
"use strict";
/* ============================================================
   LIGHTWEIGHT CONTENT-PROTECTION DETERRENTS
   (deters casual copying only — not a real access-control mechanism)
   ============================================================ */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
document.addEventListener("copy", e => e.preventDefault());
document.addEventListener("keydown", e => {

const LS = {
  wrong: "pins_wrong_v1",
  fav: "pins_fav_v1",
  progress: "pins_progress_v1",
  records: "pins_records_v1",
  theme: "pins_theme_v1",
};
function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ /* storage unavailable, fail silently */ }
}
let wrongMap = loadJSON(LS.wrong, {});       // {qid: {count, last}}
let favMap = loadJSON(LS.fav, {});           // {qid: true}
let progress = loadJSON(LS.progress, {});    // {catKey: {attempted, correct}}
let records = loadJSON(LS.records, []);      // [{id,date,mode,label,score,correct,total,passed,subjects:[]}]

function ensureProgress(catKey){
  if(!progress[catKey]) progress[catKey] = {attempted:0, correct:0};
  return progress[catKey];
}
function recordAnswer(q, isCorrect){
  const p = ensureProgress(q.category);
  p.attempted++; if(isCorrect) p.correct++;
  saveJSON(LS.progress, progress);
  if(!isCorrect){
    const cur = wrongMap[q.id] || {count:0};
    cur.count++; cur.last = Date.now();
    wrongMap[q.id] = cur;
    saveJSON(LS.wrong, wrongMap);
  }
}
function clearWrong(qid){ delete wrongMap[qid]; saveJSON(LS.wrong, wrongMap); }
function toggleFav(qid){
  if(favMap[qid]) delete favMap[qid]; else favMap[qid] = true;
  saveJSON(LS.fav, favMap);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickN(arr, n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function fmtDate(ts){
  const d = new Date(ts);
  const p = n=>String(n).padStart(2,"0");
  return d.getFullYear()+"/"+p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function go(hash){ window.location.hash = hash; }

/* ============================================================
   SESSION ENGINE (shared by practice / review / exam)
   ============================================================ */
let SESSION = null;
/*
SESSION = {
  mode: 'practice' | 'review-wrong' | 'review-fav' | 'exam',
  title, order: [ids...], idx, answers: {qid:{picked, correct}},
  flagged: Set, startTs, durationSec (exam only), subject label (exam only),
  onFinishHash
}
*/
function buildSession(cfg){
  SESSION = Object.assign({
    idx:0, answers:{}, flagged:new Set(), startTs:Date.now()
  }, cfg);
  return SESSION;
}
function startPracticeSession(catKey, mode){
  const pool = QBY_CAT[catKey];
  if(!pool || !pool.length) return viewPracticePicker();
  buildSession({
    mode:"practice",
    title:catKey,
    order: shuffle(pool).map(q=>q.id),
    onFinishHash:"#/practice"
  });
  go("#/session");
  return "";
}
function startReviewSession(kind){
  const ids = kind==="wrong" ? Object.keys(wrongMap).map(Number) : Object.keys(favMap).map(Number);
  if(!ids.length) return;
  buildSession({
    mode: kind==="wrong" ? "review-wrong" : "review-fav",
    title: kind==="wrong" ? "錯題複習" : "收藏複習",
    order: shuffle(ids),
    onFinishHash: kind==="wrong" ? "#/wrongbook" : "#/favorites"
  });
  go("#/session");
}

function viewSession(){
  if(!SESSION) return `<div class="empty-state">${icon("info")}<p>目前沒有進行中的練習，請從分類練習開始。</p></div>`;
  const s = SESSION;
  if(s.idx >= s.order.length){
    return sessionSummary();
  }
  const q = QBY_ID[s.order[s.idx]];
  const ans = s.answers[q.id];
  const total = s.order.length;
  const modeLabel = {practice:"分類練習", "review-wrong":"錯題複習", "review-fav":"收藏複習"}[s.mode] || "練習";
  return `
  <button class="back-btn" onclick="endSession()">${icon("cross")} 結束練習</button>
  <div class="session-bar" style="margin-top:16px;">
    <div class="progress-track"><div class="progress-fill" style="width:${Math.round((s.idx)/total*100)}%"></div></div>
    <div class="session-meta tabular">${s.idx+1} / ${total}</div>
  </div>
  ${renderQuestionCard(q, ans, {
      showBookmark:true,
      showReveal: s.mode!=="exam",
      footerExtra: renderPracticeFooter(modeLabel)
    })}
  `;
}
function renderPracticeFooter(modeLabel){
  return `<span class="q-tag" style="background:var(--surface-2);color:var(--text-faint);">${escapeHtml(modeLabel)}</span>`;
}
function sessionSummary(){
  const s = SESSION;
  const total = s.order.length;
  let correct = 0;
  s.order.forEach(id=>{ if(s.answers[id] && s.answers[id].correct) correct++; });
  const acc = total ? Math.round(correct/total*100) : 0;
  return `
  <div class="score-hero">
    <div style="font-size:13px;color:var(--text-faint);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;">練習結束</div>
    <div class="big-score tabular">${correct} / ${total}</div>
    <div class="pass-pill ${acc>=70?'pass':'fail'}">正確率 ${acc}%</div>
  </div>
  <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;">
    <button class="btn btn-primary" onclick="restartSession()">${icon("target")} 再練一次</button>
    <a class="btn btn-ghost" href="${s.onFinishHash||'#/home'}">回列表</a>
    <a class="btn btn-ghost" href="#/home">回首頁</a>
  </div>
  `;
}
function restartSession(){
  if(!SESSION) return;
  SESSION.order = shuffle(SESSION.order);
  SESSION.idx = 0;
  SESSION.answers = {};
  render();
}
function endSession(){
  const hash = SESSION ? (SESSION.onFinishHash || "#/home") : "#/home";
  SESSION = null;
  go(hash);
}

/* shared question card renderer used by practice/review (immediate feedback) */
function renderQuestionCard(q, ans, opts){
  opts = opts || {};
  const letters = ["A","B","C","D"];
  const isFav = !!favMap[q.id];
  const answered = !!ans;
  const optionsHtml = q.options.map((opt,i)=>{
    const letter = letters[i];
    let cls = "opt-btn";
    if(answered){
      if(letter === q.answer) cls += " correct";
      else if(letter === ans.picked) cls += " wrong";
    }
    return `<button class="${cls}" ${answered?"disabled":""} data-act="pick" data-letter="${letter}">
      <span class="opt-letter">${letter}</span><span>${escapeHtml(opt)}</span>
    </button>`;
  }).join("");
  let banner = "";
  if(answered){
    banner = ans.correct
      ? `<div class="result-banner ok">${icon("check")} 答對了！`+`</div>`
      : `<div class="result-banner no">${icon("cross")} 答錯了，正確答案是 ${q.answer}</div>`;
  }
  return `
  <div class="q-card" data-qid="${q.id}">
    <div class="q-head">
      <span class="q-tag">${escapeHtml(q.category)} · 題號 ${q.source_no}</span>
      ${opts.showBookmark ? `<button class="bookmark-btn ${isFav?'active':''}" data-act="fav" title="收藏本題">${icon("bookmark")}</button>` : ""}
    </div>
    <div class="q-stem">${escapeHtml(q.stem)}</div>
    <div class="q-options">${optionsHtml}</div>
    ${banner}
    <div class="q-footer">
      <div class="left-actions">
        ${opts.showReveal && !answered ? `<button class="btn btn-ghost btn-sm" data-act="reveal">顯示答案</button>` : ""}
        ${opts.footerExtra || ""}
      </div>
      <button class="btn btn-primary btn-sm" data-act="next" ${answered?"":"disabled"}>下一題 →</button>
    </div>
  </div>
  `;
}

function bindDynamicHandlers(){
  const main = document.getElementById("main");
  main.querySelectorAll('[data-act="pick"]').forEach(btn=>{
    btn.addEventListener("click", ()=>handlePick(btn.dataset.letter));
  });
  const reveal = main.querySelector('[data-act="reveal"]');
  if(reveal) reveal.addEventListener("click", handleReveal);
  const nextBtn = main.querySelector('[data-act="next"]');
  if(nextBtn) nextBtn.addEventListener("click", handleNext);
  const favBtn = main.querySelector('[data-act="fav"]');
  if(favBtn) favBtn.addEventListener("click", ()=>{
    const qid = Number(main.querySelector(".q-card").dataset.qid);
    toggleFav(qid);
    render();
  });
  const submitExam = main.querySelector('[data-act="submit-exam"]');
  if(submitExam) submitExam.addEventListener("click", ()=>finishExamSubject(false));
  main.querySelectorAll('[data-act="start-exam"]').forEach(btn=>{
    btn.addEventListener("click", ()=>startExam(btn.dataset.exam));
  });
  main.querySelectorAll('[data-act="review-start"]').forEach(btn=>{
    btn.addEventListener("click", ()=>startReviewSession(btn.dataset.kind));
  });
  main.querySelectorAll('[data-act="clear-wrong"]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const qid = Number(btn.dataset.qid);
      clearWrong(qid); render();
    });
  });
  main.querySelectorAll('[data-act="unfav"]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const qid = Number(btn.dataset.qid);
      toggleFav(qid); render();
    });
  });
  const clearAllWrong = main.querySelector('[data-act="clear-all-wrong"]');
  if(clearAllWrong) clearAllWrong.addEventListener("click", ()=>{
    if(confirm("確定要清空整個錯題本嗎？")){ wrongMap = {}; saveJSON(LS.wrong, wrongMap); render(); }
  });
  const resetProgress = main.querySelector('[data-act="reset-progress"]');
  if(resetProgress) resetProgress.addEventListener("click", ()=>{
    if(confirm("確定要重設所有學習進度與模擬考紀錄嗎？此動作無法復原。")){
      progress = {}; records = [];
      saveJSON(LS.progress, progress); saveJSON(LS.records, records);
      render();
    }
  });
}

function handlePick(letter){
  const s = SESSION;
  if(!s) return;
  const q = QBY_ID[s.order[s.idx]];
  if(s.answers[q.id]) return;
  const correct = letter === q.answer;
  s.answers[q.id] = {picked:letter, correct};
  recordAnswer(q, correct);
  if(correct && s.mode==="review-wrong") clearWrong(q.id);
  render();
}
function handleReveal(){
  const s = SESSION;
  const q = QBY_ID[s.order[s.idx]];
  if(s.answers[q.id]) return;
  s.answers[q.id] = {picked:null, correct:false};
  recordAnswer(q, false);
  render();
}
function handleNext(){
  const s = SESSION;
  s.idx++;
  render();
}

/* ============================================================
   EXAM ENGINE
   ============================================================ */
let EXAM = null;
/*
EXAM = {
  kind: 'full' | 'practical' | 'regulation',
  subjects: [ {label, pool key, questionIds, durationSec, pointsPer, startedAt, elapsedBefore, answers:{}} ],
  subjectIdx, timerHandle, finished:false, results:[]
}
*/
function startExam(kind){
  const practicalIds = pickN(PRACTICAL_POOL, 100).map(q=>q.id);
  const regulationIds = pickN(REG_POOL, 50).map(q=>q.id);
  const subjects = [];
  if(kind==="full" || kind==="practical"){
    subjects.push({label:"產險實務", ids:practicalIds, durationSec:80*60, pointsPer:1, answers:{}, flagged:new Set()});
  }
  if(kind==="full" || kind==="regulation"){
    subjects.push({label:"產險法規", ids:regulationIds, durationSec:50*60, pointsPer:2, answers:{}, flagged:new Set()});
  }
  EXAM = { kind, subjects, subjectIdx:0, idx:0, results:[], deadline: Date.now() + subjects[0].durationSec*1000 };
  go("#/exam-run");
}
function currentExamSubject(){ return EXAM.subjects[EXAM.subjectIdx]; }

function viewExamRunning(){
  if(!EXAM) return `<div class="empty-state">${icon("info")}<p>目前沒有進行中的模擬考。</p></div>`;
  const subj = currentExamSubject();
  const qid = subj.ids[EXAM.idx];
  const q = QBY_ID[qid];
  const ans = subj.answers[qid];
  const total = subj.ids.length;

  startExamTimerIfNeeded();

  const letters = ["A","B","C","D"];
  const optionsHtml = q.options.map((opt,i)=>{
    const letter = letters[i];
    const picked = ans === letter;
    return `<button class="opt-btn ${picked?'selected':''}" data-act="exam-pick" data-letter="${letter}">
      <span class="opt-letter">${letter}</span><span>${escapeHtml(opt)}</span>
    </button>`;
  }).join("");

  const jumpCells = subj.ids.map((id,i)=>{
    let cls = "jump-cell";
    if(i===EXAM.idx) cls += " current";
    if(subj.answers[id]) cls += " done";
    if(subj.flagged.has(id)) cls += " flagged";
    return `<button class="${cls}" data-act="jump" data-idx="${i}">${i+1}</button>`;
  }).join("");

  const answeredCount = Object.keys(subj.answers).length;

  return `
  <div class="session-bar">
    <button class="back-btn" data-act="abandon-exam">${icon("cross")} 放棄本次模擬考</button>
    <span class="q-tag">${escapeHtml(subj.label)}</span>
    <span class="timer-chip tabular" id="examTimer">${icon("clock")} --:--</span>
  </div>
  <div class="progress-track"><div class="progress-fill" style="width:${Math.round(EXAM.idx/total*100)}%"></div></div>
  <div class="session-meta tabular" style="margin:8px 0 16px;">第 ${EXAM.idx+1} / ${total} 題 · 已作答 ${answeredCount} 題</div>

  <div class="q-card" data-qid="${q.id}">
    <div class="q-head">
      <span class="q-tag" style="background:var(--surface-2);color:var(--text-faint);">題號 ${q.source_no}</span>
      <button class="bookmark-btn ${subj.flagged.has(qid)?'active':''}" data-act="flag" data-qid="${qid}" title="標記待review">${icon("flag")}</button>
    </div>
    <div class="q-stem">${escapeHtml(q.stem)}</div>
    <div class="q-options">${optionsHtml}</div>
    <div class="q-footer">
      <div class="left-actions">
        <button class="btn btn-ghost btn-sm" data-act="exam-prev" ${EXAM.idx===0?"disabled":""}>← 上一題</button>
        <button class="btn btn-ghost btn-sm" data-act="exam-next" ${EXAM.idx>=total-1?"disabled":""}>下一題 →</button>
      </div>
      <button class="btn btn-primary btn-sm" data-act="submit-exam">交卷</button>
    </div>
  </div>

  <div class="section-title" style="margin-top:22px;">${icon("chart")} 作答卡</div>
  <div class="card"><div class="jump-grid">${jumpCells}</div></div>
  `;
}

let examTimerInterval = null;
function startExamTimerIfNeeded(){
  clearInterval(examTimerInterval);
  examTimerInterval = setInterval(()=>{
    if(!EXAM) { clearInterval(examTimerInterval); return; }
    const remain = (EXAM.deadline - Date.now())/1000;
    const chip = document.getElementById("examTimer");
    if(chip){
      chip.innerHTML = icon("clock") + " " + fmtTime(remain);
      chip.classList.toggle("low", remain <= 300);
    }
    if(remain <= 0){
      clearInterval(examTimerInterval);
      finishExamSubject(true);
    }
  }, 1000);
}

function examPick(letter){
  const subj = currentExamSubject();
  const qid = subj.ids[EXAM.idx];
  subj.answers[qid] = letter;
  render();
}
function examNav(delta){
  const subj = currentExamSubject();
  EXAM.idx = Math.max(0, Math.min(subj.ids.length-1, EXAM.idx+delta));
  render();
}
function examJump(i){ EXAM.idx = i; render(); }
function examFlag(qid){
  const subj = currentExamSubject();
  if(subj.flagged.has(qid)) subj.flagged.delete(qid); else subj.flagged.add(qid);
  render();
}
function abandonExam(){
  if(!confirm("確定要放棄本次模擬考嗎？目前作答進度不會列入成績。")) return;
  clearInterval(examTimerInterval);
  EXAM = null;
  go("#/home");
}

function finishExamSubject(auto){
  clearInterval(examTimerInterval);
  const subj = currentExamSubject();
  let correct = 0;
  subj.ids.forEach(id=>{
    const q = QBY_ID[id];
    const picked = subj.answers[id];
    const isCorrect = picked === q.answer;
    if(isCorrect) correct++;
    recordAnswer(q, isCorrect);
  });
  const score = correct * subj.pointsPer;
  EXAM.results.push({label:subj.label, correct, total:subj.ids.length, score, maxScore: subj.ids.length*subj.pointsPer, auto});

  if(EXAM.subjectIdx < EXAM.subjects.length - 1){
    EXAM.subjectIdx++;
    EXAM.idx = 0;
    EXAM.deadline = Date.now() + EXAM.subjects[EXAM.subjectIdx].durationSec*1000;
    go("#/exam-run");
  }else{
    const totalScore = EXAM.results.reduce((a,r)=>a+r.score,0);
    const eachPass = EXAM.results.every(r=> r.score >= r.maxScore*0.6);
    const passThreshold = EXAM.kind==="full" ? 140 : Math.round(EXAM.results[0].maxScore*0.6);
    const passed = EXAM.kind==="full" ? (totalScore>=140 && eachPass) : eachPass;
    const rec = {
      id: Date.now(), date: Date.now(),
      mode: EXAM.kind,
      label: EXAM.kind==="full"?"雙科完整模擬考":EXAM.results[0].label,
      score: totalScore, correct: EXAM.results.reduce((a,r)=>a+r.correct,0),
      total: EXAM.results.reduce((a,r)=>a+r.total,0),
      passed, subjects: EXAM.results
    };
    records.push(rec);
    saveJSON(LS.records, records);
    EXAM.finished = true;
    EXAM.lastRecord = rec;
    go("#/exam-result");
  }
}

function viewExamResult(){
  if(!EXAM || !EXAM.finished) return `<div class="empty-state">${icon("info")}<p>目前沒有模擬考成績可顯示。</p></div>`;

    <a class="btn btn-primary" href="#/exam">${icon("target")} 再測一次</a>

    <a class="btn btn-ghost" href="#/home">回首頁</a>

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener("click", (e)=>{
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const act = t.dataset.act;
  if(act==="exam-pick") examPick(t.dataset.letter);
  else if(act==="exam-prev") examNav(-1);
  else if(act==="exam-next") examNav(1);
  else if(act==="jump" && EXAM && window.location.hash.startsWith("#/exam-run")) examJump(Number(t.dataset.idx));
  else if(act==="flag" && EXAM) examFlag(Number(t.dataset.qid));
  else if(act==="abandon-exam") abandonExam();
});

render();

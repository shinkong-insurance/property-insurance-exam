":"要保人以同一保險利益，同一保險事故，與數個保險人分別訂立數個保險契約，構成","options":["超額保險","足額保險","再保險","複保險"]},{"id":206,"category":"財產保險理論","source_no":206,"answer":"D","stem":"依照損失之性質，下列何者為其所屬型態：","options":["財產損失","法律賠償責任","體傷或死亡","以上皆是"]},{"id":207,"category":"財產保險理論","source_no":207,"answer":"C","stem":"保險原理之一為大數法則，下列何者屬該一法則可發揮作用","options":["保險業之獲利增加","保險費率降低","保險費率合理，經營穩定","以上皆是"]},{"id":208,"category":"財產保險理論","source_no":208,"answer":"B","stem":"被保險人損失通知之期限，均係以下列何者為起算基準","options":["損失發生時","知悉損失發生時","損失金額確定時","申請理賠時"]},{"id":209,"category":"財產保險理論","source_no":209,"answer":"B","stem":"保險人限於承保能量，無法自力承受巨額之保險，通常宜採行下列何種措施","options":["限制保險金額","利用再保險，增加承保能量","拒絕承保","以上皆非"]},{"id":210,"category":"財產保險理論","source_no":210,"answer":"A","stem":"火災保險契約將颱風等危險事故予以除外，如有需要須另行加保，主要原因為何？","options":["並非一般火災保險之被保險人均需要該等保障","承保該等事故將危及保險人經營之安全","該等事故賠款成本過高","以上皆非"]},{"id":211,"category":"財產保險理論","source_no":211,"answer":"C","stem":"104年為開放國內保險業設立國際保險業務（Offshore Insurance Unit，簡稱 OIU），業務範圍包含可辦理外幣收付的保險業務、再保業務及主管機關核准的保險相關業務，哪些人可以購買OIU的商品？","options":["要保人為中華民國國人","被保人為中華民國國人","要/被保人均為境外人士","台灣工作的外籍人士或外籍勞工"]},{"id":212,"category":"財產保險理論","source_no":212,"answer":"A","stem":"下列何者於保險契約成立時有保險費請求權","options":["保險人","要保人","保險經紀人","保險代理人"]},{"id":213,"category":"財產保險理論","source_no":213,"answer":"C","stem":"損失頻率低、損失幅度小之危險，主要採","options":["避免","預防與抑制","損失自留","保險"]},{"id":214,"category":"財產保險理論","source_no":214,"answer":"C","stem":"下列何者屬保險契約中規範當事人雙方權利義務，且為普遍適用的條款","options":["特約條款","不喪失價值條款","基本條款","防止損害擴大條款"]},{"id":215,"category":"財產保險理論","source_no":215,"answer":"C","stem":"以下何者並非對保險業設立前之監理","options":["營業登記","繳存保證金","提存責任準備金","領取營業執照"]},{"id":216,"category":"財產保險理論","source_no":216,"answer":"D","stem":"下列何者係屬保險契約中設定自負額之目的","options":["減少小額賠款及其理賠手續","促使被保險人加強損失預防與控制","促使危險性質改善，減少被保險人保險費負擔","以上皆是"]},{"id":217,"category":"財產保險理論","source_no":217,"answer":"D","stem":"工程合約中的免責協定是何種危險管理方法","options":["損失預防","避免","損失抑制","非保險轉嫁"]},{"id":218,"category":"財產保險理論","source_no":218,"answer":"B","stem":"下列何種危險管理措施屬於事前措施","options":["損失抑制","損失預防","損失自留","保險轉嫁"]},{"id":219,"category":"財產保險理論","source_no":219,"answer":"D","stem":"下列對再保險的敘述何者正確","options":["再保險合約的訂立方式可分為臨時與合約再保險","上述方法均可以比例或非比例方式安排","合約再保險又稱固定再保險","以上皆是"]},{"id":220,"category":"財產保險理論","source_no":220,"answer":"B","stem":"下列何者為保險安定基金墊付範圍","options":["佣金","保險賠款","水電費","再保險費"]},{"id":221,"category":"財產保險理論","source_no":221,"answer":"B","stem":"製造假車禍詐領保險金是屬於何種危險因素","options":["實質危險因素","道德危險因素","怠忽危險因素","以上皆是"]},{"id":222,"category":"財產保險理論","source_no":222,"answer":"D","stem":"對於符合一定條件之保險業，將原屬核准審查方式之新型態保險商品，得改為備查方式辦理，其作用為：","options":["落實差異化管理","達到示範效果","為準則式監理作準備","以上皆是"]},{"id":223,"category":"財產保險理論","source_no":223,"answer":"A","stem":"要保人如違反誠信，致保險人無法對危險做正確之估計，保險人有何權利","options":["解除保險契約","免除賠償責任","與被保險人比例分攤損失","增加保險費"]},{"id":224,"category":"財產保險理論","source_no":224,"answer":"D","stem":"危險的特性須符合條件為","options":["須為不確定性","需有財務損失的可能性","需屬於未來性","以上皆是"]},{"id":225,"category":"財產保險理論","source_no":225,"answer":"B","stem":"被保險人基於本身原因，提前終止保險契約，其保險費應如何處理","options":["按日數比例返還被保險人","按短期費率計收有效期間保險費，餘額返還被保險人","已繳之保險費不予退還","以上皆非"]},{"id":226,"category":"財產保險理論","source_no":226,"answer":"D","stem":"被保險人具有一個以上之承保處所，且保險標的時常在各承保處所間流動者，較適用下列何種保險金額","options":["分項列舉式","合併單一總限額","逐項表列方式","總括保額式"]},{"id":227,"category":"財產保險理論","source_no":227,"answer":"B","stem":"航程保險單之保險標的物於航程中發生保險事故，但至航程結束後，始發現損失情形，則保險人","options":["無須負責","如無遲延通知，仍須負責","須視航程有無因故遲延，而決定是否負有賠償責任","以上皆非"]},{"id":228,"category":"財產保險理論","source_no":228,"answer":"C","stem":"海上貨物保險之保險契約得以背書方式，轉讓予保險標的物之受讓人，因海上貨物保險","options":["屬於對人契約條件","損失經驗較佳","須配合國際貿易條件","以上皆非"]},{"id":229,"category":"財產保險理論","source_no":229,"answer":"A","stem":"被保險人因故提前終止保險契約，其依短期保險費率計收之保險費較以日數比例計收之保險費為高，係因保險人須","options":["加速攤銷各項承保費用","懲罰被保險人提前解約","支應增加之賠款成本","以上皆非"]},{"id":230,"category":"財產保險理論","source_no":230,"answer":"C","stem":"訂約時保險標的之價值未事先約定，而於契約中載明須至損失發生時，按保險事故發生時之實際價值計算賠償金額之契約稱為：","options":["定值保險契約","變額保險契約","不定值保險契約","定額保險契約"]},{"id":231,"category":"財產保險理論","source_no":231,"answer":"D","stem":"損失頻率低、損失幅度大之危險，主要採","options":["避免","預防與抑制","損失自留","保險"]},{"id":232,"category":"財產保險理論","source_no":232,"answer":"A","stem":"下列何者屬保險契約中負有交付保險費義務之人","options":["要保人","被保險人","保險人","受益人"]},{"id":233,"category":"財產保險理論","source_no":233,"answer":"D","stem":"下列何者為出具暫保單時機及目的","options":["保險契約部份條件尚未確定","續保時，部份保險條件尚未重新洽妥時","正式保單仍在繕製，而被保險人急需保險證明文件時","以上皆是"]},{"id":234,"category":"財產保險理論","source_no":234,"answer":"C","stem":"業務員登錄證有效期間為幾年，應於期滿前辦妥換發登錄證手續，未辦妥前不得為保險之招攬。","options":["一年","三年","五年","七年"]},{"id":235,"category":"財產保險理論","source_no":235,"answer":"D","stem":"下列何種危險屬於不可保危險","options":["被保險人故意行為","股價漲跌","投機性危險","以上皆是"]},{"id":236,"category":"財產保險理論","source_no":236,"answer":"B","stem":"危險控制型的危險管理措施，其目的在","options":["排除實質危險因素","控制危險之損失賴率與幅度，以改善危險之性質","控制危險之數量","以上皆非"]},{"id":237,"category":"財產保險理論","source_no":237,"answer":"D","stem":"下列何者非為保險契約生效之要件","options":["對價","契約之目的須為合法","契約當事人具有行為能力","被保險人遵守最大誠信原則"]},{"id":238,"category":"財產保險理論","source_no":238,"answer":"D","stem":"下列何者係指損失發生時，保險人支付於被保險人之補償金額","options":["保險金額","保險價額","保險利益","保險賠款"]},{"id":239,"category":"財產保險理論","source_no":239,"answer":"A","stem":"對保險標的具有保險利益，向保險人申請訂立保險契約者稱為","options":["要保人","被保險人","受益人","保險公證人"]},{"id":240,"category":"財產保險理論","source_no":240,"answer":"A","stem":"下列何者為保險經紀人之定義？","options":["被保險人之代理人","向被保險人收取佣金為報酬","保險公司之代理人","以上皆非"]},{"id":241,"category":"財產保險理論","source_no":241,"answer":"A","stem":"以下何者非屬臨時再保險之優點：","options":["接洽手續簡便","配合個別情況安排","有權決定接受數額","應付緊急需要"]},{"id":242,"category":"財產保險理論","source_no":242,"answer":"D","stem":"保險契的之明細表通常不列示","options":["被保險人名稱","保險金額","保險費","除外不保事項"]},{"id":243,"category":"財產保險理論","source_no":243,"answer":"D","stem":"保險契約設定自負額，使得保險費率下降，原因為何？","options":["小額賠案之理賠費用減少","小額之賠款支出減少","被保險人之損失頻率與損失幅度降低","以上皆是"]},{"id":244,"category":"財產保險理論","source_no":244,"answer":"A","stem":"下列何者屬保險金額","options":["保險人在保險期間內所負之最高賠償責任","保險標的之實際現金價值","保險標的之可保價值","以上皆是"]},{"id":245,"category":"財產保險法規","source_no":1,"answer":"B","stem":"當事人之一方對於他方應通知之事項而怠於通知者，除不可抗力之事故外，不問是否故意，他方得據以如何處理：","options":["終止保險契約","解除保險契約","主張保險契約無效","使保險契約停效"]},{"id":246,"category":"財產保險法規","source_no":2,"answer":"A","stem":"要保人或被保險人，對於保險標的物無保險利益，保險契約失其效力對要保人或被保險人影響為何","options":["自喪失保險利益之後契約往後不生效力","保險契約經終止以後不生效力","以上皆是","以上皆非"]},{"id":247,"category":"財產保險法規","source_no":3,"answer":"C","stem":"下列何者依法可以從事保險招攬？ ①保險業務員 ②保險代理人 ③保險經紀人 ④ 保險公證人","options":["①③④","①②④","①②③","①②③④"]},{"id":248,"category":"財產保險法規","source_no":4,"answer":"B","stem":"下列何者為強制汽車責任保險法的立法目的？ ①為使汽車交通事故所致傷害之受害人，能迅速獲得基本保障 ②為使汽車交通事故所致死亡之受害人，能迅速獲得基本保障 ③為使汽車交通事故所致財產損失能獲得保障 ④維護道路交通安全","options":["①②③④","①②④","①②③","①③④"]},{"id":249,"category":"財產保險法規","source_no":5,"answer":"C","stem":"保險金額超過保險標的價值之契約，係由當事人一方之詐欺而訂立者，他方除得解除契約外，是否尚有其他可以主張","options":["無其他請求權利","如無損失，並得請求賠償","如有損失，並得請求賠償","如有損失，亦不得請求賠償"]},{"id":250,"category":"財產保險法規","source_no":6,"answer":"C","stem":"下列何者屬財產保險 ①火災保險 ②海上保險 ③責任保險 ④年金保險","options":["①②④","①③④","①②③","①②③④"]},{"id":251,"category":"財產保險法規","source_no":7,"answer":"D","stem":"下列何者屬傷害保險人不負給付保險金額之行為？ ①被保險人故意自殺 ②被保險人遭受意外傷害所致死亡 ③被保險人犯罪行為 ④被保險人遭受意外傷害所致失能","options":["①②③④","①③④","①②③","①③"]},{"id":252,"category":"財產保險法規","source_no":8,"answer":"C","stem":"業務員擅自更改客戶要保文件之行為，下列敘述何者正確？","options":["是對客戶的服務","是被允許的行為","可能會涉及偽造、變造文書罪嫌","以上皆非"]},{"id":253,"category":"財產保險法規","source_no":9,"answer":"C","stem":"責任保險之被保險人應於何時內對保險人為請求？","options":["事故發生時起二年","被保險人知悉之日起二年","被保險人受第三人請求之日起二年","以保險人受第三人通知之日起二年"]},{"id":254,"category":"財產保險法規","source_no":10,"answer":"B","stem":"契約上載明保險標的之價值，須至危險發生後估計而定之保險契約為何種保險","options":["定值保險","不定值保險","定額保險","以上皆非"]},{"id":255,"category":"財產保險法規","source_no":11,"answer":"A","stem":"下列何者屬保險人不得行使代位求償權的險種","options":["傷害保險","海上保險","火災保險","保證保險"]},{"id":256,"category":"財產保險法規","source_no":12,"answer":"D","stem":"在何種情形下，第三人可以直接向保險人請求賠償","options":["被保險人之責任已經確定","在保險金額範圍內","依該第三人應得之比例","以上全要符合"]},{"id":257,"category":"財產保險法規","source_no":13,"answer":"C","stem":"下列何種車輛依法應投保強制汽車責任保險？ ①強制汽車責任保險法所稱汽車 ② 強制汽車責任保險法所稱機車 ③特定之非依軌道行駛，具有運輸功能之路上動力車輛 ④醫療用電動代步車","options":["①②③④","①②④","①②③","①③④"]},{"id":258,"category":"財產保險法規","source_no":14,"answer":"A","stem":"保險經紀人依法可收取佣金，另於規定業務範圍內及明確告知報酬收取標準，依規定可向誰收取報酬","options":["要保人或被保險人","公證人","以上皆是","以上皆非"]},{"id":259,"category":"財產保險法規","source_no":15,"answer":"A","stem":"因惡意的複保險致保險契約無效時，保險人於不知情之時期內權利為何","options":["仍取得保險費","仍不能取得保險費","已收的保險費要返還","視契約的規定而定"]},{"id":260,"category":"財產保險法規","source_no":16,"answer":"B","stem":"每一保險公證人不得同時為幾家以上公司擔任簽署工作？","options":["一家以上","二家以上","三家以上","四家以上"]},{"id":261,"category":"財產保險法規","source_no":17,"answer":"B","stem":"保險業務員於招攬保險時依法有何義務？ ①應出示登錄證 ②應告知授權範圍 ③ 提供名片","options":["①③","①②","②③","①②③"]},{"id":262,"category":"財產保險法規","source_no":18,"answer":"D","stem":"保險標的未經約定價值，火災保險保險標的發生損失時，以何者為計算賠償之標準？","options":["保險事故發生時之市價","訂約時之實際價值","保險事故發生時之重置價值","保險事故發生時實際價值，且最多以保險金額為限"]},{"id":263,"category":"財產保險法規","source_no":19,"answer":"B","stem":"關於貨物之保險，原則上自交運之時以迄於其目的地收貨之時為其期間。但例外情形為何？","options":["除民法另有規定外","除契約另有訂定外","除公路法另有規定外","除海商法另有規定外"]},{"id":264,"category":"財產保險法規","source_no":20,"answer":"B","stem":"個人資料之蒐集、處理或利用，不得逾越什麼目的之必要範圍：","options":["共同目的","特定目的","一般目的","任意目的"]},{"id":265,"category":"財產保險法規","source_no":21,"answer":"A","stem":"下列何者非屬保險業保險代理人公司保險經紀人公司辦理電話行銷所規範適用對象","options":["保險公證人公司","保險公司","保險代理人公司","保險經紀人公司"]},{"id":266,"category":"財產保險法規","source_no":22,"answer":"C","stem":"當事人之一方對於他方應通知之事項而怠於通知者，在何種情形下，他方不得據為解除保險契約之原因：","options":["任何情形下","故意情況下","不可抗力之事故","疏忽情況下"]},{"id":267,"category":"財產保險法規","source_no":23,"answer":"C","stem":"保險人對於因履行什麼義務所致之損害，應負賠償責任","options":["契約上","倫理上","道德上","以上皆是"]},{"id":268,"category":"財產保險法規","source_no":24,"answer":"C","stem":"責任保險人於被保險人依法應負賠償責任，尚須何種條件才須負賠償責任：","options":["被保險人已經承諾賠償責任時","被保險人已支付賠款時","被保險人受賠償請求時","以上皆是"]},{"id":269,"category":"財產保險法規","source_no":25,"answer":"D","stem":"金融機構對疑似洗錢或資恐交易之申報，於專責主管核定後多久以內向調查局申報：","options":["三個營業日","五個營業日","七個營業日","核定後之申報期限不得逾二個營業日"]},{"id":270,"category":"財產保險法規","source_no":26,"answer":"C","stem":"保險人得約定被保險人對於第三人就其責任所為之承認、和解或賠償，未經其參與者效力為何","options":["保險人不得拒絕賠償","保險人得減額折扣賠償","保險人不受拘束","保險人得解除契約"]},{"id":271,"category":"財產保險法規","source_no":29,"answer":"C","stem":"個人資料蒐集之特定目的消失或期限屆滿時，應主動或依當事人之請求，刪除、停止處理或利用該個人資料。但在下列何種情形下則不在此限？ ①因執行職務所必須 ②因執行業務所必須 ③經當事人書面同意 ④未來另有行銷用途","options":["①②③ ④","①②④","①②③","①③"]},{"id":272,"category":"財產保險法規","source_no":30,"answer":"B","stem":"保險業於完納一切稅捐後，分派盈餘時，應先提存多少比例作為法定盈餘公積？","options":["30%","20%","25%","35%"]},{"id":273,"category":"財產保險法規","source_no":34,"answer":"B","stem":"因危險增加而終止契約，或部份終止時，終止後之保險費已交付者，應返還之，但例外情形為何？","options":["保險費以時間為計算基礎者","保險費非以時間為計算基礎者","無例外情形","視個案而定"]},{"id":274,"category":"財產保險法規","source_no":35,"answer":"A","stem":"訂約時，僅保險人知危險已消滅者，而要保人不受拘束時如何處理","options":["保險人不得請求償還費用，並不得請求保險費","保險人得請求償還費用，亦無須返還已收受之保險費","保險人不得請求償還費用，但得請求已收受之保險費","保險人得請求償還費用，亦得請求已收受之保險費"]},{"id":275,"category":"財產保險法規","source_no":36,"answer":"B","stem":"保險業務員登錄業務由下列何者辦理","options":["保險業主管機關","各有關公會","考試院","各保險公司"]},{"id":276,"category":"財產保險法規","source_no":37,"answer":"C","stem":"因運送上之必要，暫時停止或變更運送路線或方法時，保險契約仍繼續有效。例外情形為何？","options":["無例外規定","除公路法另有規定外","除契約另有訂定外","除民法另有規定外"]},{"id":277,"category":"財產保險法規","source_no":38,"answer":"D","stem":"有關保險業務員從事保險招攬所用之文宣、廣告、簡介、商品說明書及建議書等文書，下列敘述何者屬錯誤？","options":["應標明所屬公司之名稱","所屬公司為代理人、經紀人者並應標明往來保險業名稱","保險代理人、經紀人公司所屬業務員所使用之文宣、廣告、簡介、商品說明書及建議書等文書，應經其往來保險業提供或同意方可使用","廣告文宣之內容可與保險業報經主管機關審查通過之保單條款、費率及要保書文件不符"]},{"id":278,"category":"財產保險法規","source_no":39,"answer":"C","stem":"依個人資料保護法規定，指將蒐集之個人資料為處理以外之使用即謂","options":["蒐集","傳輸","利用","儲存"]},{"id":279,"category":"財產保險法規","source_no":40,"answer":"B","stem":"保險契約當事人之一方違背特約條款時：","options":["他方得於事故發生後一個月內解除契約","他方得於知悉後一個月內解除契約","他方得於知悉後一個月內為撤銷契約之意思表示","他方得於知悉後15日內為拒賠之意思表示"]},{"id":280,"category":"財產保險法規","source_no":41,"answer":"A","stem":"契約經解除之後法律效力為何","options":["溯及自訂約時不生效力","自解除之後不生效力","經公證人公證之後不生效力","以上皆非"]},{"id":281,"category":"財產保險法規","source_no":42,"answer":"A","stem":"下列何者在洽定保險契約時為被保險人之代理人","options":["保險經紀人","保險代理人","保險公證人","受益人"]},{"id":282,"category":"財產保險法規","source_no":43,"answer":"D","stem":"依個人資料保護法規定，有關損害賠償請求權之時效敘述，下列何者正確？ ①請求權人知有損害及賠償義務人時起，因二年間不行使而消滅 ②請求權人知有損害及賠償義務人時起，因五年間不行使而消滅 ③自損害發生時起，逾五年不行使而消滅 ④自損害發生時起，逾十年不行使而消滅","options":["①④","②④","②③","① ③"]},{"id":283,"category":"財產保險法規","source_no":44,"answer":"C","stem":"保險人對被保險人之受僱人有否代位求償權","options":["有代位求償權","無代位求償權","該受僱人若為故意行為，則有代位求償權","該受僱人若為過失行為，則有代位求償權"]},{"id":284,"category":"財產保險法規","source_no":45,"answer":"C","stem":"依保險法規定，下列何者是保險業之法定準備金？ ①未滿期保費準備金 ②特別準備金 ③賠款準備金 ④保單紅利準備金","options":["①②④","①③④","①②③","①② ③④"]},{"id":285,"category":"財產保險法規","source_no":46,"answer":"C","stem":"要保人違反保險法據實說明義務之法律效力為何","options":["保險人須於知有解除之原因後一個月內解除契約","保險人於危險發生後亦得解除契約","以上皆是","以上皆非"]},{"id":286,"category":"財產保險法規","source_no":47,"answer":"C","stem":"無詐欺情事之超額保險契約，經當事人一方將超過價值之事實通知他方後，下列何項應按照保險標的之價值比例減少","options":["保險金額","保險費","保險金額及保險費","以上皆非"]},{"id":287,"category":"財產保險法規","source_no":48,"answer":"D","stem":"保險經紀人公司應自許可登記之日起多久，申請主管機關核發執業證照並開始執行或經營業務？","options":["三個月","四個月","五個月","六個月"]},{"id":288,"category":"財產保險法規","source_no":49,"answer":"C","stem":"海上保險人對於保險標的物，原則上因海上一切事變及災害所生之毀損、滅失及費用，負賠償之責。例外情形為何？","options":["無例外規定","除英國海上保險法另有規定外","除契約另有規定外","除民法另有規定外"]},{"id":289,"category":"財產保險法規","source_no":50,"answer":"C","stem":"由保險契約所生之權利，依法自何時起，經過二年不行使而消滅？","options":["自應賠付之日起","自得為訴訟時起","自得為請求之日起","並未規定"]},{"id":290,"category":"財產保險法規","source_no":51,"answer":"C","stem":"保險法對強制規定應如何處理","options":["皆不得以契約變更之","皆得以契約變更之","只有有利於被保險人者，始得以契約變更之","視情形而定是否得變更之"]},{"id":291,"category":"財產保險法規","source_no":52,"answer":"D","stem":"要保人與保險業、保險代理人公司或保險經紀人公司間因電話行銷爭議或涉訟時，下列何者不正確","options":["要保人得要求提供錄音備份","保險業不得拒絕提供錄音備份","保險業得因提供錄音備份而酌收工本費","保險業雖提供錄音備份，但不得收費"]},{"id":292,"category":"財產保險法規","source_no":53,"answer":"B","stem":"要保人破產時，保險契約終止後之保險費已交付者，應如何處理？","options":["不須返還","應返還","可返還亦可不返還","以上皆非"]},{"id":293,"category":"財產保險法規","source_no":54,"answer":"D","stem":"下列何者為強制汽車責任保險法所稱之「汽車」定義？①公路法第二條八款規定之汽車及行駛道路之動力機械 ②機車 ③非依軌道行駛，具有運輸功能之陸上動力車輛","options":["①②","②③","①③","①②③"]},{"id":294,"category":"財產保險法規","source_no":55,"answer":"A","stem":"下列何者適用個人資料保護法？ ①公務機關 ②非公務機關 ③公務機關以外之自然人 ④公務機關以外之法人或其他團體","options":["①②③④","①②","①②③","① ③④"]},{"id":295,"category":"財產保險法規","source_no":56,"answer":"C","stem":"下列那種情形是強制汽車責任保險法規定，其使用人或管理人為本保險之投保義務人？ ①汽車牌照已繳還、繳銷或註銷而仍使用者 ②汽車所有人不明 ③因可歸責於汽車使用人或管理人之事由，致汽車所有人無法管理或使用汽車","options":["①②","②③","①②③","①③"]},{"id":296,"category":"財產保險法規","source_no":57,"answer":"A","stem":"於定值保險契約，保險標的之價值於何時估算確定？","options":["訂約時","危險發生後","視情況而定","沒有規定"]},{"id":297,"category":"財產保險法規","source_no":58,"answer":"A","stem":"被保險人係指於何時遭受損害，享有賠償請求權之人","options":["保險事故發生時","保險契約成立時","交付保險費時","以上皆是"]},{"id":298,"category":"財產保險法規","source_no":59,"answer":"B","stem":"下列何種情形要保人有通知義務","options":["危險減少","危險增加","損害係為履行道德義務","依通常情況對方應知"]},{"id":299,"category":"財產保險法規","source_no":60,"answer":"A","stem":"保險業辦理放款，以那些項目為限？ ①以銀行保證之放款 ②以動產為擔保之放款 ③以不動產為擔保之放款 ④以合於保險法第一百四十六條之一之有價證券為質之放款","options":["①②③④","①②④","①②③","①③④"]},{"id":300,"category":"財產保險法規","source_no":61,"answer":"B","stem":"要保人有為隱匿或遺漏不為說明，或為不實說明，足以變更或減少保險人對於危險之估計者，保險人得如何行使權利","options":["終止契約","解除契約","撤銷契約","無效契約"]},{"id":301,"category":"財產保險法規","source_no":62,"answer":"A","stem":"保險業辦理電話行銷人員進行電話行銷之過程與成交記錄備份存檔資料，保存期限不得低於多久","options":["保險契約期滿後五年","保險契約成立後五年","保險契約期滿後三年","保險契約成立後三年"]},{"id":302,"category":"財產保險法規","source_no":67,"answer":"C","stem":"保險業務員登錄證有效期間為多久","options":["三年","四年","五年","十年"]},{"id":303,"category":"財產保險法規","source_no":68,"answer":"C","stem":"一般「遲延交費」條款多規定被保險人於保險契約生效後多少天內可以補交保險費","options":["10天","20天","30天","45天"]},{"id":304,"category":"財產保險法規","source_no":69,"answer":"C","stem":"保險業務員登錄後，應專為下列何者從事保險招攬","options":["自己","他人","所屬公司","保險公會"]},{"id":305,"category":"財產保險法規","source_no":70,"answer":"B","stem":"危險增加，由於要保人或被保險人之行為所致者，要保人不同意保險人另定保險費而終止契約時，保險人如有損失應如何處理?","options":["不得請求賠償","得請求賠償","應視情況而定再決定是否得請求賠償","以上皆非"]},{"id":306,"category":"財產保險法規","source_no":71,"answer":"A","stem":"汽車交通事故發生時，被保險人或加害人應如何處理？ ①救助受害人 ②立即報警處理，可立即電話向承保公司報案，並於五日內以書面通知保險公司 ③被保險人、加害人及請求權人應與保險公司合作，提供人証、物証等有關資料及文件","options":["①②③","①②","②③","①③"]},{"id":307,"category":"財產保險法規","source_no":74,"answer":"D","stem":"保險業務員管理規則定義之經營同類保險業務所指為何？","options":["指所經營之業務同為經紀人業務或同為代理人業務","指所經營之業務同為業務員通路或同為銀行保險通路","指所經營之業務同為政策保險或同為社會保險","指所經營之業務同為財產保險或同為人身保險"]},{"id":308,"category":"財產保險法規","source_no":75,"answer":"B","stem":"保險契約由代理人訂立者，有何限制？","options":["不須載明代訂之意旨","應載明代訂之意旨","沒有任何限制","不可代為訂立"]},{"id":309,"category":"財產保險法規","source_no":76,"answer":"D","stem":"下列何者非我國保險法規定得僱用保險業務員從事保險招攬之行業","options":["保險合作社","保險經紀人公司","兼營保險代理人業務之銀行","保險公證人公司"]},{"id":310,"category":"財產保險法規","source_no":77,"answer":"C","stem":"保險經紀人保證金之繳存，得以下列何種方式為之？ ①現金 ②中央政府發行之無實體公債 ③股票 ④定存單","options":["①③④","①②③","①②","①②④"]},{"id":311,"category":"財產保險法規","source_no":78,"answer":"B","stem":"保險法之強制規定，不得以契約變更，但下列何種情形可以變更？","options":["有利保險人","有利被保險人","有利契約雙方當事人","有利於利害關係人"]},{"id":312,"category":"財產保險法規","source_no":79,"answer":"C","stem":"危險事故發生後，經鑑定係因要保人或被保險人未盡合理方法保護標的物，其結果依法為何","options":["保險人不負全部賠償責任","保險人仍負全部賠償責任","因而增加之損失，保險人不負賠償責任","視情況而定"]},{"id":313,"category":"財產保險法規","source_no":80,"answer":"C","stem":"下列何者為保險人以其所承保之危險，轉向他保險人為保險之契約行為","options":["複保險","單保險","再保險","共同保險"]},{"id":314,"category":"財產保險法規","source_no":81,"answer":"D","stem":"下列關於複保險之構成要件，依保險法之規定，何者錯誤","options":["同一保險利益","同一保險事故","數保險契約","保險期間之始期與終期均必須相同"]},{"id":315,"category":"財產保險法規","source_no":82,"answer":"A","stem":"機車所有人未投保強制汽車責任保險，若經公路監理機關或警察機關攔檢稽查舉發者，由公路主管機關處以罰鍰，處罰新臺幣多少元？","options":["1，500元以上3，000 元以下","2，000元以上3，000元以下","1，000元以上3，000元以下","3， 000元以上6，000元以下"]},{"id":316,"category":"財產保險法規","source_no":83,"answer":"A","stem":"契約經撤銷後其法律效力為何","options":["溯及自訂立契約時不生效力","自撤銷之後不生效力","經公證人公證之後不生效力","以上皆非"]},{"id":317,"category":"財產保險法規","source_no":84,"answer":"A","stem":"損害賠償除依個人資料保護法已有規定外，非公務機關適用何法之規定：","options":["民法","國家賠償法","民事訴訟法","強制執行法"]},{"id":318,"category":"財產保險法規","source_no":85,"answer":"B","stem":"保險業務員登錄證應於有效期間期滿前辦妥換發登錄證手續，未辦妥前其效力為何","options":["得繼續招攬保險","不得招攬保險","得招攬保險，但須向公司報備","在二個月寬限期內得繼續招攬保險"]},{"id":319,"category":"財產保險法規","source_no":86,"answer":"C","stem":"保險契約於下列何種情況下可以簽訂：","options":["保險人同意","要保人聲請","保險人於同意要保人聲請後","以上皆非"]},{"id":320,"category":"財產保險法規","source_no":87,"answer":"B","stem":"保險人破產時，保險契約及保險費如何處理？","options":["於破產宣告之日繼續有效，保費不須退還","於破產宣告之日終止保險契約，終止後之保險費，已交付者，保費應返還","於破產宣告之日終止，但不須返還保費","以上皆非"]},{"id":321,"category":"財產保險法規","source_no":88,"answer":"C","stem":"火災保險標的物受部份之損失者，保險人終止契約時，應於多久前通知要保人：","options":["5日","10日","15日","20日"]},{"id":322,"category":"財產保險法規","source_no":89,"answer":"C","stem":"對要保人、被保險人或第三人以誇大不實之宣傳、廣告或其他不當之方法為招攬，業務員將受何種處罰？ ①有犯罪嫌疑應依法移送偵辦 ②其行為時之所屬公司應按其情節輕重，予以三個月以上一年以下停止招攬行為之處分 ③其行為時之所屬公司應按情節輕重予以撤銷其業務員登錄 ④其行為時之所屬公司應按其情節輕重，予以一年以上五年以下停止招攬行為或撤銷其業務員登錄之處分","options":["①③④","①②③④","①②③","①②④"]},{"id":323,"category":"財產保險法規","source_no":90,"answer":"B","stem":"保險契約訂立時，僅保險人知危險已消滅者，下列何者不受契約之拘束","options":["被保險人","要保人","受益人","保險人"]},{"id":324,"category":"財產保險法規","source_no":91,"answer":"C","stem":"所謂的受益人指的是保險人與下列何者約定享有賠償請求權之人？ ①要保人 ②被保險人 ③第三人 ④受害人","options":["①②③④","①②④","①②","①③④"]},{"id":325,"category":"財產保險法規","source_no":92,"answer":"C","stem":"保險人知危險增加後，於何種情形下，喪失契約終止及損害賠償權利？ ①仍繼續收受保險費 ②危險發生後給付賠償金額 ③除前二項情形外，其他維持契約之表示者 ④要保人對於另定保險費不同意","options":["①②③④","①②④","①②③","① ③④"]},{"id":326,"category":"財產保險法規","source_no":93,"answer":"A","stem":"要保人違反據實說明義務，保險人有何權利：","options":["解除契約","直接拒賠","契約無效","終止契約"]},{"id":327,"category":"財產保險法規","source_no":94,"answer":"A","stem":"因汽車交通事故死亡者，請求權人得提出證明文件，請求保險人暫先給付相當於保險給付多少之金額？","options":["二分之一","三分之一","四分之一","五分之一"]},{"id":328,"category":"財產保險法規","source_no":95,"answer":"B","stem":"參加保險業務員資格測驗合格者，得填妥登錄申請書如何辦理登錄","options":["自行辦理登錄","由所屬公司為其向各有關公會辦理登錄","由公會為其辦理登錄","委託他人辦理登錄"]},{"id":329,"category":"財產保險法規","source_no":96,"answer":"B","stem":"洗錢防制法所稱因犯罪所得財物或財產上利益所指為何？ ①因特定犯罪而取得之財物 ②因特定犯罪而變得之財物 ③因特定犯罪而取得之財產上利益 ④因特定犯罪而取得之財產上利益及其孳息","options":["①②④","①②③④","①②③","①③④"]},{"id":330,"category":"財產保險法規","source_no":97,"answer":"B","stem":"加害人無照駕駛被保險汽車發生交通事故時，受害人或其請求權人規定向強制汽車責任保險之保險人請求賠償給付時，保險人應如何處理？","options":["不必賠償","應賠償後向加害人追償","依肇事責任判定","以上皆非"]},{"id":331,"category":"財產保險法規","source_no":101,"answer":"D","stem":"再保人不履行再保金額給付之義務，則下列敘述何者正確","options":["原保險人得拒絕履行其對被保險人之義務","原保險人得俟再保險人履行後再履行其對被保險人之義務","不論契約如何訂定，原保險人得協助被保險人對再保人提起訴訟","以上皆非"]},{"id":332,"category":"財產保險法規","source_no":102,"answer":"B","stem":"健康保險之保險人破產時，受益人對於保險人得請求之保險金額之債權，以其保單價值準備金按下列哪一項比例計算之","options":["保險金額","訂約時之保險費率","保險費","損失率"]},{"id":333,"category":"財產保險法規","source_no":103,"answer":"D","stem":"保險業經請主管機關許可後，並依法實施下列何項手續始得開始營業","options":["設立登記","繳存保證金","領得營業執照","以上皆是"]},{"id":334,"category":"財產保險法規","source_no":104,"answer":"B","stem":"保險契約之解釋有疑義時，依法應做如何解釋","options":["作有利保險人之解釋為原則","作有利被保險人之解釋為原則","參考民法之規定","提交公平會處理"]},{"id":335,"category":"財產保險法規","source_no":105,"answer":"D","stem":"依保險法規定下列有關特約條款之敘述，何者錯誤？","options":["與保險契約有關之一切事項，不限於將來事項，得以特約條款定之","保險契約當事人之一方違背特約條款時，他方得解除契約；其危險發生後亦同","關於未來事項之特約條款，於未屆履行期前危險已發生，或其履行為不可能，或在訂約地為不合法而未履行者，保險契約不因之而失效","與保險契約有關之一切事項，僅限於將來事項，始得以特約條款定之"]},{"id":336,"category":"財產保險法規","source_no":106,"answer":"B","stem":"保險業務員於收取客戶保險費後挪用，可能構成下列何種罪嫌","options":["詐欺","業務侵占","竊盜","強盜"]},{"id":337,"category":"財產保險法規","source_no":107,"answer":"A","stem":"保險經紀人以公司型態經營者，其前一年度營業收入未達新臺幣一千萬元者，應繳存多少保證金？","options":["新臺幣二十萬元","新臺幣四十萬元","新臺幣六十萬元","新臺幣八十萬元"]},{"id":338,"category":"財產保險法規","source_no":108,"answer":"B","stem":"依個人資料保護法規定，損害賠償請求權，自損害發生時起，逾幾年不行使而消滅：","options":["三年","五年","二年","七年"]},{"id":339,"category":"財產保險法規","source_no":109,"answer":"D","stem":"主管機關視各種保險之發展狀況，依下列何種資料分別規定其銷售前應採行之程序","options":["各種保險單條款","保險費","除保險單條款、保險費之其他相關資料","以上皆是"]},{"id":340,"category":"財產保險法規","source_no":110,"answer":"A","stem":"契約上載明保險標的一定價值之保險契約屬下列何種契約","options":["定值保險契約","不定值保險契約","任意性保險契約","強制性保險契約"]},{"id":341,"category":"財產保險法規","source_no":111,"answer":"B","stem":"保險經紀人投保專業責任保險者，其保險金額以公司型態經營者不得低於多少？","options":["新臺幣一百萬元","新臺幣兩百萬元","新臺幣三百萬元","新臺幣五百萬元"]},{"id":342,"category":"財產保險法規","source_no":112,"answer":"D","stem":"保險業電話行銷之錄音紀錄，至少應包含之資料，下列敘述何者正確？ ①保險公司簡介 ②要保人身分資料 ③投保意願按確認 ④承保範圍","options":["①②③④","②④","①②③","②③④"]},{"id":343,"category":"財產保險法規","source_no":113,"answer":"C","stem":"健康保險於訂立契約前，保險人對於被保險人得施以健康康檢查、檢查費用由誰負擔","options":["要保人","被保險人","保險人","受益人"]},{"id":344,"category":"財產保險法規","source_no":114,"answer":"A","stem":"合夥人或共有人聯合為被保險人時，其中一人或數人讓與保險利益於他人者，保險契約效力為何","options":["不因之而失效","得解除","得終止","無效"]},{"id":345,"category":"財產保險法規","source_no":115,"answer":"C","stem":"保險代理人同時具備財產保險及人身保險代理人資格者，下列何者為其原則上申領執業證書照規定","options":["未規定","得擇二","僅得擇一","以上皆非"]},{"id":346,"category":"財產保險法規","source_no":116,"answer":"A","stem":"健康保險契約，若被保險人不與要保人為同一人時，除應載明保險法第五十五條規定事項外，尚應記載那些事項？ ①被保險人姓名 ②被保險人年齡 ③被保險人住所 ④被保險人與要保人之關係","options":["①②③④","①②④","①②③","①③④"]},{"id":347,"category":"財產保險法規","source_no":117,"answer":"D","stem":"要保人、被保險人或受益人，遇有保險人應負保險責任之事故發生，除保險法令有規定，或契約另有規定外，應於知悉後幾日內通知保險人","options":["二十日","十日","十五日","五日"]},{"id":348,"category":"財產保險法規","source_no":118,"answer":"B","stem":"保險人得約定保險標的物之一部分，應由要保人自行負擔由危險而生之損失是為：","options":["自留額","自負額","共同類","責任額"]},{"id":349,"category":"財產保險法規","source_no":119,"answer":"B","stem":"保險業務員不服受停止招攬登陸、撤銷登錄處分者，得於受處分之通知到達之日起幾個月內，以書面具明理由向原處分公司提出申復？","options":["15日","1個月","2 個月","3個月"]},{"id":350,"category":"財產保險法規","source_no":120,"answer":"D","stem":"保險業務員經所屬公司授權從事保險招攬之行為，其授權方式，應如何行使","options":["口頭即可","不拘形式","書面為之即可","書面為之，並載明於登錄證上"]},{"id":351,"category":"財產保險法規","source_no":121,"answer":"D","stem":"火災保險標的物不能以市價估計者，應如何定其價值？","options":["得由保險公證人決定","得由保險代理人決定","得由保險經紀人決定","得由當事人約定"]},{"id":352,"category":"財產保險法規","source_no":122,"answer":"C","stem":"保險公證人投保專業責任保險者，其保險金額以公司型態經營者不得低於多少？","options":["新臺幣四百萬元","新臺幣三百萬元","新臺幣二百萬元","新臺幣一百萬元"]},{"id":353,"category":"財產保險法規","source_no":123,"answer":"C","stem":"保險法所稱主管機關指的是：","options":["經濟部","財政部","金融監督管理委員會","以上皆非"]},{"id":354,"category":"財產保險法規","source_no":124,"answer":"D","stem":"侵權行為之行為人係被保險人之家屬時，保險人有否代位求償權","options":["有代位求償權","無代位求償權","經被保險人同意，有代位求償權","只有在行為人係故意時，保險人始有代位求償權"]},{"id":355,"category":"財產保險法規","source_no":125,"answer":"A","stem":"業務員得招攬之保險種類，下列何者正確","options":["除應通過特別測驗者外，由其所屬公司定之","任何保險種類均可","僅人身保險","僅財產保險"]},{"id":356,"category":"財產保險法規","source_no":126,"answer":"C","stem":"下列何者屬於『依訂約時情形顯失公平致使該部份之約定無效』之情形?","options":["減輕要保人或被保險人之義務者","免除要保人或被保險人之義務者","加重要保人或被保險人之義務者","解除對於要保人會或被保險人重大不利益規定"]},{"id":357,"category":"財產保險法規","source_no":127,"answer":"C","stem":"保險契約由合夥人共有人中之一人或數人訂立，而其利益及於全體合夥人或共有人，依法應如何行使始屬有效？","options":["自然及於全體合夥人或共有人","如無相反意見，即視為及於全體合夥人或共有人","應載明為全體合夥人或共有人訂立之意旨","不需載明為全體合夥人或共有人訂立之意旨"]},{"id":358,"category":"財產保險法規","source_no":128,"answer":"B","stem":"保險契約成立後，對於契約所約定因不可預料或不可抗力之承保危險事故所造成的損害應由下列何者負賠償責任：","options":["被保險人","保險人","受益人","要保人"]},{"id":359,"category":"財產保險法規","source_no":129,"answer":"B","stem":"保險業資本嚴重不足，指資本適足率低於百分之多少？","options":[")一百","五十","七十","六十"]},{"id":360,"category":"財產保險法規","source_no":130,"answer":"C","stem":"保險契約若無規定，則依保險法之規定，遇有保險人應負保險責任之事故發生，被保險人應於何時限內為通知？","options":["知悉後10日","發生後72 小時","知悉後5日","發生後48小時"]},{"id":361,"category":"財產保險法規","source_no":131,"answer":"C","stem":"關於未來事項之特約條款，在何種情形下仍不因之使保險契約失效？ ①於未屆履行期前危險已發生 ②其履行為不可能 ③在訂約地為不合法而未履行","options":["①②③","②③","①②③","①③"]},{"id":362,"category":"財產保險法規","source_no":132,"answer":"B","stem":"下列何種情形屬危險增加要保人不需通知保險人？ ①損害之發生不影響之負擔者 ②危險增加，不由於要保人之行為所致者 ③為防護保險人之利益者 ④為履行道德上之義務","options":["①②④","①③④","①②③","①②③④"]},{"id":363,"category":"財產保險法規","source_no":133,"answer":"A","stem":"於再保險中，原保險契約之被保險人權利為何","options":["對於再保險人無賠償請求權。但原保險契約及再保險契約另有約定者不在此限","對於再保險人無賠償請求權，但原保險人破產時不在此限","對於再保險人有直接賠償請求權","可透過再保險經紀人行使賠償請求權"]},{"id":364,"category":"財產保險法規","source_no":134,"answer":"B","stem":"下列何者，其保險契約載明保險標的一定價值","options":["定額保險契約",")定值保險契約",")不定值保險契約","不定額保險契約"]},{"id":365,"category":"財產保險法規","source_no":135,"answer":"A","stem":"金融機構對於達一定金額以上之通貨交易應申報，該一定金額所指為多少：","options":["新臺幣五十萬元","新臺幣一百萬元","新臺幣一百五十萬元","新臺幣二百萬元"]},{"id":366,"category":"財產保險法規","source_no":136,"answer":"D","stem":"以下那一項非保險公證人之工作範圍：","options":["保險標的物之查勘、鑑定","保險標的物之估價","賠款之理算、治商","保險標的之修復"]},{"id":367,"category":"財產保險法規","source_no":137,"answer":"D","stem":"下列何種情形，保險業依法得以共保方式承保","options":["有關巨災損失之保險者","配合政府政策需要者","基於公共利益之考量者","以上皆是"]},{"id":368,"category":"財產保險法規","source_no":138,"answer":"B","stem":"訂約時，僅要保人知危險發生者，而保險人不受契約之拘束時應如何處理","options":["保險人不得請求償還費用，亦不得請求已收受之保險費","保險人得請償還費用，亦無須返還已收受之保險費","保險人不得請求償還費用，但得請求已收受之保險費","保險人得請求償還費用，不得請求已收受之保險費"]},{"id":369,"category":"財產保險法規","source_no":139,"answer":"D","stem":"依保險業保險代理人公司保險經紀人公司辦理電話行銷業務應注意事項之規定，於電話線上成立保險契約，財產保險業所銷售之商品組合每張保單年繳保費不得高於","options":["新臺幣三萬元","新臺幣六萬元","新臺幣十萬元","新臺幣五萬元"]},{"id":370,"category":"財產保險法規","source_no":140,"answer":"A","stem":"訂約時僅要保人知危險已發生者，下列何者不受契約之約束","options":["保險人","被保險人","受益人","保險經紀人"]},{"id":371,"category":"財產保險法規","source_no":141,"answer":"A","stem":"善意複保險，其保險金額之總額超過保險標的之價值者，於何時要保人得依超過部份，要求比例返還保險費？","options":["危險發生前","危險發生後","危險發生前或後","以上皆非"]},{"id":372,"category":"財產保險法規","source_no":142,"answer":"B","stem":"保險人與被保險人就賠款金額有爭議時，保險人應如何處理","options":["等法院之判決後賠付","就已認定賠付之部份先行賠付","申請公會調解後賠付","等雙方協議好再說"]},{"id":373,"category":"財產保險法規","source_no":143,"answer":"D","stem":"保險代理人是保險契約的：","options":["當事人","要保人","要保人之代理人","保險人之代理人"]},{"id":374,"category":"財產保險法規","source_no":144,"answer":"A","stem":"洗錢防制法所稱洗錢，係指 ①意圖掩飾或隱匿特定犯罪所得來源而移轉或變更特定犯罪所得 ②使他人逃避刑事追訴，而移轉或變更特定犯罪所得 ③掩飾或隱匿特定犯罪所得之本質 ④收受、持有或使用他人之特定犯罪所得","options":["①②③④","① ②④","①②③","①③④"]},{"id":375,"category":"財產保險法規","source_no":145,"answer":"A","stem":"保險金額不及保險標的物之價值者，除契約另有訂定外，保險人或被保險人為證明及估計損失所支出之費用，保險人依法如何負擔","options":["保險金對於保險標的物之價值比例定之","保險標的物之價值對於保險金額比例定之","保險金額對於重置保險標的物之費用比例定之","並無規定"]},{"id":376,"category":"財產保險法規","source_no":146,"answer":"D","stem":"要保人或被保險人不履行那些限期內通知義務者，對保險人因此所受損失，應負賠償責任","options":["保險事故消滅及危險減少","保險事故發生及危險減少","保險事故消滅及危險增加","保險事故發生及危險增加"]},{"id":377,"category":"財產保險法規","source_no":147,"answer":"C","stem":"保險人對戰爭所致的損害，下列何者敘述正確","options":["應負賠償責任","不負賠償責任","除契約有相反之訂定外，應負賠償責任","以上皆非"]},{"id":378,"category":"財產保險法規","source_no":148,"answer":"B","stem":"財產保險之要保人交付保險費後還沒有拿到保險單，但發生了保險單所承保的事故（如車輛碰撞），則：","options":["保險人不負賠償責任","保險人應負賠償責任","被保險人須申請主管機關調解","被保險人須申請交付仲裁"]},{"id":379,"category":"財產保險法規","source_no":149,"answer":"B","stem":"因救護保險標的物，致保險標的物發生損失者，下列何者正確","options":["由被保險人自行負擔","視同所保危險所生之損失","要另行加保才能賠償","須由保險人另行同意才能賠償"]},{"id":380,"category":"財產保險法規","source_no":150,"answer":"D","stem":"下列何種情形請求權人得依強制汽車責任保險法規定向特別補償基金請求補償？","options":["事故汽車無法查究，或事故汽車為未保險汽車","事故汽車保未經被保險人同意使用管理之被保險汽車","事故汽車全部或部分為無須訂立本保險契約之汽車","以上皆是"]},{"id":381,"category":"財產保險法規","source_no":151,"answer":"D","stem":"下列何者為強制汽車責任保險法規定，受害人死亡時，可請求保險給付或特別補償基金補償之人？","options":["父母","子女","配偶","以上皆是"]},{"id":382,"category":"財產保險法規","source_no":152,"answer":"A","stem":"依我國保險法之規定，下列何者負有交付保險費義務：","options":["要保人","保險經紀人","受益人","要保人的代理人"]},{"id":383,"category":"財產保險法規","source_no":153,"answer":"B","stem":"老張樓下鄰居把自己的住宅改成牛肉麵店，則老張對保險人應如何處理","options":["知悉後馬上通知保險人","知悉後十日內通知保險人","不通知保險人","想到再通知保險人"]},{"id":384,"category":"財產保險法規","source_no":154,"answer":"D","stem":"保險人辦理強制汽車責任保險之保險費，其預期損失與實際損失有差額時應如何處理？","options":["可收回作收益處理","繳存為安定基金","繳交特別補償基金運用","應提存為特別準備金，除因調整保險費率、調高保險金額、彌補純保險費虧損或依所定辦法處理外，不得收回、移轉或供其他用途"]},{"id":385,"category":"財產保險法規","source_no":155,"answer":"A","stem":"下列何者屬保險人賠償被保險人因他人不履行債務所致之損失之保險","options":["保證保險","擔保保險","信用保險","履約責任擔保"]},{"id":386,"category":"財產保險法規","source_no":156,"answer":"B","stem":"保險契約因惡意複保險而無效者，保險人在何時期內，仍取得保險費","options":["知情","不知情","不論知情或不知情","以上皆非"]},{"id":387,"category":"財產保險法規","source_no":157,"answer":"C","stem":"依我國保險法之規定於保險事故發生時，遭受損害，而享有賠償請求權之人，係指下列何者：","options":["要保人","受益人","被保險人","利害關係人"]},{"id":388,"category":"財產保險法規","source_no":158,"answer":"C","stem":"下列何者敘述是錯的？","options":["業務員從事產物保險招攬行為，必須得到所屬公司授權","前項授權行為應以書面為之，並載明於其登錄證上","同時登錄為財產保險及人身保險業務員者，其分別登錄之所屬公司不必依法負連帶責任","業務員招攬行為，所生之損害，所屬公司就其授權範圍應負連帶責任"]},{"id":389,"category":"財產保險法規","source_no":159,"answer":"A","stem":"危險減少時，被保險人得請求保險人如何處理","options":["重新核定保費","下年度續保時減費","增加保費","以上皆非"]},{"id":390,"category":"財產保險法規","source_no":160,"answer":"A","stem":"依個人資料保護法規定，當事人就其個人資料得行使權利，以下何者為其不得預先拋棄或以特約限制之？ ①查詢或請求閱覽 ②請求製給複製本③請求補充或更正 ④請求停止蒐集、處理或利用","options":["①②③④","①②④","①②③","①③④"]},{"id":391,"category":"財產保險法規","source_no":161,"answer":"D","stem":"以下何者符合保險業保險代理人公司保險經紀人公司辦理電話行銷業務應注意事項，於電話線上成立保險契約之規定","options":["要保人與被保險人同為一人","要保人與被保險人須年滿二十歲","須由電話行銷中心外撥電話之對象","以上皆是"]},{"id":392,"category":"財產保險法規","source_no":162,"answer":"B","stem":"有重大喪失債信情事尚未了結或了結後尚未逾三年之已登錄保險業務員，應如何處置","options":["維持登錄","所屬公司應通知各有關公會註銷登錄","撤銷或維持登錄均可","經允許可維持登錄"]},{"id":393,"category":"財產保險法規","source_no":163,"answer":"A","stem":"公務機關或非公務機關依個人資料保護法規定向當事人蒐集個人資料時，應明確告知當事人下列何事項？ ①蒐集之目的 ②個人資料之類別 ③個人資料利用之期間、地區、對象及方式 ④公務機關或非公務機關名稱","options":["①②③④","①②④","①②③","①③④"]},{"id":394,"category":"財產保險法規","source_no":164,"answer":"A","stem":"以下那些屬洗錢防制法所稱金融機構？ ①銀行 ②保險公司 ③證券商 ④辦理儲金匯兌、簡易人壽保險業務之郵政機構","options":["①②③④","①②④","①②③","①③ ④"]},{"id":395,"category":"財產保險法規","source_no":165,"answer":"C","stem":"下列何者屬火災保險人須賠償給被保險人損失？ ①保險標的物之毀損滅失 ②因救護保險標的物所致保險標的物之損失 ③避免或減輕損害之必要行為所生之費用","options":["①②","②③","①②③","①③"]},{"id":396,"category":"財產保險法規","source_no":166,"answer":"A","stem":"保險業務員經登錄後，下列何者正確 ①應專為其所屬公司從事保險之招攬 ②可同時為多家同為以產保險公司從事保險招攬 ③可同時為多家同為人身保險公司從事保險招攬 ④保險經紀人公司之業務員取得相關資格，得登錄於另一家非經營同類保險業務之保險經紀人公司，並以一家為限。","options":["①④","②③","①②③","② ③④"]},{"id":397,"category":"財產保險法規","source_no":167,"answer":"C","stem":"保險代理人執行業務所需應保留文件期限，除法令另有規定外，其期限至少幾年？","options":["一年","三年","五年","七年"]},{"id":398,"category":"財產保險法規","source_no":168,"answer":"B","stem":"保險業務員有下列何種情事時，除有犯罪嫌疑，應依法移送偵辦外，其行為時之所屬公司並應按情節輕重，予以三個月以上一年以下停止招攬行為或撤銷其業務員登錄之處分？ ①未經所屬公司同意而招聘人員 ②代要保人或被保險人簽章 ③ 以登錄證供他人使用或使用他人登錄證 ④招攬或推介未經主管機關核准或備查之保險業務或其他金融商品","options":["①③④","①②③④","①②③","①②④"]},{"id":399,"category":"財產保險法規","source_no":169,"answer":"B","stem":"變更財產保險契約或恢復停止效力之財產保險契約時，保險人於接到通知後，幾日內不為拒絕者，視為承諾","options":["五日","十日","十五日","二十日"]},{"id":400,"category":"財產保險法規","source_no":170,"answer":"B","stem":"下列何者屬被保險人為避免或減輕損害之必要行為所生之費用","options":["救助費用","損害防阻費用","救災費用","以上皆非"]},{"id":401,"category":"財產保險法規","source_no":171,"answer":"C","stem":"業務員申請登錄之文件如有虛偽之記載，則","options":["各有關公會應不予登錄","已登錄者，所屬公司應通知各有關公會註銷登錄","以上皆是","以上皆非"]},{"id":402,"category":"財產保險法規","source_no":172,"answer":"A","stem":"保險公司刊登、播放廣告及進行業務招攬或營業促銷活動時，下列敘述何者正確？ ①不得有虛偽、詐欺、隱匿或其他足致他人誤信之情事 ②應確保其廣告內容之真實 ③對金融消費者所負擔之義務不得低於前述廣告之內容 ④對金融消費者所負擔之義務不得低於營業促銷活動時對金融消費者所提示之資料或說明","options":["①② ③④","①②","①②③④","①②④"]},{"id":403,"category":"財產保險法規","source_no":173,"answer":"B","stem":"保險費依法應由何人依契約規定交付？","options":["被保險人","要保人","受益人","以上皆可"]},{"id":404,"category":"財產保險法規","source_no":174,"answer":"B","stem":"於不定值保險契約，理賠時保險標的之價值於何時估算確定？","options":["訂約時","危險發生後","視情況而定","沒有規定"]},{"id":405,"category":"財產保險法規","source_no":175,"answer":"A","stem":"強制汽車責任保險的保險人應於本保險契約成立後幾個工作日將承保資料傳輸至主管機關及中央交通主管機關指定之機關（構）？","options":["四個工作日","十個工作日","十五個工作日","三十個工作日"]},{"id":406,"category":"財產保險法規","source_no":176,"answer":"C","stem":"下列何者不適用損害填補原則","options":["火災保險","海上保險","傷害保險","汽車保險"]},{"id":407,"category":"財產保險法規","source_no":177,"answer":"C","stem":"保險業保險代理人公司保險經紀人公司辦理電話行銷業務應注意事項係為規範下列何者訂定？ ①保險業、保險代理人公司及保險經紀人公司以電話行銷方式招攬保險之行為 ②保障消費大眾權益 ③維護保險業、保險代理人公司及保險經紀人公司之專業形象 ④協助保險業、保險代理人公司及保險經紀人公司招攬保險","options":["① ③④","①②④","①②③","①②③④"]},{"id":408,"category":"財產保險法規","source_no":178,"answer":"C","stem":"下列何種情事為強制汽車責任保險法規定，受害人或其他請求權人，致被保險汽車發生汽車交通事故者，保險人不負保險給付之責？","options":["故意行為所致","從事犯罪行為所致","故意行為或從事犯罪行為所致","吸食毒品行為所致"]},{"id":409,"category":"財產保險法規","source_no":179,"answer":"B","stem":"要保人未據實說明告知之義務，下列何者正確","options":["保險人得解除契約，已收受之保險費應全部返還","保險人得解除契約，已收受之保險費無須返還","保險人得終止契約，已收受之保險費應按短期保險費之規定返還","保險人得終止契約，已收受之保險費應按日數比例返還"]},{"id":410,"category":"財產保險法規","source_no":180,"answer":"C","stem":"保險標的以約定價值為保險金額者，火災保險之保險標的，發生全部或部份損失時，計算賠償的標準為何：","options":["訂約時的實際價值","發生事故時，的實際價值","保險人與被保險人間的約定價值","視個案而定"]},{"id":411,"category":"財產保險法規","source_no":181,"answer":"C","stem":"兼有保險代理人、經紀人或公證人資格者，下列何者為其申領執業證書照規定","options":["得擇二","得擇三","僅得擇一","未規定"]},{"id":412,"category":"財產保險法規","source_no":182,"answer":"B","stem":"除保險契約另有訂定外，被保險人死亡時，保險契約仍為何人的利益而存在？","options":["要保人","繼承人","受讓人","被保險人"]},{"id":413,"category":"財產保險法規","source_no":183,"answer":"A","stem":"以下何項屬保險法規定保險單必須記載的事項？ ①保險事故之種類 ②保險責任開始之日時及保險期間 ③保險金額 ④保險費","options":["①②③④","①②④","①②③","①③④"]},{"id":414,"category":"財產保險法規","source_no":184,"answer":"A","stem":"保險法規定保險人對於被保險人為避免或減輕損害之必要行為所生之費用負償還之責用意為何","options":["鼓勵被保險人減少損害","儘可能多想辦法增加保險給付","提高大家對保險的興趣","以上皆是"]},{"id":415,"category":"財產保險法規","source_no":185,"answer":"A","stem":"以受僱人之不誠實行為為保險事故之保證保險契約，應記載下列哪些事項？ ①保險法第五十五條規定記載事項 ②被保險人之姓名及住所 ③受僱人之姓名、職稱 ④其他得以認定為受僱人之方式","options":["①②③④","①②","①②③","①③④"]},{"id":416,"category":"財產保險法規","source_no":186,"answer":"A","stem":"保險代理人分為財產保險代理人及人身保險代理人之法規依據為何","options":["保險代理人管理規則","保險經紀人管理規則","保險公證人管理規則","保險業務員管理規則"]},{"id":417,"category":"財產保險法規","source_no":187,"answer":"B","stem":"依個人資料保護法規定，指以任何方式取得個人資料即謂","options":["處理","蒐集","利用","傳輸"]},{"id":418,"category":"財產保險法規","source_no":188,"answer":"B","stem":"財產保險經紀人公司執行或經營保險經紀業務時，應於那些文件留存建檔備供查閱？ ①要保書 ②批改申請書 ③終止契約申請書 ④瞭解要保人及被保險人之需求、適合度分析評估及洽訂保險契約分析報告書。","options":["①③④","①②③④","① ②③","①②④"]},{"id":419,"category":"財產保險法規","source_no":189,"answer":"B","stem":"被保險汽車發生交通事故時，被保險人或加害人應立即報請當地警、憲機關處理，並應於幾日內以書面通知保險人?","options":["三日","五日","七日","十日"]},{"id":420,"category":"財產保險法規","source_no":190,"answer":"D","stem":"為他人利益訂立之保險契約，於訂約時，該他人未確定者，由何人享受其利益？","options":["被保險人","債權人","繼承人","要保人或保險契約所載可得確定之受益人"]},{"id":421,"category":"財產保險法規","source_no":191,"answer":"C","stem":"陸上、內河及航空保險人，對於保險標的物，因陸上、內河及航空一切事變及災害所致之毀損、滅失及費用，負賠償之責。例外情形為何?","options":["除民法另有規定外","除民用航空法另有規定外","除契約另有訂定外","除公路法另有規定外"]},{"id":422,"category":"財產保險法規","source_no":192,"answer":"B","stem":"下列何者屬保險人所應負責的危險事故：","options":["不可預料或不可抗力之危險事故","保險契約所承保之危險事故","概括的危險事故","實際危險事故"]},{"id":423,"category":"財產保險法規","source_no":193,"answer":"B","stem":"火災保險之保險標的物非因保險契約所載之保險事故而完全滅失時，保險契約效力為何","options":["解除","終止","撤銷","無效"]},{"id":424,"category":"財產保險法規","source_no":194,"answer":"C","stem":"保險契約訂約時情形而有顯失公平者，於下列情事中，何種約定並非當然無效","options":["免除或減輕保險人依本法應負之義務者","使要保人、受益人或被保險人拋棄或限制其依本法所享之權利者","保險單條款文字解釋上發生疑義","加重要保人或被保險人之義務者"]},{"id":425,"category":"財產保險法規","source_no":195,"answer":"B","stem":"依保險法規定，自負額部份，要保人是否可另向他保險人訂立保險契約？","options":["可以","不得","保險法未規定","依保險契約規定"]},{"id":426,"category":"財產保險法規","source_no":196,"answer":"D","stem":"下列何者為強制汽車責任保險之要保人得終止本保險契約的事由？","options":["被保險汽車之牌照已繳銷","被保險汽車報廢","被保險汽車因所有權移轉且移轉後之新車主已投保本保險契約致發生重複投保情形","以上皆是"]},{"id":427,"category":"財產保險法規","source_no":197,"answer":"A","stem":"強制汽車責任保險法規定之請求權人包括那些人？ ①因汽車交通事故，遭致傷害之受害本人 ②因汽車交通事故死亡者，為受害人之父母 ③因汽車交通事故死亡者，為受害人之子女 ④因汽車交通事故死亡者，為受害人之配偶","options":["①②③④","①②④","①②③","①③④"]},{"id":428,"category":"財產保險法規","source_no":198,"answer":"D","stem":"保險業務員有異動時，所屬公司應於異動後幾日內向各有關公會申報","options":["三十日","二十日","十日","五日"]},{"id":429,"category":"財產保險法規","source_no":199,"answer":"D","stem":"下列何者不屬保險法規定財產保險","options":["火災保險","陸空保險","保證保險","年金保險"]},{"id":430,"category":"財產保險法規","source_no":200,"answer":"D","stem":"要保人有為隱匿或遺漏不為說明，或為不實說明，足以變更或減少保險人對於危險之估計者，保險人得解除契約。但在何種情形下，保險人不得解除契約：","options":["要保人死亡","危險未發生","危險已發生","要保人證明危險之發生未基於其說明或未說明之事實"]},{"id":431,"category":"財產保險法規","source_no":201,"answer":"A","stem":"火災保險之被保險人為證明及估計損失所支出之必要費用，依法如何處理","options":["除契約另有訂定外，由保險人負擔","一律由保險人負擔","一律由被保險人負擔","臨時協議決定"]},{"id":432,"category":"財產保險法規","source_no":202,"answer":"C","stem":"業務員應依保險業務員管理規則辦理登錄並領得下列何種證書件，始得為其所屬公司招攬保險","options":["資格證書","執業證書","登錄證","以上皆非"]},{"id":433,"category":"財產保險法規","source_no":203,"answer":"A","stem":"依我國法律及實務，保險人行使法定代位求償權時：","options":["要用保險人之名義","要用被保險人之名義","一定要由保險人與被保險人共同名義","視情況而定"]},{"id":434,"category":"財產保險法規","source_no":204,"answer":"C","stem":"保險業務員參加教育訓練成績不合格，於多久內再行補訓成績仍不合格者，所屬公司應撤銷其業務員登錄。","options":["三個月內","半年內","一年內","二年內"]},{"id":435,"category":"財產保險法規","source_no":205,"answer":"C","stem":"除另有約定外，複保險要保人應將下列何種資料通知各保險人：","options":["他保險人之名稱","他保險人之保險金額","以上皆是","以上皆非"]},{"id":436,"category":"財產保險法規","source_no":206,"answer":"B","stem":"危險達於應增加保險費或終止契約之程度者，依法如何處理","options":["由於要保人或被保險人之行為所致者，應於知悉後通知","由於要保人或被保險人之行為所致者，應先通知","不由於要保人或被保險人之行為所致者，應先通知","不由於要保人或被保險人之行為所致者，應於知悉後5日內通知"]},{"id":437,"category":"財產保險法規","source_no":207,"answer":"A","stem":"保險契約訂立時，保險標的之危險已發生或已消滅，原則上其契約效力如何","options":["無效","得終止","得解除","維持原狀"]},{"id":438,"category":"財產保險法規","source_no":208,"answer":"C","stem":"依金融消費者保護法規定，金融服務業與金融消費者訂立提供金融商品或服務之契約前，應為下列何者之行為？ ①應向金融消費者充分說明該金融商品、服務及契約之重要內容 ②應向金融消費者充分揭露其風險 ③應保證金融消費者獲利 ④ 應與其他金融商品作比較","options":["①②③④","①②④","①②","①②③"]},{"id":439,"category":"財產保險法規","source_no":209,"answer":"A","stem":"依我國保險法之規定，保險代理人代理保險人經營業務的根據為何","options":["代理契約或授權書","保險契約","合作協定","委任狀"]},{"id":440,"category":"財產保險法規","source_no":210,"answer":"B","stem":"保險人對於由不可預料或不可抗力之事故所致之損害，負賠償責任，例外情形為何？","options":["由保險契約內容推論","保險契約內有明文限制者","順應情勢變更原則","符合公平正義原則"]},{"id":441,"category":"財產保險法規","source_no":211,"answer":"C","stem":"保險業在何種情形下，因遭受損失得請求安定基金予以低利貸款或墊支？","options":["承受經營不善同業之契約","與經營不善同業進行合併","以上皆是","以上皆非"]},{"id":442,"category":"財產保險法規","source_no":212,"answer":"B","stem":"保險人於保險契約中免除或減輕自己依保險法應負義務之約定者，該部分之契約效力如何？","options":["有效","無效","一樣","不變"]},{"id":443,"category":"財產保險法規","source_no":213,"answer":"C","stem":"金融機構對於達一定金額以上之通貨交易，應於交易完成後多久以內以媒體申報方式，向法務部調查局申報：","options":["二個營業日","三個營業日","五個營業日","七個營業日"]},{"id":444,"category":"財產保險法規","source_no":214,"answer":"B","stem":"關於業務員從事保險招攬行為，下列敘述何者錯誤？","options":["所屬公司對其登錄之業務員應嚴加管理，並就其業務員招欖行為所生之損害依法應負連帶責任","業務員轉送要保文件及保險單不屬於保險招攬行為","業務員招攬涉及人身保險之商品者，應親晤要保人及被保險人","業務員應於所招攬之要保書上親自簽名並記載其登錄字號"]},{"id":445,"category":"財產保險法規","source_no":215,"answer":"C","stem":"下列何者為應訂立強制汽車責任保險契約的汽車種類的依據？","options":["公路法的規定","保險法的規定","強制汽車責任保險法規定由主管機關會同中央交通主管機關訂定公告之","汽車所有人自由選擇投保"]},{"id":446,"category":"財產保險法規","source_no":216,"answer":"C","stem":"要保人破產時，保險契約仍為下列何者利益而存在？","options":["繼承人","受益人","破產債權人","被保險人"]},{"id":447,"category":"財產保險法規","source_no":217,"answer":"D","stem":"依金融機構防制洗錢辦法規定，通貨交易所指為何？ ①單筆現金收入 ②單筆現金付出 ③換鈔交易 ④在會計處理上，凡以現金收支傳票記帳者皆屬之","options":["①③ ④","①②④","①②③","①②③④"]},{"id":448,"category":"財產保險法規","source_no":218,"answer":"A","stem":"以債務人之不履行債務為保險事故之保證保險契約，應記載下列哪些事項？ ①保險法第五十五條規定記載事項 ②被保險人之姓名及住所 ③債務人之姓名 ④其他得以認定為債務人之方式","options":["①②③④","①②","①②③","①③④"]},{"id":449,"category":"財產保險法規","source_no":219,"answer":"B","stem":"要保人不實之說明，足以變更或減少保險人對於危險之估計者，致保險契約被解除時，保險費如何處理","options":["應返還","無須返還","可返還一半","視個案而定"]},{"id":450,"category":"財產保險法規","source_no":220,"answer":"C","stem":"保險金額超過保險標的價值之契約。如無詐欺情事者，其契約僅於保險標的價值之限度內為有效，例外情形為何？","options":["定額保險","不足額保險","定值保險","不定值保險"]},{"id":451,"category":"財產保險法規","source_no":221,"answer":"B","stem":"火災保險損失之估計，因可歸責於保險人之事由而遲延者，應自被保險人交出損失清單多久後加給利息","options":["半個月","一個月","二個月","三個月"]},{"id":452,"category":"財產保險法規","source_no":222,"answer":"A","stem":"依我國法定代位制度規定，保險人行使代位求價權時，所行使的是誰的權利","options":["保險人","被保險人","保險人與被保險人","第三人"]},{"id":453,"category":"財產保險法規","source_no":223,"answer":"C","stem":"保險契約為當事人「一方」交付保險費，換取他方於保險事故發生時負責賠償的契約。其中的「一方」是指？","options":["被保險人","保險人","要保人","受益人"]},{"id":454,"category":"財產保險法規","source_no":224,"answer":"A","stem":"保險標的物非因承保事故而全部滅失，下列何者敘述正確","options":["保險契約終止，終止後之保險費已交付者應返還","保險契約解除，全部之保險費已交付者應返還","保險契約無效，全部之保險費應返還","保險契約無效，終止後之保險費已交付者應返還"]},{"id":455,"category":"財產保險法規","source_no":225,"answer":"C","stem":"保險業經營各種保險之保險單條款規定如何","options":["限使用本國文字","應使用國際上通用之文字","應使用中文，但因業務需要，得使用外文，並附中文譯本或節譯本","視情況而定"]},{"id":456,"category":"財產保險法規","source_no":226,"answer":"A","stem":"下列何者為辦理保險標的物之查勘、鑑定及估價與賠款之理算、洽商而予證明之人","options":["公證人","理算師","精算師","工程人員"]},{"id":457,"category":"財產保險法規","source_no":227,"answer":"A","stem":"保險經紀人以個人名義執行業務者，應繳存多少保證金？","options":["新臺幣十萬元","新臺幣二十萬元","新臺幣三十萬元","新臺幣五十萬元"]},{"id":458,"category":"財產保險法規","source_no":228,"answer":"B","stem":"責任保險人在何種情況下可以直接對第三人為賠償金額之給付：","options":["應第三人要求","經被保險人通知","應受益人要求","應第三人之家屬要求"]},{"id":459,"category":"財產保險法規","source_no":229,"answer":"D","stem":"汽車交通事故致受害人傷害或死亡者，加害人基於何種情況下，請求權人得依強制汽車責任保險法規定向保險人或特別補償基金請求保險給付或補償？","options":["須加害人負有完全之肇事責任","受害人與加害人已完成和解","須加害人的肇事責任較重，受害人的肇事責任較輕","不論加害人有無過失"]},{"id":460,"category":"財產保險法規","source_no":230,"answer":"B","stem":"責任保險之被保險人因受第三人之請求而為抗辯所支出之訴訟上或訴訟外必要之抗辯費用如何處理","options":["一律由保險人負擔","除契約另有訂定外，由保險人負擔","由保險人與被保險人共同負擔","視費用之性質而定"]},{"id":461,"category":"財產保險法規","source_no":231,"answer":"B","stem":"無行為能力或限制行為能力或受輔助宣告尚未撤銷者申請登錄保險業務員應如何處理？","options":["可予登錄","不予登錄","經特准可予登錄","可自由決定登錄"]},{"id":462,"category":"財產保險法規","source_no":232,"answer":"C","stem":"要保人對於危險之說明，有為隱置或遺漏不為說明或，不實之說明者，足以變更或減少保險人對於危險之估計者，保險人得解除契約自何時起算一個月不行使而消滅？","options":["自要保人知情之日","自被保險人知情之日","自保險人知情之日","自受益人知情之日"]},{"id":463,"category":"財產保險法規","source_no":233,"answer":"A","stem":"財產保險之被保險人如不同意保險契約之基本條款，原則上可如何處理","options":["可以要求保險公司變更","絕對不可以要求保險公司變更","找關係要求變更","收到保險單後再說"]},{"id":464,"category":"財產保險法規","source_no":234,"answer":"A","stem":"汽車交通事故發生時，如事故汽車全部為無須訂立強制汽車責任保險契約之汽車者，則各事故汽車之何人是不得向汽車交通事故特別補償基金請求補償？","options":["駕駛人","乘客","車外第三人","以上皆是"]},{"id":465,"category":"財產保險法規","source_no":235,"answer":"A","stem":"契約無效所指為何","options":["法律規定自始後無效","經解除後無效","經撤銷後無效","經終止後無效"]},{"id":466,"category":"財產保險法規","source_no":236,"answer":"A","stem":"保險代理人向下列何人收取費用並代理經營業務","options":["保險人","被保險人","要保人","受益人"]},{"id":467,"category":"財產保險法規","source_no":237,"answer":"A","stem":"第三人利益契約，認定受益人有疑義時，依法推定為何","options":["要保人為自己之利益而訂立","要保人為被保險人之利益而訂立","要保人為其繼承人之利益而訂立","以上皆是"]},{"id":468,"category":"財產保險法規","source_no":238,"answer":"C","stem":"金融機構對於達一定金額以上之通貨交易應向何單位申報：","options":["財政部","稅捐處","法務部調查局","法院"]},{"id":469,"category":"財產保險法規","source_no":239,"answer":"B","stem":"火災保險損失未估定前，要保人或被保險人為公共利益或避免擴大損失，雖未經保險人同意對於保險標的物可否加以變更？","options":["不得加以變更","得加以變更","保險法沒有規定","以上皆非"]},{"id":470,"category":"財產保險法規","source_no":240,"answer":"B","stem":"保險代理合約之內容，至少應包括下列那些項目？ ①代理期限 ②代理權限範圍 ③佣酬支付標準及方式 ④防範利益衝突","options":["①③④","①②③④","①②③","① ②④"]},{"id":471,"category":"財產保險法規","source_no":241,"answer":"A","stem":"保險人對於危險增加要求增加保險費而要保人不同意者，保險契約得如何處理","options":["終止","得解除","無效","得撤銷"]},{"id":472,"category":"財產保險法規","source_no":242,"answer":"D","stem":"保險人對於下列何者所致損害，應負賠償責任","options":["要保人之受僱人","被保險人之受僱人","要保人或被保險人所有之物或動物","以上皆是"]},{"id":473,"category":"財產保險法規","source_no":243,"answer":"A","stem":"保險業自有資本與風險資本之比率，不得低於多少？","options":["百分之二百","百分之一百","百分之三百","百分之二百五十"]},{"id":474,"category":"財產保險法規","source_no":244,"answer":"A","stem":"經紀人公司申請同時經營保險經紀業務及再保險經紀業務者，最低實收資本額為多少？","options":["新臺幣一千萬元","新臺幣九百萬元","新臺幣七百萬元","新臺幣六百萬元"]},{"id":475,"category":"財產保險法規","source_no":245,"answer":"C","stem":"洗錢防制法所稱特定犯罪，包括最輕本刑為多久以上有期徒刑以上之刑之罪","options":["一年","三年","六月","七年"]},{"id":476,"category":"財產保險法規","source_no":246,"answer":"C","stem":"個人資料保護法係為規範個人資料於被他人著手何種行為下應予保護，以避免人格權受侵害，並促進個人資料之合理利用？①蒐集 ②處理 ③利用","options":["①②","② ③","①②③","①③"]},{"id":477,"category":"財產保險法規","source_no":247,"answer":"A","stem":"保險代理人管理規則區分保險代理人為哪兩種","options":["財產及人身保險代理人","特別及一般保險代理人","專屬及普通保險代理人","單一及多數保險代理人"]},{"id":478,"category":"財產保險法規","source_no":248,"answer":"B","stem":"保險人行使代位求償權之基本條件是被保險人對於何者應有損失賠償請求權","options":["保險人","第三人","受益人","要保人"]},{"id":479,"category":"財產保險法規","source_no":249,"answer":"C","stem":"保險業務員資格取得之學歷限制為何","options":["國小以上學歷","國中以上學校畢業或同等學歷","高中（職）以上學校畢業或同等學歷","無學歷限制"]},{"id":480,"category":"火災保險","source_no":3,"answer":"D","stem":"有關自負額的敘述何者為非?","options":["保險公司賠償前應扣除自負額","自付額由被保險人負擔","自負額可以提醒被保險人注意防範損失","因為計算自負額，保險公司理賠處理成本略為提高"]},{"id":481,"category":"火災保險","source_no":4,"answer":"B","stem":"「商業火災保險」除了承保因火災事故造成之損失外，尚包括因_____所致之損失。","options":["颱風","閃電雷擊","地震","罷工、暴動、民眾騷擾"]},{"id":482,"category":"火災保險","source_no":5,"answer":"C","stem":"投保住宅火災附加「擴大地震保險附加條款」，若發生地震損失時，下列何者不屬於保險人應負擔之責任？","options":["地震引起之火災、爆炸","地震引起之地層下陷、滑動","地震引起輻射汙染之損失","建築物毀損不適合居住所支出臨時住宿費用"]},{"id":483,"category":"火災保險","source_no":6,"answer":"D","stem":"依據產物保險商業同業公會所訂自律規範，產險公司違反下列哪一個查核項目，將受自律所訂罰則之處分？","options":["由未具有保險代理人、保險經紀人、保險業務員資格者招攬業務","要保書未經招攬業務之保險業務員或保險代理人或保險經紀人之簽署人簽署","傭金支付對象與要保書上所列業務員或保險代理人、經濟人簽署人不同者","以上皆是"]},{"id":484,"category":"火災保險","source_no":7,"answer":"D","stem":"所稱「巨大保額商業火災保險業務」的定義，以下敘述何者正確？","options":["單一保險標的物地址範圍之火險財產保險金額在新台幣三十億元以上者","同一法人之火險財產保險金額在新台幣五十億元以上者","同一集團企業之火險財產保險金額在新台幣一百億元以上者","以上皆是"]},{"id":485,"category":"火災保險","source_no":8,"answer":"B","stem":"依商業火災保險附加條款（SB）「保險金額自動增加條款」之約定，保險人對保險標的物（貨物除外）的變動、增加或改良致實際價值增加者，保險公司均自動承保，惟以不超過各項保險標的物金額百分之","options":["5%","10%","20%","無上限"]},{"id":486,"category":"火災保險","source_no":9,"answer":"A","stem":"「商業火災保險」附加之「地震險」，其費率釐訂因素不包括","options":["建築年份","建築物結構","建築物所在地區","樓層數"]},{"id":487,"category":"火災保險","source_no":10,"answer":"B","stem":"有關我國產險市場費率自由化，下列敘述何者不正確？","options":["自民國91年起分三階段實施","開放價格競爭","開放業者依精算原理原則自訂費率","廢除規章費率"]},{"id":488,"category":"火災保險","source_no":11,"answer":"B","stem":"政策性住宅地震基本保險於承保之住宅建築物因地震造成全損時，依保險金額理賠，所稱「全損」之鑑定人員，下列何者不具資格？","options":["保險業理賠、查勘或損防人員領有受訓合格證明之合格評估人員者","鄉里長或縣市政府公職人員","建築師公會或結構、土木、大地技師公會","保險公證人，領有受訓合格證明之合格評估人員者"]},{"id":489,"category":"火災保險","source_no":12,"answer":"D","stem":"依「住宅火災及地震基本保險」或「商業火災保險」附加之「自動消防裝置滲漏險」之約定，下列何種原因導致自動消防裝置意外滲漏，所致保險標的物之損失，保險人不負賠償責任？","options":["修繕或加建建築物","修繕、改裝、擴充或遷移自動消防裝置","冰凍","以上皆是"]},{"id":490,"category":"火災保險","source_no":13,"answer":"C","stem":"政策性住宅地震基本保險之費率結構為","options":["純保險費站保險費55.5%，附加費用占保險費44.5%","純保險費站保險費62.5%，附加費用占保險費37.5%","純保險費站保險費85%，附加費用占保險費15%","純保險費站保險費100%，附加費用占保險費0%"]},{"id":491,"category":"火災保險","source_no":14,"answer":"C","stem":"當颱風來襲時，下列何種原因所致保險標的物之毀損或滅失，非屬「住宅火災及地震基本保險」或「商業火災保險」附加之「颱風及洪水險」之承保範圍？","options":["河川氾濫","海水倒灌","土石流","水壩崩潰造成水災"]},{"id":492,"category":"火災保險","source_no":15,"answer":"D","stem":"下列何者將違反產險公會訂定之「產險業自律監控組織及作業準則」？","options":["產險業報送統計資料未依財團法人保險事業發展中心所訂統計規程分拆危險分類報送資料","核保人員未確實依據報送保險商品精算費率內容予以評估承保","產險業未於所屬網際網路揭露個人任意汽車保險及住宅火災保險，要保人直接採購或投保時，與保險代理人或保險經紀人兼優惠內容之差異","以上皆是"]},{"id":493,"category":"火災保險","source_no":16,"answer":"D","stem":"在我國之跨國性外資企業，如欲依照其投資公司以跨國性業務（Worldwide Account）之費率投保火險者，應具備下列哪項條件？","options":["取得經濟部之外資證明文件者","外資股份或外資股東之出資額佔百分之五十以上者","除我國以外在不同二國家或地區以上投資者","以上皆是"]},{"id":494,"category":"火災保險","source_no":17,"answer":"D","stem":"火災保險不可以特別約定加保之危險事故有","options":["火山爆發","輻射污染","戰爭","以上皆是"]},{"id":495,"category":"火災保險","source_no":18,"answer":"B","stem":"王大同居住在某公寓2樓，向A產險公司投保「住宅火災及地震基本保險」，於保險期間內王大同家發生火災，因消防水灌救，致居住在1樓的李小明家的家具及電器遭到損壞，財物損失達30萬元，依該保單條款之規定，李曉明的財物損失如何獲得賠償？","options":["李小明未投保「住宅火災及地震基本保險」，無法獲得賠償。","由王大同投保之A保險公司依第三人責任險補償","李小明家未遭火災延燒，故王大同投保之A保險公司不負賠償責任","以上皆非"]},{"id":496,"category":"火災保險","source_no":19,"answer":"C","stem":"按「商業火災保險」與「住宅火災及地震基本保險」條款之約定，遇有承保之危險事故發生時，被保險人應於知悉發生損失後多久通知保險公司。","options":["立即","三日內","五日內","十日內"]},{"id":497,"category":"火災保險","source_no":20,"answer":"D","stem":"「商業火災保險」可另外約定加保的動產","options":["非依法持有之違禁品","動植物","空調設備","被保險人之員工所有之財產"]},{"id":498,"category":"火災保險","source_no":21,"answer":"C","stem":"下列何種物品投保火災保險時採用定值保險較為適合？","options":["精密儀器","筆記型電腦","名畫","股票或債券"]},{"id":499,"category":"火災保險","source_no":22,"answer":"A","stem":"「商業火災保險」之適用對象，下列何者不適用？","options":["公寓","學校","飯店","醫院"]},{"id":500,"category":"火災保險","source_no":23,"answer":"A","stem":"下列何者不適用於商業火災保險支付加條款？","options":["電梯責任條款","80%共保條款","保險金額自動增加條款","暫時外移條款"]},{"id":501,"category":"火災保險","source_no":24,"answer":"D","stem":"「商業火災保險」標的物中所稱之「動產」，係指","options":["建築物","電梯","水電衛生設備","機器設備"]},{"id":502,"category":"火災保險","source_no":25,"answer":"D","stem":"依「商業火災保險」契約之約定，被保險人死亡時，保險公司得於被爆險人死亡之日起屆滿多久後終止保險契約。終止後之未滿期保險費按日數比例計算。","options":["半個月","一個月","二個月","三個月"]},{"id":503,"category":"火災保險","source_no":26,"answer":"C","stem":"「住宅火災及地震基本保險」之適用對象，下列何者不適用？","options":["住宅","公共宿舍","工廠內宿舍","連幢住宅"]},{"id":504,"category":"火災保險","source_no":27,"answer":"C","stem":"依「商業火災保險」契約之約定，被保險人破產時，保險公司得於被保險人破產宣告之次日起多久內終止保險契約，終止後之未滿期保險費按日數比例退還。","options":["一個月","二個月","三個月","六個月"]},{"id":505,"category":"火災保險","source_no":28,"answer":"B","stem":"政策性住宅地震基本保險承保","options":["住宅建築物（含裝潢）","住宅建築物本體（不含裝潢）","住宅建築物含裝潢和動產","由被保險人自行選擇投保"]},{"id":506,"category":"火災保險","source_no":29,"answer":"D","stem":"某公司投保「商業火災保險」，在火災意外事故中，保險標的物遭受部分損失，損失金額70萬元，倘保險標的物於出險時全部之實際價值為300萬元，此時保險金額應在多少以上方可獲得完全的賠償。","options":["70萬元","180萬元","240萬元","300萬元"]},{"id":507,"category":"火災保險","source_no":30,"answer":"C","stem":"依商業火災保險條款「不動產」之定義，係指","options":["建築物及土地","建築物，但不包括土地","建築物及營業裝修，但不包括土地","建築物、營業裝修及土地"]},{"id":508,"category":"火災保險","source_no":31,"answer":"D","stem":"下列哪一項不屬於「商業火災保險」附加之「爆炸險」之承保範圍？","options":["水衝、水管之爆炸或豁裂","電弧驟發","音爆","以上皆是"]},{"id":509,"category":"火災保險","source_no":32,"answer":"C","stem":"火災保險之「火」應指惡意之火，下列何者為火災保險中所承保的「惡意之火」？","options":["燃燒稻草堆之火焰","瓦斯爐上之火焰","地毯上之火焰","工廠窯爐之火焰"]},{"id":510,"category":"火災保險","source_no":33,"answer":"B","stem":"商業火災保險附加條款之「專業費用條款」，所承保之費用不包括","options":["建築師費用","代書費用","會計師、律師費用","鑑定費用"]},{"id":511,"category":"火災保險","source_no":34,"answer":"D","stem":"我國政策性住宅地震保險之危險分散機制結合下列那些單位共同承擔地震危險？","options":["產險公司","財團法人住宅地震保險基金","政府","以上皆是"]},{"id":512,"category":"火災保險","source_no":35,"answer":"B","stem":"產險費率自由化第三階段實施以後，個人及商業綜合保險（如居家綜合保險、住宅綜合保險、商業綜合保險）之費率釐訂，下列何者為正確？","options":["不受相關監理措施費率之規範","其中火災保險及天災保險部分應依相關監理措施費率之規範","其中責任保險及傷害保險可自由定價，酌收保費或不收保費","以上皆非"]},{"id":513,"category":"火災保險","source_no":36,"answer":"D","stem":"依「實施產險費率自由化第三階段相關監理配套措施」之規定，住宅火災保險報送商品費率必須依照五大通路分別列示總保險費率，下列何者不屬於五大通路？","options":["保險經紀人","保險代理人","保險業務員","再保經紀人"]},{"id":514,"category":"火災保險","source_no":37,"answer":"A","stem":"保險公司依約定終止火災保險契約者，其應返還之未滿期保險費應如何計算？","options":["按日數比例計算","按短期費率計算","不返還","全數返還"]},{"id":515,"category":"火災保險","source_no":38,"answer":"C","stem":"依「住宅火災及地震基本保險」之保單條款之約定，若建築物連續多久時間以上無人看管或使用時，即視為「空屋」","options":["三十日","四十五日","六十日","九十日"]},{"id":516,"category":"火災保險","source_no":39,"answer":"A","stem":"張先生已有購買「住宅火災及地震基本保險」，但因政策性住宅地震基本保險保額150萬元稍嫌不足，想再多購買一些保障，萬一發生地震災害方能獲得足夠的理賠，故張先生應再購買何種保險可以補其不足？","options":["擴大地震保險","附加地震基本保險","住宅綜合保險","商業地震保險"]},{"id":517,"category":"火災保險","source_no":40,"answer":"D","stem":"依「商業火災保險」條款之定義，招牌應屬於保險標的物中之什麼項目","options":["建築物","營業裝修","貨物","營業生財"]},{"id":518,"category":"火災保險","source_no":41,"answer":"A","stem":"要保人或被保險人於訂立火災保險契約時，對於要保書或保險公司之書面詢問應據實說明，如有故意隱匿或不實說明，足以變更保險公司對於危險之估計者，不論保險事故是否發生，保險公司均得","options":["解除契約，不退還保費","解除契約，按短期費率計收保費","終止契約，按短期費率計收保費","終止契約，按日數比例計收保費"]},{"id":519,"category":"火災保險","source_no":42,"answer":"D","stem":"依「住宅火災及地震基本保險」或「商業火災保險」附加之「颱風及洪水險」之約定，因颱風引起的_____，所致保險標的物之毀損或滅失，保險人不負賠償責任。","options":["海潮氾濫","河川、水道、湖泊之水位暴漲氾濫","水庫、水壩堤岸崩潰","地層下陷、山崩或土石流"]},{"id":520,"category":"火災保險","source_no":43,"answer":"C","stem":"某百貨公司發生火災，致不能營業所喪失之利益或必須繼續支付的固定費用損失，除非該被保險人於投保商業火災保險時，另行加保什麼保險，否則保險公司不負賠償責任。","options":["法律責任保險","第三人責任保險","營業中斷保險","租金損失保險"]},{"id":521,"category":"火災保險","source_no":44,"answer":"D","stem":"依商業火災保險「普通品行號店鋪（有製造工作）特約條款」之約定，其","options":["動力不得超過2.5匹馬力，從事製造工作人員，不得超過10人","動力不得超過2.5 匹馬力，從事製造工作人員，不得超過15人","動力不得超過5匹馬力，從事製造工作人員，不得超過10人","動力不得超過5匹馬力，從事製造工作人員，不得超過15人"]},{"id":522,"category":"火災保險","source_no":45,"answer":"A","stem":"產險業依「實施產險費率自由化第三階段相關監理配套措施」之規定，報送之商業火險不同使用性質及建築等即之費率，並依五大通路載明於計算說明書者。下列何種商業火險業務必須適用該報送之費率表？","options":["商業火險中小保額業務","商業火險巨大保額及在台跨國外資企業業務","商店綜合保險業務","以上皆是"]},{"id":523,"category":"火災保險","source_no":46,"answer":"B","stem":"符合商業火災保險之「在台跨國外資企業」要件之一，為其外資股份或外國股東之出資額占百分之五十以上者，但倘外資股份或外資股東出資額超過百分之多少以上，且由外國投資公司派員擔任董事長或副董事長或總經理直接經營管理者亦屬之","options":["百分之三十","百分之二十五","百分之二十","百分之十"]},{"id":524,"category":"火災保險","source_no":47,"answer":"D","stem":"住宅火災保險，有關臨時住宿費用之賠償，下列敘述何者為錯誤的？","options":["於修復或重建期間暫住旅社所支出之合理且必需費用","僅保動產者不適用","不受不足額保險比例分攤之限制","臨時住宿費用與賠償金額合計超過保險金額時，以保險金額為限"]},{"id":525,"category":"火災保險","source_no":48,"answer":"B","stem":"政策性住宅地震基本保險，其每一保險標的建築物按投保金額新台幣150萬元計算，保險費一年其為新台幣","options":["1,200元","1,350元","1,459元","1,850元"]},{"id":526,"category":"火災保險","source_no":49,"answer":"C","stem":"「住宅火災及地震基本保險」附加之「擴大地震險」之基本費率，下列何者不正確？","options":["地區不同，費率亦不同","建築結構不同，費率亦不同","全國單一費率","高樓層費率較高"]},{"id":527,"category":"火災保險","source_no":50,"answer":"A","stem":"產險費率自由化第三階段實施以後，各產險公司之商業火險費率均依據自家公司的損失經驗釐訂，故各公司所報送之費率均不相同，而商業火災保險中屬共保業務者，下列何種出單方式是符合規定的?","options":["共保公司得跟隨主出單之保單條款、費率等商品內容，不受共保公司本身所報條款及費率之限制","倘共保公司本身所報費率區間超出主出單公司之費率時，則必須放棄參加共保","共保公司單獨就該筆共保業務之費率辦理商品備查","以上皆是"]},{"id":528,"category":"火災保險","source_no":51,"answer":"D","stem":"下列哪種人員於參加主管機關指定機構所舉辦之地震建築物毀損評估人員訓練課程，並領有受訓合格證明而取得「住宅地震保險合格評估人員」資格，當發生地震時，得參與住宅建築物之全損評定？","options":["財產保險業理賠、查勘或損防人員","保險公證人","建築師或結構、土木、大地技師","以上皆是"]},{"id":529,"category":"火災保險","source_no":52,"answer":"A","stem":"依「實施產險費率自由化第三階段相關監理配套措施」之規定，於要保人之直接投保住宅火災保險時，與透過保險代理人或保險經紀人投保，直接投保之總保險費","options":["應予優惠","不得優惠","要保人要求時方給予優惠","以上皆是"]},{"id":530,"category":"火災保險","source_no":53,"answer":"C","stem":"現行火災保險契約涉訟時，除當事人另有約定外，以_____之中華民國地方法院為管轄法院","options":["要保人或被保險人住所所在地","保險公司總公司所在地","保險標的物所在地","以上皆可"]},{"id":531,"category":"火災保險","source_no":54,"answer":"D","stem":"下列何者不屬於「住宅火災及地震基本保險」或「商業火災保險」附加之「罷工、暴動、民眾騷擾、惡意破壞行為險」之承保範圍？_____所致之損失。","options":["勞方之罷工","資方之罷工","治安當局為鎮壓擾亂公共安寧所採取之行為","恐怖主義破壞行為"]},{"id":532,"category":"火災保險","source_no":55,"answer":"A","stem":"「最大誠信原則」是在保險契約條款中約定，要保人或被保險人必需遵守的哪一種義務？","options":["告知義務","通知義務","繳保費義務","損害預防義務"]},{"id":533,"category":"火災保險","source_no":56,"answer":"D","stem":"下列何者屬於「住宅火災及地震基本保險」之住宅火災保險絕對不保的危險事故？","options":["要保人或被保險人之故意行為","火山爆發、地下發火","由於烹飪或使用火爐、壁爐或香爐正常使用所產生之煙燻","以上皆是"]},{"id":534,"category":"火災保險","source_no":57,"answer":"B","stem":"「住宅火災及地震基本保險」條款中，對被保險人之敘述何者為錯誤？","options":["對承保住宅建築物的所有權有保險利益","負有交付保險費義務之人","享有保險賠償請求權之人","以上皆是"]},{"id":535,"category":"火災保險","source_no":58,"answer":"B","stem":"國際恐怖活動頻傳，倘要保人投保住宅火災保險或商業火災保險，欲同時加保「恐怖主義險」時，必須先加保哪一險種？","options":["爆炸險","罷工、暴動、民眾騷擾、惡意破壞行為險","第三人意外責任險","法律責任險"]},{"id":536,"category":"火災保險","source_no":59,"answer":"D","stem":"下列何者屬於火災保險契約的構成部分？","options":["保險單條款","附加條款","批單、批註及要保書","以上皆是"]},{"id":537,"category":"火災保險","source_no":60,"answer":"B","stem":"現行火災保險暫保單之有效期間為","options":["半個月","一個月","一個半月","二個月"]},{"id":538,"category":"火災保險","source_no":61,"answer":"D","stem":"某甲於日前自國外以1,000萬元購得名貴油畫乙幅，欲向保險公司投保商業火災保險，請問保險公司通常對此類業務做何種安排？","options":["拒絕承保","以保險金額 1,000萬元不定值保險單承保","經專家鑑定以保險金額1,000萬元定值保險單承保","經專家鑑定並與某甲約定保險金額後以定值保險單承保"]},{"id":539,"category":"火災保險","source_no":62,"answer":"A","stem":"政策性住宅地震基本保險之保險標的物為","options":["住宅建築物本體（不含裝潢）","住宅建築物本體＋裝潢","住宅建築物本體＋裝潢+動產","住宅建築物本體＋裝潢 +動產+體傷死亡"]},{"id":540,"category":"火災保險","source_no":63,"answer":"C","stem":"火災保險契約中，保險公司要求被保險人履行義務，亦即被保險人保證履行某約定，若違背，保險公司可以解除契約之條款稱為","options":["基本條款","附加條款","特約條款","除外條款"]},{"id":541,"category":"火災保險","source_no":64,"answer":"C","stem":"下列何者為商業火災保險可約定加保的危險事故？","options":["輻射汙染","要保人或被保險人之故意行為","竊盜","火山爆發"]},{"id":542,"category":"火災保險","source_no":65,"answer":"B","stem":"投保住宅火災保險時，其建築物的適當保額應如何計算方為妥適？","options":["依房屋的購買總價投保","依產險公會「台灣地區住宅類建築造價參考表」計算建築物本體造價總額及裝潢總價投保","依要保人或被保險人向銀行辦理抵押貸款的金額投保","依要保人或被保險人向銀行抵押貸款之金額扣除土地價值後之餘額投保"]},{"id":543,"category":"火災保險","source_no":66,"answer":"C","stem":"於商業火災保險之理賠，任何一套或一組承保之動產，遇有部分損失時，應如何理賠？","options":["將該動產視為全損","將該動產視為半損（50%）","應視該部分損失對該動產在使用上之重要性及價值比例，合理估定損失金額","就該部分損失占該動產的市價比例計算損失金額"]},{"id":544,"category":"火災保險","source_no":67,"answer":"B","stem":"火災保險所承保之建築物，非因承保之危險事故所致全部傾倒、倒塌或變移，致使該建築物全部不能使用時，該保險契約之效力即行_____，保險公司應按日數比例返還未滿期保費。","options":["雙方議定解除","終止","中止","停止"]},{"id":545,"category":"火災保險","source_no":68,"answer":"C","stem":"下列何者與火災保險的保險利益產生無關？","options":["所有權關係","租賃關係","隔鄰關係","契約關係"]},{"id":546,"category":"火災保險","source_no":69,"answer":"D","stem":"依「商業火災保險」之約定，下列起火原因中，何者無法獲得保險之賠償？","options":["仇家惡意縱火","森林大火","機器使用過熱起火","唆使員工縱火"]},{"id":547,"category":"火災保險","source_no":70,"answer":"C","stem":"產險費率自由化第三階段實施之後，下列何種火災保險商品應依模型評估風險以釐訂費率？","options":["商業火災保險","住宅火災保險","火災保險（含住宅及商業）所附加之地震、颱風及洪水險","以上皆是"]},{"id":548,"category":"火災保險","source_no":71,"answer":"D","stem":"被保險人因為保險事故所致保險標的物之損失，如果保險理賠金額超過實際損失，則被保險人有不當得利，這種情形違反","options":["最大誠信原則","保險利益原則","主力近因原則","損害補償原則"]},{"id":549,"category":"火災保險","source_no":72,"answer":"C","stem":"「住宅火災及地震基本保險」附加之「擴大地震險」，下列描述何者不正確？","options":["承保之標的物包括建築物及動產","部分損失亦予理賠","地震引起之海嘯所致之損失不賠","需先投保地震基本保險方可加保擴大地震險"]},{"id":550,"category":"火災保險","source_no":73,"answer":"B","stem":"「不定值保險」是哪一類保險契約之特徵？","options":["汽車保險","火災保險","海上保險","責任保險"]},{"id":551,"category":"火災保險","source_no":74,"answer":"C","stem":"火災之危險除本身有燃燒之危險外，尚有延燒之危險，現行火災保險將最大可能延燒之距離定為","options":["4.58公尺（15英尺）","6.10公尺（20英尺）","7.62公尺（ 25英尺）","9.15公尺（30英尺）"]},{"id":552,"category":"火災保險","source_no":75,"answer":"C","stem":"「住宅火災及地震基本保險」之住宅火災保險，在建築物部分之理賠計算，下列何者為錯誤？","options":["採取60%共保基礎","保險金額高於重置成本者，保險金額僅於重置成本之限度內為有效","以實際價值為基礎計算損失金額，扣除折舊","以重置成本為基礎計算損失金額，不再扣除折舊"]},{"id":553,"category":"火災保險","source_no":76,"answer":"C","stem":"依「住宅火災及基本地震保險」之約定，保險標的物因地震引起火災而遭致毀損，被保險人可由什麼保險獲得賠償。","options":["住宅火災保險","爆炸保險","住宅地震基本保險","住宅第三人責任基本保險"]},{"id":554,"category":"火災保險","source_no":77,"answer":"A","stem":"下列哪種使用性質「住宅火災及地震基本保險」？","options":["公共宿舍","辦公室","餐廳","工廠"]},{"id":555,"category":"火災保險","source_no":78,"answer":"D","stem":"政策性住宅地震基本保險，其費率規定為","options":["全國分十二區，採差別費率","全國分北﹑中、南、東四區，採差別費率","全國分南、北二區，採差別費率","不分區，採全國單一費率"]},{"id":556,"category":"火災保險","source_no":79,"answer":"C","stem":"依「實施產險費率自由化第三階段相關監理配套措施」之規定，有關火災保險之地震颱風及洪水險之危險費率釐訂，下列何者為正確","options":["依產險公司之損失經驗釐訂","依核保人員經驗釐訂","依精算模型釐訂","依再保市場費率釐訂"]},{"id":557,"category":"火災保險","source_no":80,"answer":"C","stem":"哪一項費用在住宅火災保險出險時不予賠償？","options":["防止損失擴大費用","殘餘物清除費用","醫療費用","臨時住宿費用"]},{"id":558,"category":"火災保險","source_no":81,"answer":"D","stem":"依「住宅火災及地震基本保險」條款之約定，要保人或被保險人於火災事故發生當時，下列哪一項屬於應立即採取之措施？","options":["保留受損之保險標的物並維持現狀","撥打119通報消防單位處理現場","防止損失擴大","以上皆是"]},{"id":559,"category":"火災保險","source_no":82,"answer":"A","stem":"陳先生之房屋投保「住宅火災及地震基本保險」，其後房屋轉賣給宋先生，則保單效力於保險標的物轉讓後多久內繼續有效。","options":["三個月","二個月","一個月","保險期間屆滿前"]},{"id":560,"category":"火災保險","source_no":83,"answer":"D","stem":"「商業火災保險」附加之「貨物預約保險附加條款」，下列敘述何者是正確的？","options":["應約定預收保費為全年保險費之百分比","僅適用保險標的貨物","被保險人應每月通知保險人貨物之實際價值","以上皆是"]},{"id":561,"category":"火災保險","source_no":84,"answer":"C","stem":"「商業火災保險」條款明定保險公司之給付期限，係與被保險人雙方確定賠償金額且經檢齊文件、證據後幾天內賠付。","options":["七天","十天","十五天","七天"]},{"id":562,"category":"火災保險","source_no":85,"answer":"A","stem":"依「商業火災保險」附加之「颱風及洪水險」及「住宅火災及地震基本保險」附加之「超額颱風及洪水險」之約定，保險標的物致存於二樓以上者，其費率按其基本費率之百分之幾計算。","options":["50%","60%","70%","80%"]},{"id":563,"category":"火災保險","source_no":86,"answer":"C","stem":"住宅建築物出險時其重置成本為100萬元，倘要保人在不了解的情況下向保險公司投保住宅火災保險120萬元，如部分保險標的物遭受火災損失25萬元，則被保險人可獲得多少賠償。","options":["15萬元","20萬元","25萬元","30萬元"]},{"id":564,"category":"火災保險","source_no":87,"answer":"A","stem":"下列何者不是屬於「商業火災保險」基本承保範圍，須經特別約定方得承保之危險事故？","options":["火災引起之爆炸","閃電及雷擊","火災延燒","爆炸引起之火災"]},{"id":565,"category":"火災保險","source_no":88,"answer":"D","stem":"下列何者屬於「商業火災保險」承保之危險事故？","options":["閃電雷擊","森林大火","爆炸引起之火災","以上皆是"]},{"id":566,"category":"火災保險","source_no":89,"answer":"A","stem":"依住宅火災保險條款約定，其承保建築物之火險保額已達該建築物出險時之重置成本百分之幾時，即視為足額投保，不受不足額比例分攤之限制。","options":["60%","70%","80%","85%"]},{"id":567,"category":"火災保險","source_no":90,"answer":"B","stem":"王小明5年前所購買之房屋在銀行抵押貸款之餘額為125萬元，倘房屋之重置成本為200萬元，王小明亦投保了住宅火災保險200萬元及地震基本保險150萬元，並以銀行為抵押權人，依「抵押權附加條款」之規定，倘發生火災事故致房屋全損，就保險公司賠付之保險金200萬元及臨時住宿費用18萬元，銀行應優先受償","options":["200萬元","125萬元","218萬元","150萬元"]},{"id":568,"category":"火災保險","source_no":91,"answer":"D","stem":"依「住宅地震保險為險分散機制實施辦法」之規定，地震事故在連續多久內發生二次以上時，仍視為同一次地震事故。","options":["24小時","48小時","72小時","168 小時"]},{"id":569,"category":"火災保險","source_no":92,"answer":"C","stem":"財產保險業應承保住宅地震保險，以主管機關建立之什麼機制為之","options":["共保機制","再保險機制","危險分散機制","賠款分攤機制"]},{"id":570,"category":"火災保險","source_no":93,"answer":"A","stem":"黃老闆想將他的工廠的廠房、機器及貨物單獨投保颱風及洪水險，保險公司可能會","options":["不予承保","視其危險性決定是否承保","送請公會核定費率後承保","按現行費率加收50%後承保"]},{"id":571,"category":"火災保險","source_no":94,"answer":"D","stem":"「商業火災保險」附加之「貨物預約保險附加條款」可承保下列何項標的物？","options":["住家之動產","工廠之機器設備","餐廳之營業生財及器具","倉庫之原料及成品"]},{"id":572,"category":"火災保險","source_no":95,"answer":"A","stem":"要保人投保「住宅火災及地震基本保險」時，下列何項是由保險公司填寫？","options":["建築物等級","保險標的物之所在地址","建築物本體之建造年份","通訊處地址及電話"]},{"id":573,"category":"火災保險","source_no":96,"answer":"D","stem":"「住宅火災及地震基本保險」中之住宅地震基本保險，其臨時住宿費用賠償為每一住宅建築物","options":["每日2,000元，以60日為限","每日3,000元，以60日為限","15萬元","20萬元"]},{"id":574,"category":"火災保險","source_no":97,"answer":"B","stem":"依「實施產險費率自由化第三階段相關監理配套措施」之規定，住宅火災保險之危險保費改由產險業自行釐訂，且每一住宅火災保險預定附加費用率不得高於","options":["45.5%","44.5%","35%","15%"]},{"id":575,"category":"火災保險","source_no":98,"answer":"C","stem":"張先生去年於新北市以750萬元購買一戶總樓層數15層樓大廈的6樓50坪十年成屋，並向銀行辦理抵押貸款400萬元，銀行同時要求張先生必須投保「住宅火災及地震基本保險」，請問張先生就該建築物應投保住宅火險多少金額方為適足？（註：依產險公會之「台灣地區住宅類造價參考表」新北市總樓層數15～16樓之每坪造價106,200元）","options":["依購屋總價750萬元投保","依貸款金額400萬元投保","依產險公會造價參考計算建築物本體造價總額531萬元，加計裝潢總價投保","依建築物本體造價總額531萬元，並扣除十年折舊後投保"]},{"id":576,"category":"火災保險","source_no":99,"answer":"B","stem":"依「住宅火災及地震基本保險」或「商業火災保險」附加之「水漬險」之約定，下列何種事故致保險標的物之損失，保險人不負賠償責任？","options":["水槽、水管破損或溢水","自動消防裝置滲漏","蒸氣管、冷暖氣之水蒸氣意外滲漏","雨水由屋頂、門窗或通氣口進入屋內"]},{"id":577,"category":"火災保險","source_no":100,"answer":"B","stem":"91年4月1日以前投保長期住宅火災保險之保戶，如果要加保政策性住宅地震保險時應如何加保，下列何者為正確？","options":["向原承保公司加保擴大地震保險","向原承保公司加保附加住宅地震基本保險","向住宅地震保險基金加保附加住宅地震基本保險","向住宅地震保險基金投保住宅火災及地震基本保險"]},{"id":578,"category":"火災保險","source_no":101,"answer":"C","stem":"火災保險契約中，保險公司要求被保險人履行義務，亦即被保險人保證履行某約定，若違背，保險公司可以解除契約之條款稱為","options":["基本條款","附加條款","特約條款","除外條款"]},{"id":579,"category":"火災保險","source_no":102,"answer":"C","stem":"產險費率自由化第三階段實施以後，火災保險（天災險以外）之商品費率如何決定？","options":["依規章費率出單","依規章費率並得於調整範圍內適度偏離","由業者自行依損失經驗釐訂費率並符合費率適足性、合理性及公平性原則","由業者自行釐訂費率並得任意偏離"]},{"id":580,"category":"火災保險","source_no":103,"answer":"B","stem":"依「住宅地震保險危險分散機制實施辦法」，於政策性住宅地震保險，倘一次地震事故合計賠付之保險損失總額超過各層危險承擔限額之合計總額時，則應如何賠付給被保險人？","options":["由先申請理賠者優先全額賠付","按比例削減賠付","超過部分由政府編列特別運算補足","由財團法人住宅地震保險基金向外舉債籌資以全額賠付"]},{"id":581,"category":"火災保險","source_no":104,"answer":"C","stem":"「火災保險」之費率釐訂，其建築結構等級分為特一等、特二等、頭等、二等及三等五類，其附加之「颱風及洪水險」費率釐訂之建築結構等級分為幾類？","options":["與火臉相同","不分建築等級","分為A級（火險特一等，特二等之建築物）B級（火險頭等，二等之建築物）C級（除A、B二級以外之建築物）","由核保人員決定"]},{"id":582,"category":"火災保險","source_no":105,"answer":"C","stem":"直接因非地震之突發及不可預料之地層下陷，滑動或山崩所致之損失，屬於下列哪種「住宅火災及地震基本保險」之附加險之承保範圍？","options":["擴大地震險","颱風及洪水險","地層下陷、滑動或山崩險","以上皆是"]},{"id":583,"category":"火災保險","source_no":106,"answer":"B","stem":"被保險人居住於台北市松山區之一棟二十層樓之第18樓住宅，如投保「住宅火災及地震基本保險」，保險公司於定火險費率時，會考慮","options":["地區加費","高樓加費","地區與高樓加費","地區與屋頂加費"]},{"id":584,"category":"火災保險","source_no":107,"answer":"C","stem":"倘若保險標的物之火災保險費率無法及時釐訂，通常保險公司會先行簽發何種文件，以表示保險契約業已成立？","options":["批單","保險單","暫保單","保險費收據"]},{"id":585,"category":"火災保險","source_no":108,"answer":"C","stem":"「商業火災保險」附加之「營業中斷保險」，其承保範圍為，因發生承保之危險事故，致保單所載處所內之建築物或機器設備毀損或滅失，而直接導致何項費用，保險公司負賠償責任","options":["薪資費用","非持續費用","營業中斷之實際損失及恢復營業所生之費用","其他附帶損失"]},{"id":586,"category":"火災保險","source_no":109,"answer":"A","stem":"依「商業火災保險」基本條款之約定，要保人或被保險人因救護保險標的物損失時所支出之費用，保險公司對該項支出","options":["於必要合理範圍內負償還責任","不負償還責任","在不超過因而所減少的損失範圍內負償還責任","視施救效果決定是否償還"]},{"id":587,"category":"火災保險","source_no":110,"answer":"D","stem":"五大通路中之「直接業務」，係無支付直接招攬費用之業務，故不得發放","options":["佣金","獎金","其他名目之招攬費用","以上皆是"]},{"id":588,"category":"火災保險","source_no":111,"answer":"D","stem":"依「住宅火災及地震基本保險」條款之約定，下列何者屬於要保人或被保險人於保險期間內應履行之通知義務？","options":["保險標的物使用性質變更","保險標的物另有向其他保險公司投保相同之保險","置存保險標的物之建築物業已改建","以上皆是"]},{"id":589,"category":"火災保險","source_no":112,"answer":"D","stem":"投保商業火災保險，倘加繳保費加保「專業費用附加條款」，則保險公司對於所承保之建築物，營業裝修或機器設備因保險事故發生遭受損失後，為回復原狀所必需且合理之專業費用亦負賠償之責。該專業費用包括","options":["建築師費用","會計師、律師費用","鑑定費用","以上皆是"]},{"id":590,"category":"火災保險","source_no":113,"answer":"D","stem":"火災保險基本危險費率之風險分類，係按下列哪二種類別分別釐訂之？","options":["建築物等級及消防設施","建築物等級及自負額高低","建築物使用性質及自負額高低","建築物等級及使用性質"]},{"id":591,"category":"火災保險","source_no":114,"answer":"B","stem":"保險標的物因火災保險事故所致之損失，經保險公司理算後，其損失金額已確定部分，保險公司得先預付部分賠款予被保險人，以使被保險人能儘速恢復營業，此為商業火災保險附加條款之","options":["優惠賠款附加條款","預付賠款附加條款","小額賠款附加條款","融通賠款附加條款"]},{"id":592,"category":"火災保險","source_no":115,"answer":"C","stem":"張先生為其承租的商店內銷售之貨物投保「商業火災保險」，並附加「竊盜險」，因該商店之何人侵入店內竊取商品所致之損失，保險公司不負賠償責任？","options":["房東","鄰居","受僱員工","債權人"]},{"id":593,"category":"火災保險","source_no":116,"answer":"B","stem":"颱風引起之山崩、土石流所致保險標的物之毀損，屬於何種保險之承保範圍","options":["附加颱風及洪水險","附加地層下陷、滑動或山崩險","附加地震險","附加水漬險"]},{"id":594,"category":"火災保險","source_no":117,"answer":"C","stem":"「商業火災保險」附加之「颱風及洪水險」，其保險金額是以火災保險金額的百分之幾為原則，但最高不得超過100%","options":["50％","60％","80％","90％"]},{"id":595,"category":"火災保險","source_no":118,"answer":"A","stem":"「住宅火災及地震基本保險」附加之「擴大地震險」之動產費率係數為？","options":["0.5","0.7","0.8","1.0"]},{"id":596,"category":"火災保險","source_no":119,"answer":"A","stem":"政策性住宅地震基本保險承保之全損，須經政府機關或專門之建築師公會或結構、土木、大地等技師公會出具證明，鑑定為不堪居住必須拆除重建，或非經修建不適居住且修復費用為危險發生時之重置成本百分之幾以上","options":["50％","60％","80％","90％"]},{"id":597,"category":"火災保險","source_no":120,"answer":"C","stem":"要保人投保「住宅火災及地震基本保險」，於填寫要保書時，針對建築物的本體部分，下列哪一事項不需填寫？","options":["使用面積","建材結構","土地持份","建造年份"]},{"id":598,"category":"火災保險","source_no":121,"answer":"C","stem":"財產保險業應承保住宅地震危險，其所承保之政策性住宅地震基本保險應全數向財團法人住宅地震保險基金為","options":["內共保","外共保","再保險","轉再保"]},{"id":599,"category":"火災保險","source_no":122,"answer":"B","stem":"「商業火災保險」承保之標的物，其使用性質為「加油站」者，被保險人須保證在保險契約承保處所內之地面不置存石油，此為","options":["汽油特約條款","加油站特約條款","石油特約條款","石油附加條款"]},{"id":600,"category":"火災保險","source_no":123,"answer":"C","stem":"火災保險單以一年為期，保險期間如不足一年，或被保險人中途要求終止時，保險公司按何項計收保險費。但承保標的物為貨物時，其終止時得按未到期日數比例計算。","options":["日數比例","全年保費","短期費率","以上皆可"]},{"id":601,"category":"火災保險","source_no":124,"answer":"C","stem":"「商業火災保險」條款明訂可特約承保之危險事故包括","options":["戰爭","放射線之幅射能之污染","保險標的物自身之發酵、自燃","以上皆非"]},{"id":602,"category":"火災保險","source_no":125,"answer":"A","stem":"產險費率自由化第三階段實施之後，下列何種商品釐訂費率時其純保費及附加費用率皆得採區間方式訂定？","options":["商業火災保險","住宅火災保險","任意汽車保險","以上皆是"]},{"id":603,"category":"火災保險","source_no":126,"answer":"A","stem":"金管會規定財團法人保險事業發展中心應建置網頁，彙整各產險公司銷售之公會報送版何項，供消費者查詢，以落實消費者權益保護","options":["任意汽車保險及住宅火災保險之承保基本內容及總保費等資料","強制汽車保險及政策性住宅地震保險","商業火災保險","以上皆是"]},{"id":604,"category":"火災保險","source_no":127,"answer":"B","stem":"「商業火災保險」附加之「颱風及洪水險」，明訂洪水退去幾小時後，再度發生洪水時視為另一次事故","options":["168小時","72小時","48小時","24小時"]},{"id":605,"category":"火災保險","source_no":128,"answer":"B","stem":"依「商業火災保險」條款之約定，被保險人應於知悉保險事故發生後幾日內，提供賠償申請書及損失清單等相關文件，向保險公司請求賠償。","options":["十五日","三十日","四十五日","六十日"]},{"id":606,"category":"火災保險","source_no":129,"answer":"D","stem":"王小明擬為其所有之住宅建築物及其內之動產購買之住宅火災保險及地震保險之保障，他應如何選擇保險商品？","options":["「住宅火災及地震基本保險」+「擴大地震保險」","「住宅綜合保險」+「擴大地震保險」","「住宅火災及地震基本保險」","以上皆可"]},{"id":607,"category":"火災保險","source_no":130,"answer":"D","stem":"某公司就其機器設備投保「商業火災保險」50萬元，遇火災意外事故遭受30萬元之損失，倘該機器設備於出險時之實際價值為100萬元，則該被保險人可獲得多少金額之賠償？","options":["50萬元","30萬元","25萬元","15萬元"]},{"id":608,"category":"火災保險","source_no":131,"answer":"B","stem":"下列哪一項不屬於產險公會所編製之「台灣地區住宅類建築造價參考表」所定建築物之重置成本估算因素？","options":["使用面積","建造年份","所在地區","建築物樓層"]},{"id":609,"category":"火災保險","source_no":132,"answer":"D","stem":"商業火災保險所稱之「防火牆」，係指牆壁之構造符合下列哪項規定者屬之","options":["鋼骨水泥或鋼筋水泥造，其厚度在十二公分以上","水泥空心磚造，中間填以鋼筋水泥，其厚度在十九公分以上","磚、石、水泥空心磚造，其厚度在二十四公分以上","以上皆是"]},{"id":610,"category":"火災保險","source_no":134,"answer":"B","stem":"「商業火災保險」附加之「爆炸險」，下列何者屬於爆炸險所稱「爆炸」之範圍？","options":["水衝","塵爆","音爆","水管之爆炸或豁裂"]},{"id":611,"category":"火災保險","source_no":135,"answer":"C","stem":"火災保險所承保的「火」，其形成須由於何項的原因所致","options":["故意","可抗力","意外與不可抗力","可以預期"]},{"id":612,"category":"火災保險","source_no":136,"answer":"C","stem":"火災保險標的物遇有火災事故發生時，被保險人有防止損失擴大之義務，應立即採取必要之措施，以避免或減輕保險標的物之損失，其因而所支出之費用，由","options":["保險公司視情況決定補償","被保險人自行負擔","保險人於其必要合理範圍內負償還之責，其償還數額與賠償金額，合計雖超過保險金額，仍應償還","保險人於其必要合理範圍內負償還之責，其償還數額與賠償金額，合計若超過保險金額，仍以保險金額為限"]},{"id":613,"category":"火災保險","source_no":137,"answer":"D","stem":"下面有關主管機關對保險經紀人公司經營再保險經紀業務之監理要求，何者為正確？","options":["保險契約及再保險契約委由同一保險經紀人洽訂及安排者，該保險經紀人應事先取得委託人之書面同意","不得阻礙保險人至現場進行危險評估（損害防阻），並應落實忠實義務及善良管理人責任","不得以直接簽單業務脅迫保險人給付危險評估及損害防阻費用","以上皆是"]},{"id":614,"category":"火災保險","source_no":138,"answer":"B","stem":"依火險費率核定原則，凡使用性質為「住宅」者，不論公寓式樓房或非公寓式樓房，其中同層或他層有營業行為者（如美容院，餐廳），則其計費方式應為","options":["按其本身建築等級計費","按其本身建築等級計算基本費率，並加計營業加費","按同層或他層有營業行為者中之最高費率計費","以上皆非"]},{"id":615,"category":"火災保險","source_no":139,"answer":"B","stem":"保險公司於簽發商業火災保險附加「貨物預約保險附加條款」時，被保險人應按 _____，將貨物存放數量、單位價值及金額通知保險公司，憑以計算保險費。","options":["日","月","季","年"]},{"id":616,"category":"火災保險","source_no":140,"answer":"C","stem":"某餐廳以其辦公設備投保商業火災保險時，應以哪一項保險標的物來投保","options":["建築物","特別裝修","營業生財","機器設備"]},{"id":617,"category":"火災保險","source_no":141,"answer":"D","stem":"「商業火災保險」承保之建築物或置存承保之動產之建築物，連續幾日以上無人看管或使用者，其保險效力即告停止，對於效力停止後所發生之損失，保險公司不負賠償責任。","options":["七日","十五日","三十日","六十日"]},{"id":618,"category":"火災保險","source_no":142,"answer":"C","stem":"公寓（建築物本身）頂樓加蓋之「附加建築物」，其附加建築物之費率應如何計費？","options":["按建築物本身之費率計費","按附加建築物之費率計費","按二者中較高之費率計費","按二者中較低之費率計費"]},{"id":619,"category":"火災保險","source_no":143,"answer":"B","stem":"依「實施產險費率自由化第三階段相關監理配套措施」之規定，產險業應於何處揭露有關個人任意汽車保險及住宅火災保險直接投保，與透過保險代理人或保險經紀人投保，其間優惠內容之差異？","options":["交易所網站","公司所屬網際網路","公司年報資料","公司行銷廣告"]},{"id":620,"category":"火災保險","source_no":144,"answer":"D","stem":"下列何種使用性質屬於「商業火災保險」之範疇？","options":["辦公室","工廠","倉庫","以上皆是"]},{"id":621,"category":"火災保險","source_no":145,"answer":"D","stem":"某甲將其房屋投保「住宅火災及地震基本保險」，火險保額為150萬元，四個月後發生火災損失80萬元，其房屋之重置成本200萬元，則保險公司對建築物損失應賠付多少？","options":["60萬元","64萬元","72萬元","80萬元"]},{"id":622,"category":"火災保險","source_no":146,"answer":"C","stem":"下列何種情事，產險公司將違反產險公會訂定之商業火險相關自律規範？","options":["核保人員依據該公司精算人員報送之火災保險精算費率內容予以評估承保","承保範圍含有地震、颱風及洪水險事故者，其地震、颱風及洪水險之危險費率依保發中心公佈之地震、颱風及洪水險參考費率釐訂","給付佣金超過「保單預定附加費用率」減「業界前二年度平均非直接招攬費用率」","佣金支付對象與要保書上所列業務員或保險代理人、經紀人簽署人相同"]},{"id":623,"category":"火災保險","source_no":147,"answer":"B","stem":"自100年7月1日起實施天災險費率新措施，火災保險之承保範圍含有承保地震、颱風及洪水險事故者，其地震、颱風及洪水險之危險費率釐訂，下列何者為正確？","options":["自由費率","由業者依精算模型釐訂","由業者之精算人員依損失經驗釐訂","由核保人員參考再保市場費率決定"]},{"id":624,"category":"火災保險","source_no":148,"answer":"A","stem":"依「住宅火災及地震基本保險」條款之約定，保險標的物因讓渡而所有權移轉時，該保險單仍於何時繼續有效。","options":["三個月內","二個月內","一個月內","到期日前"]},{"id":625,"category":"火災保險","source_no":149,"answer":"D","stem":"下列何者屬於「商業火災保險」不保之危險事故，且不得以承保者？","options":["火災引起之爆炸","第三人之惡意破壞行為","恐佈主義者之行為","政府命令之焚毀"]},{"id":626,"category":"火災保險","source_no":150,"answer":"D","stem":"依照現行「住宅火災及地震基本保險」之規定，若張先生住宅火災保險保險金額為240萬元，承保期間發生火災事故，損失為20萬元，今公證人理算損失時認為建築物重置價值為400萬元，則保險公司應該理賠多少金額？","options":["12萬元","13.3 萬元","16萬元","20萬元"]},{"id":627,"category":"火災保險","source_no":151,"answer":"B","stem":"下列何種保險只承保建築物全損，不承保部分損失？","options":["住宅火災保險","政策性住宅地震基本保險","擴大地震保險","颱風洪水保險"]},{"id":628,"category":"火災保險","source_no":152,"answer":"A","stem":"被保險人投保「住宅火災及地震基本保險」後，某日不幸廚房發生小火災事故，被保險人於消防隊到達之前，使用家用型滅火器將火撲滅。試問保險公司對於該項滅火器消耗是否亦負賠償責任？","options":["會賠償","不能理賠","視情況而定","除經特別載明外，否則不負賠償責任"]},{"id":629,"category":"火災保險","source_no":153,"answer":"A","stem":"依住宅火災保險之「竊盜險」或「超額竊盜保險附加條款」之規定，被保險人遭受竊盜，下列哪一項情形無法獲得保險人之賠償？","options":["門窗沒有被毀壞的痕跡","衣物等動產存放於未上鎖之櫥櫃中","建築物未裝置警鈴","未能於二十四小時內發現被竊"]},{"id":630,"category":"火災保險","source_no":154,"answer":"B","stem":"張三的房屋投保「住宅火災及地震基本保險」於保險期間使用爐火不慎引發火災，並延燒至鄰屋，致鄰屋住戶遭受體傷、死亡或財損，則張三的保險公司對下列哪項損失不負賠償責任？","options":["張三房屋的火災損失","張三的體傷或死亡","鄰屋的財物損失","鄰屋住戶的體傷或死亡"]},{"id":631,"category":"火災保險","source_no":155,"answer":"C","stem":"除經特別約定載明者外，「住宅火災及地震基本保險」標的物中所指之「建築物內動產」並不包括被保險人_____之動產在內。","options":["配偶家屬","同居之父母或兄弟姐妹","承租人","受僱人"]},{"id":632,"category":"火災保險","source_no":156,"answer":"C","stem":"下列哪項財物是不須採用定值火災保險來承保？","options":["古玩","藝術品","貨物","字畫"]},{"id":633,"category":"火災保險","source_no":157,"answer":"A","stem":"「住宅火災及地震基本保險」之承保範圍包括「住宅玻璃保險」，期保險金額為","options":["每一次事故賠償金額以1萬元為限，保險期間以2萬元為限","每一次事故及保險期間賠償金額以2萬元為限","每一次事故賠償金額以2萬元為限，保險期間以4 萬元為限","每一次事故及保險期間賠償金額以4萬元為限"]},{"id":634,"category":"火災保險","source_no":158,"answer":"C","stem":"下列何者不屬於火災保險承保之「建築物」的一部份？","options":["電梯、電扶梯","水電衛生設備","冷暖氣機","公共設施之持分"]},{"id":635,"category":"火災保險","source_no":159,"answer":"C","stem":"下列何者不屬於「住宅火災及地震基本保險」中住宅火災保險之承保危險事故，而須以另行約定方式予以承保者？","options":["航空器墜落","機動車輛碰撞","租金損失","意外事故所致之煙燻"]},{"id":636,"category":"火災保險","source_no":160,"answer":"B","stem":"下列哪一險種屬於現行「住宅火災及地震基本保險」之承保範圍？","options":["自動消防滲漏險","第三人責任基本保險","恐怖主義險","水漬險"]},{"id":637,"category":"火災保險","source_no":161,"answer":"D","stem":"依「住宅火災及地震基本保險」之「抵押權附加條款」約定，承保建築物發生火災保險承保之事故致有損失時，除臨時住宿費用直接給付予被保險人外，其他應給付保險金以百分之多少為限，在抵押權人（銀行）與被保險人（貸款戶）債權債務範圍內，應優先清償抵押權人。","options":["50%","60%","80%","100%"]},{"id":638,"category":"火災保險","source_no":162,"answer":"A","stem":"下列何者非「商業火災保險核保技術調整係數」之加、減費項目？","options":["損失率","消防設備","SB附加條款加費","損害防阻"]},{"id":639,"category":"火災保險","source_no":163,"answer":"A","stem":"一年期火災保險單，如因被保險人要求增加保險金額（貨物除外），其加費得按","options":["未到期日數比例計算","短期費率計算","生效日起以全年計算","以上均可"]},{"id":640,"category":"火災保險","source_no":164,"answer":"A","stem":"「住宅火災及地震基本保險」或「商業火災保險」附加之「颱風及洪水險」中所稱之「颱風」，係指中央氣象局就台灣地區發佈有","options":["陸上颱風警報者","海上或陸上颱風警報者","豪雨特報者","以上皆是"]},{"id":641,"category":"火災保險","source_no":165,"answer":"C","stem":"屬於「住宅火災及地震基本保險」之住宅火災保險不保之動產，但可特別約定加保者有","options":["供加工、製造或營業用之機器","寵物","圖畫、骨董","植物"]},{"id":642,"category":"火災保險","source_no":166,"answer":"B","stem":"林小姐之房屋座落於台中市，為12層樓鋼筋混凝土造建築，於92年建造完成使用，計有50坪，當時買價為8,800,000元，又其室內今年重新裝潢，裝潢費每坪 20,000元，依產險公會之「台灣地區住宅類建築造價參考表」，該建築物本體每坪造價為81,400元，林小姐擬為其房屋及裝潢投保住宅火災保險，保險金額應以多少為宜。","options":["4,070,000元","5,070,000元","8,800,000元","9,800,00元"]},{"id":643,"category":"汽車保險","source_no":1,"answer":"D","stem":"就汽車第三人責任保險而言，下列何者為正確？","options":["賠款紀錄係數共10級","每肇事一次加1級","新投保賠款等級為1","賠款紀錄係數共19級"]},{"id":644,"category":"汽車保險","source_no":2,"answer":"B","stem":"汽車交通事故係由多輛（三輛以上）汽車造成連環車禍，受害人應如何申請強制汽車責任保險理賠，下列何者敘述為非？","options":["受害人(乘客)可直接向自己保險公司申請賠償","受害人可直接向保險公會申請理賠","受害人如係行人，可向保險車輛之任何一家公司申請理賠","若肇事汽車都非被保險汽車，受害人可向特別補償基金申請理賠"]},{"id":645,"category":"汽車保險","source_no":3,"answer":"B","stem":"被保險人為防止損失擴大或減輕損害為目的而採取措施所支付合理而必要之費用應由何者負責償還？","options":["被保險人本人","保險人","第三人","要保人"]},{"id":646,"category":"汽車保險","source_no":4,"answer":"D","stem":"下列何者為汽車第三人責任保險雇主責任附加條款之不保事項？ ①受僱人之故意行為 ②受僱人之鬥毆、自殺 ③受僱人本身之疾病、失能 ④受僱人之犯罪行為。","options":["①③","①②③","②③④","①②③④"]},{"id":647,"category":"汽車保險","source_no":5,"answer":"D","stem":"汽車保險契約經要保人通知終止者，其保險期間已經過六個月以上未滿七個月者，依自用汽車保險定型化契約範本之規定，其短期費率為全年保險費多少比率？","options":["60%","65%","70%","75%"]},{"id":648,"category":"汽車保險","source_no":6,"answer":"D","stem":"汽車貨物運送人責任保險規定，下列何者事項為保險公司不負賠償責任？①被保險人延遲或故意行為所致 ②因罷工、暴動、民眾騷擾所致 ③駕駛被保險車輛從事犯罪行為所致 ④運送之物品，依法令規定禁止製造、運輸者","options":["①②","②③","①②③","①②③④"]},{"id":649,"category":"汽車保險","source_no":7,"answer":"D","stem":"花小路投保汽車車體損失丙式後，於某日開車衝撞路樹至發生損害一萬元，試問花小路可由保險公司獲得多少理賠？","options":["一萬元","七千元","五千元","無法獲得理賠"]},{"id":650,"category":"汽車保險","source_no":8,"answer":"C","stem":"汽車零件、配件被竊損失附加條款規定，其累計賠償金額最高以實收保費幾倍為限？","options":["2","4","6","8"]},{"id":651,"category":"汽車保險","source_no":9,"answer":"A","stem":"就任意汽車保險自用小客車而言，倘被保險人為35歲之女性，請問投保車體損失險乙式時，其年齡性別係數應為多少？","options":["0.90","0.96","1.04","1.07"]},{"id":652,"category":"汽車保險","source_no":10,"answer":"C","stem":"違反強制汽車責任保險事件受處罰人於何種情形下無法一次完納罰款，得於所處罰鍰未移送強制執行前，可申請分期繳納？","options":["訴訟中","就醫中","經濟狀況無法一次完納或因天災、事變或其他不可抗力，致財產遭受重大損失","以上皆非"]},{"id":653,"category":"汽車保險","source_no":11,"answer":"D","stem":"張三將愛車投保汽車車體損失險後，因颱風季節到來，又到保險公司投保颱風、地震、海嘯、冰雹、洪水或因雨積水附加條款，其中汽車車體損失險為基本自負額，請問加保保颱風、地震、海嘯、冰雹、洪水或因雨積水附加條款時，其自負額如何選擇？","options":["選基本自負額","選10％自負額","選20％自負額","該附加條款無自負額規定"]},{"id":654,"category":"汽車保險","source_no":12,"answer":"B","stem":"強制汽車責任保險給付標準規定，受害人因汽車交通事故，致原有殘廢程度加重，應如何給付？","options":["應按加重之等級給付標準給與之","應按加重之等級給付標準扣除原殘廢給付標準給與之","應按加重之等級給付標準再加一個等級給與之","應按加重之等級給付標準再加二個等級給與之"]},{"id":655,"category":"汽車保險","source_no":13,"answer":"D","stem":"任意汽 },{"id":1108,"category":"責任保險","source_no":138,"answer":"D","stem":"以下何者不在高爾夫球員責任保險承保之列","options":["被保險人揮桿擊傷欣賞球賽之觀眾致觀眾眼睛失明，依法應負之賠償責任","被保險人擊球，飛球擊破場外停放之他人汽車玻璃","被保險人揮桿折斷球桿","被保險人在球場駕車撞傷球友"]},{"id":1109,"category":"責任保險","source_no":139,"answer":"C","stem":"旅行業責任保險保單條款約定：若旅遊團員所搭乘之飛機遭劫持，且若被劫持已逾被保險人所申報保險結束日期者，除保險契約另有約定外，將自動延長至旅遊團員完全脫離被劫持之狀況為止，但自出發日起最多不超過多少天？","options":["60天","120天","180天","未約定"]},{"id":1110,"category":"責任保險","source_no":140,"answer":"B","stem":"責任保險人對於被保險人訴訟費用之負擔通常是：","options":["完全負擔","僅負擔民事有關之費用","僅負擔刑事有關之費用","完全不負擔"]},{"id":1111,"category":"責任保險","source_no":141,"answer":"D","stem":"關於我國現行產品責任保險下列敘述何者不正確：","options":["本保險賠償基礎一律採「索賠基礎」，得更改為「事故發生基礎」","製造商投保本保單時得將所有合作之經銷商加批成為附加被保險人","當保險契約終止或到期後不續保時，得以附加方式延長受賠償請求期間，期間為2個月內","懲罰性賠償金是被保險人專屬責任，不得轉嫁，不得加批承保"]},{"id":1112,"category":"責任保險","source_no":142,"answer":"A","stem":"國內路跑活動盛行，主管機關要求各路跑活動主辦單位應投保之保險為","options":["公共意外責任保險","節目中斷保險","團體傷害保險","未規定"]},{"id":1113,"category":"責任保險","source_no":143,"answer":"A","stem":"關於醫師業務責任險，以下陳述何者為不正確","options":["被保險人應為公私立醫院","賠償金額限於體傷或死亡，不對財損賠償","因濫用鴉片、嗎啡等毒劑藥品所生之損失，不負賠償責任","承保時須以個別醫師為要保人及被保險人，每一醫師簽發一張保險單"]},{"id":1114,"category":"責任保險","source_no":144,"answer":"C","stem":"依照現行員工誠實保證保險承保之損失雖須被保險人於保險期間內發現，但若保險期間屆滿未續保，則於屆滿後幾日內發現，保險人仍要負保險責任：","options":["30日","45日","60日","90日"]},{"id":1115,"category":"傷害保險","source_no":1,"answer":"C","stem":"金融監督管理委員會最新公布的傷害險失能等級表共分為：","options":["六級","七級","十一級","十五級"]},{"id":1116,"category":"傷害保險","source_no":2,"answer":"D","stem":"傷害保險單示範條款規定：被保險人因意外傷害事故導致失蹤，保險公司已先行給付身故保險金者，若日後發現被保險人生還時，受益人應將該筆已領之身故保險金於多久的期限內歸還保險公司：","options":["5天","10天","1個月","條款未規定"]},{"id":1117,"category":"傷害保險","source_no":3,"answer":"D","stem":"被保險人投保「傷害醫療保險金乙型（日額型）」，保險金額為每日一千元，若不幸發生意外事故導致完全骨折因而住院10天，骨折部位為臀骨完全骨折，臀骨依照骨折表為40天，其理賠金額為何？","options":["10,000元","13,750元","17,500元","25,000元"]},{"id":1118,"category":"傷害保險","source_no":4,"answer":"A","stem":"個人傷害保險短期費率1日為年繳保費之","options":["5%","10%","15%","20%"]},{"id":1119,"category":"傷害保險","source_no":5,"answer":"D","stem":"金融監督管理委員會最新備查產、壽險公會「保險業招攬及核保作業控管自律規範」，規定業務員招攬時所填報之業務員報告書或其他招攬文件或電話錄音紀錄，其內容至少應包括： 1.要保人、被保險人及受益人身分； 2.要保人及被保險人投保目的及需求； 3.要保人年收入或財務狀況； 4.要保人及被保險人是否投保其他商業保險。","options":["1、2、3","1、3、4","2、3、4","1、2、3、4"]},{"id":1120,"category":"傷害保險","source_no":6,"answer":"A","stem":"下列有關為型保險商品之敘述，何者為真？ 1.商品內容不得含有生存或滿期給付之設計 2.商品之設計應以簡單為原則，並以承保單一保險事故為限 3.產、壽險業均得銷售一年期傷害保險及健康保險，但壽險業尚可銷售一年期傳統型定期人壽保險 4.每張微型保險商品均採核准制審查","options":["1、2","1、2、3","1、2、4","1、2、3、4"]},{"id":1121,"category":"傷害保險","source_no":7,"answer":"C","stem":"被保險人若從事下列哪些活動於傷害保險中屬除外不保事項：","options":["打籃球","開車上下班","參加運動會之空手道表演","在工廠工作"]},{"id":1122,"category":"傷害保險","source_no":8,"answer":"C","stem":"傷害保險核保人員的初步工作為：","options":["評估危險","控制危險","認識危險","避開危險"]},{"id":1123,"category":"傷害保險","source_no":9,"answer":"D","stem":"下面有關微型保險之敘述，何者為真？ 1.保險業承保微型保險以免體檢件為原則 2.微型保險商品之失能保險金受益人為被保險人本人，保險業不得受理指定或變更 3.微型保險身故保險金受益人之指定及變更，以被保險人之家屬或其法定繼承人為限。","options":["1、2","1、3","2、3","1、2、3"]},{"id":1124,"category":"傷害保險","source_no":10,"answer":"D","stem":"傷害保險契約之受益人「身故保險金」者，需檢具何種資料：1.理賠申請書 2.相驗屍體證明書 3.除戶戶籍謄本 4.受益人的身分證明","options":["1、2、3","2、3、4","1、3、4","1、2、3、4"]},{"id":1125,"category":"傷害保險","source_no":11,"answer":"B","stem":"傷害保險單示範條款規定，失能保險金的受益人為何人：","options":["要保人","被保險人","保單約定的受益人","可由要保人自行約定"]},{"id":1126,"category":"傷害保險","source_no":12,"answer":"C","stem":"台灣地區傷害保險個人職業分類表，將職業危險程度分為","options":["2類","4類","6類","8類"]},{"id":1127,"category":"傷害保險","source_no":13,"answer":"C","stem":"個人傷害保險被保險人投保時應告知事項：","options":["被保險人上班之地點","被保險人上班搭乘之交通工具","是否有在其他保險公司投保傷害醫療保險給付實支實付之商品","被保險人飲食習慣"]},{"id":1128,"category":"傷害保險","source_no":14,"answer":"B","stem":"投保時，被保險人數多少人以上之團體，其費率由契約雙方洽訂","options":["30人","50 人","80人","100人"]},{"id":1129,"category":"傷害保險","source_no":15,"answer":"A","stem":"傷害保險單示範條款規定飲酒駕車超過道路交通法令標準者婉拒理賠，其血液中酒精濃度百分比標準值為：","options":["0.05%","0.25%","0.5%","5%"]},{"id":1130,"category":"傷害保險","source_no":16,"answer":"D","stem":"傷害保險契約約定自意外傷害發生後幾日內致成失能者，保險公司給付失能保險金：","options":["30日","60日","90日","180日"]},{"id":1131,"category":"

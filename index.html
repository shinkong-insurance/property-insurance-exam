事故人身意外保險","海外突發疾病保險"]},{"id":1144,"category":"傷害保險","source_no":30,"answer":"B","stem":"依據傷害保險單示範條款之規定，若被保險人職業或職務有變更時，要保人或被保險人應以何種方式通知保險公司：","options":["電話通知","書面通知","轉知業務員即可","以上皆可"]},{"id":1145,"category":"傷害保險","source_no":31,"answer":"B","stem":"現行保險法第一百零七條針對未成年人投保保險之相關規定，下列敘述何者為真？ 1.未成年人係指以未滿15歲者為被保險人； 2.訂立之人壽保險契約，其死亡給付於被保險人滿15歲之日起發生效力；3.傷害保險及健康保險準用該條規定； 4.被保險人滿15歲前死亡者，保險人得加計利息退還所繳保險費，或返還投資型保險專設帳簿之帳戶價值","options":["1、2、3","1、2、4","2、3、4","1、 2、3、4"]},{"id":1146,"category":"傷害保險","source_no":32,"answer":"A","stem":"下列有關銷售微型保險商品招攬人員資格條件之敘述，何者為真？1.應符合保險經紀人管理規則、保險代理人管理規則或保險業務員管理規則或郵政簡易人壽保險監督管理辦法所定資格條件 2.通過產險公會或壽險公會所舉辦之業務員資格測驗，並完成資格登錄者 3.通過產險公會或壽險公會所舉辦之業務員教育訓練，並測驗合格者。","options":["1、2","1、3","2、3","1、 2、3"]},{"id":1147,"category":"傷害保險","source_no":33,"answer":"D","stem":"下列有關「團體傷害保險單示範條款」之敘述何者為真 1.保險契約所稱要保人是指要保單位 2.所稱被保險人是指契約所附被保險人名冊內所載之人員 3.所稱團體是指具有5人以上且非以購買保險而組織之團體 4.保險契約的保險期間，以保險單上所載日時為準","options":["1、2、3","1、2、4","1、3、4","1、 2、3、4"]},{"id":1148,"category":"傷害保險","source_no":34,"answer":"D","stem":"下列何種團體屬於團體傷害保險單中所定義的「團體」：1.產險公會 2.理髮師工會 3.台北市政府 4.紅十字會","options":["1、2、3","1、2、4","1、3、4","1、 2、 3、4"]},{"id":1149,"category":"傷害保險","source_no":35,"answer":"C","stem":"傷害醫療保險給付附加條款（日額型）約定，自意外傷害事故發生之日起幾日內經登記合格的醫院治療者，保險公司就其住院日數，給付保險單所載的傷害醫療保險金日額：","options":["30日","60日","90日","360日"]},{"id":1150,"category":"傷害保險","source_no":36,"answer":"B","stem":"依據「保險業辦理微型保險業務應注意事項」之規定，保險業得經營之微型保險包括 1.一年期傳統型定期人壽保險 2.一年期傷害保險 3.一年期健康保險 4.以醫療費用收據正本理賠方式辦理之一年期時之實付型傷害醫療保險","options":["1、2、3","1、2、4","2、3、4","1、 2、3、4"]},{"id":1151,"category":"傷害保險","source_no":37,"answer":"A","stem":"金融監督管理委員會最新公布的失能程度與保險金給付表所謂「鼻未缺損，而鼻機能永久遺存顯著障害者」之給付百分比為：","options":["5%","10%","15%","20%"]},{"id":1152,"category":"傷害保險","source_no":38,"answer":"D","stem":"傷害保險契約所生之權利，自得為請求之日起，經過幾年不行使而消滅？","options":["半年","一年","一年半","二年"]},{"id":1153,"category":"傷害保險","source_no":39,"answer":"C","stem":"消費者最容易辨識是否為微型保險商品之方式為","options":["保單內容","保險費高低","保險商品名稱","行銷通路"]},{"id":1154,"category":"傷害保險","source_no":40,"answer":"A","stem":"為節能減碳，鼓勵市民使用綠色運具，如台北市之YouBike公共自行車，請問下列何種保險商品對公共自行車使用者之生命安全最具有保障","options":["個人傷害保險","公共意外責任保險","產品責任保險","住院醫療保險"]},{"id":1155,"category":"傷害保險","source_no":41,"answer":"B","stem":"有關「神經障害等級」之審定原則，若被保險人為維持生命必要之日常生活活動尚可自理，但因神經障害高度，終身不能從事工作者，適用第幾級失能程度","options":["第2級","第3級","第4級","第5級"]},{"id":1156,"category":"傷害保險","source_no":42,"answer":"C","stem":"傷害保險單示範條款傷害醫療保險給付附加條款（日額型）骨折表，完全骨折之最高給付日數大腿骨頸骨折為","options":["40日","50日","60日","90日"]},{"id":1157,"category":"傷害保險","source_no":43,"answer":"A","stem":"傷害保險契約約定保險公司在受理被保險人的理賠申請後，如給付逾期者保險公司應給付多少利息：","options":["年利1分","年利1厘","年利2分","年利2厘"]},{"id":1158,"category":"傷害保險","source_no":44,"answer":"A","stem":"要保人訂立保險契約時，如有為隱匿或遺漏不為說明，或為不實之說明，足以變更或減少保險公司對於危險的估計者，保險公司可於自知有解除原因多久的時間內解除契約：","options":["1個月","2個月","3個月","6個月"]},{"id":1159,"category":"傷害保險","source_no":45,"answer":"B","stem":"2016年7月14日法國國慶日當天，尼斯（Nice）發生卡車衝撞人群事件，造成84 人死亡200多人受傷，伊斯蘭國（ISIS）聲稱係其發動之恐怖攻擊行動，當天適有在當地之台灣旅行團，參加旅行人員出國前有向某產險公司購買旅行平安保險並加貼恐怖主義行為保險限額給付附加條款，請問現行傷害保險恐怖主義行為保險限額給付附加條款約定死亡保額的上限為新台幣：","options":["100萬元","200萬元","300萬元","500萬元"]},{"id":1160,"category":"傷害保險","source_no":46,"answer":"B","stem":"下列何種保險可免辦理保險通報作業","options":["微型保險","公共自行車傷害保險","鄉鎮市民團體保險","國軍官兵團體保險"]},{"id":1161,"category":"傷害保險","source_no":47,"answer":"D","stem":"有關待記名傷害保險團體承保辦法，下列敘述何者為真？ 1.要保方式比照團體保險要保書方式，由代為投保之業者逕代要保人向保險公司投保 2.要保人即為被保險人 3.受益人以被保險人本人或其法定繼承人為限 4.通常以在工地、遊樂區及交通工具等入口處製作告示牌或以標示之方式，告知被保險人使其知悉已代投保保險","options":["1、2、3","1、2、4","1、3、4","1、 2、3、4"]},{"id":1162,"category":"傷害保險","source_no":48,"answer":"D","stem":"現行個人傷害保險之附加費用率為","options":["31.7%","32.7%","34.7%","由各公司自行決定"]},{"id":1163,"category":"傷害保險","source_no":49,"answer":"B","stem":"下列有關微型保險商品保險費率結構之敘述，何者為真？ 1.投保時，被保險人數 50人以下之團體可不受一年期團體保險費率標準之費率限制 2.個人傷害險費率之危險發生率可不受下限相關規定之限制 3.預定附加費用率，不得高於總保費之 20% 4.採集體投保方式辦理業務時，得依集體內個體之危險狀況採個別費率計算，或評估集體之平均危險程度採單一或區間費率方式計算。","options":["1、2、3","1、 2、4","2、3、4","1、 2、3、4"]},{"id":1164,"category":"傷害保險","source_no":50,"answer":"C","stem":"傷害保險要保書中屬於要保人或被保險人之授權及同意事項部分稱之為","option ,"answer":"C","stem":"受益人若申領「失能保險金」，保險公司得對被保險人的身體予以檢驗，其費用由誰負擔：","options":["被保險人自行負擔","要保人負擔","保險公司負擔","保險業務員負擔"]},{"id":1176,"category":"傷害保險","source_no":62,"answer":"C","stem":"保險業以集體投保方式辦理微型保險者，代理要保人洽訂微型保險契約之代理投保單位、要保人及被保險人應符合之條件，下列敘述何者為真？ 1.要保人與被保險人須為同一人，且須被保險人達十人以上 2.保險業應與代理要保人之代理投保單位簽訂微型保險契約 3.代理投保單位與經濟弱勢或特定身分要保人間需具有保險業辦理微型保險業務應注意事項規定之連結關係，且除公私立學校及直轄市政府、縣（市）政府、鄉（鎮、市）公所、區公所、村（里）辦公室外，各該單位已具有法人人格及成立至少二年以上者為限。","options":["1、2","1、3","2、3","1、 2、3"]},{"id":1177,"category":"傷害保險","source_no":63,"answer":"D","stem":"下列何屬登山綜合保險緊急救援費用保險之承保範圍 1.搜尋費用 2.救護費用 3.遺體移送費用","options":["1、2","1、3","2、3","1、 2、3"]},{"id":1178,"category":"傷害保險","source_no":64,"answer":"C","stem":"傷害保險契約約定自意外傷害發生後幾日內死亡者，保險公司給付死亡保險金：","options":["30日","90日","180日","270日"]},{"id":1179,"category":"傷害保險","source_no":65,"answer":"B","stem":"傷害保險失能有關視力之測定，係以自傷害之日起經過多久的治療為判定原則，但眼球摘出等明顯無法復原之情況不在此限","options":["3個月","6個月","9個月","12 個月"]},{"id":1180,"category":"傷害保險","source_no":66,"answer":"D","stem":"傷害保險單示範條款有關「職業或職務的通知義務」之規定，下列何者為真？ 1 被保險人變更其職業或職務時，要保人或被保險人應即時以書面通知保險公司 2. 被保險人所變更的職業或職務，依保險公司職業分類其危險較低時,保險公司於接到通知後，自職業或職務變更之日起按其差額比率退還未滿期保險費 3.被保險人所變更的職業或職務依照保險公司職業分類在拒保範圍者，保險公司於接到通知後得終止契約，並按日計算退還未滿期保險費","options":["1、2","1、3","2、3","1、 2、3"]},{"id":1181,"category":"傷害保險","source_no":67,"answer":"C","stem":"有關個人傷害保險受益人之敘述下列何者為是","options":["受益人故意致被保險人於死或雖未致死者，該受益人喪失其受益資格，但其他受益人亦不得申領保險金","無其他受益人時，除要保人已另行指定受益人，以被保險人之法定繼承人為受益人，法定繼承人之順序及應得保險金之比例適用保險法繼承編相關規定","失能保險金及傷害醫療保險金的受益人，為被保險人本人，保險公司不受理其指定或變更","被保險人於訂定保險契約時或保險事故發生前，得指定或變更身故保險金受益人。"]},{"id":1182,"category":"傷害保險","source_no":68,"answer":"B","stem":"受益人若先於被保險人身故，死亡保險金將如何處理：","options":["視為被保險人的遺產","以被保險人的法定繼承人為受益人","由家屬自行協調","契約當中未有明確規定"]},{"id":1183,"category":"傷害保險","source_no":69,"answer":"D","stem":"下列何者非屬現行待記名傷害保險團體承保辦法規範之適用對象？","options":["工地工程人員","交通工具乘客","遊樂區遊客","鄉鎮市民"]},{"id":1184,"category":"傷害保險","source_no":70,"answer":"D","stem":"傷害保險契約與壽險契約有何不同之處：","options":["費率計算的基礎不同","承保的範圍不同","核保的考量不同","以上皆是"]},{"id":1185,"category":"傷害保險","source_no":71,"answer":"A","stem":"保險業辦理微型保險業務績效符合一定條件者，得適用獎勵措施，此所稱一定條件係指各該保險業於申請當時最近一年辦理微型保險業務之承保對象屬經濟弱勢者或特定身分者，且其承保該等對象之總保費收入占其總保費收入之比率排名位於全業界七十五百分位以上者，或其承保該等對象之總保費收入排名位於屆七十五百分位以上者，或其承保該等對象之總保費收入達新台幣多少元以上者","options":["500 萬元","750萬元","800萬元","1,000萬元"]},{"id":1186,"category":"傷害保險","source_no":72,"answer":"A","stem":"受益人故意致被保險人於死或雖未致死者，該受益人的受益資格在傷害保險單示範條款之規定為何：","options":["受益資格喪失","受益資格不變","條款當中未有明確規定","依照法院判決而定"]},{"id":1187,"category":"傷害保險","source_no":73,"answer":"C","stem":"現行傷害保險職業分類係數比，第四類職業為第一類職業之幾倍","options":["1.25","1.5","2.25","3.5"]},{"id":1188,"category":"傷害保險","source_no":74,"answer":"D","stem":"傷害保險契約約定自意外傷害發生起180日以內死亡者，保險公司給付保險金，此規定的意義在於：","options":["為釐清意外傷害事故與死亡之間的因果關係","為避免保險公司對於所需負擔的保險責任拖長","為確定保險人的責任歸屬","以上皆是"]},{"id":1189,"category":"傷害保險","source_no":75,"answer":"B","stem":"「保險業招攬及核保作業控管自律規範」規定，旅行平安保險同一被保險人累積同一公司投保金額新臺幣多少以上時，應採行財務核保作業？","options":["1,001萬元","2,001萬元","2,501萬元","由各公司自行訂定"]},{"id":1190,"category":"傷害保險","source_no":76,"answer":"A","stem":"「保險業招攬及核保作業控管自律規範」規定，產險公司執行隨機抽樣電訪之比例為新契約及契約變更總件數之百分之多少","options":["1","4","10","15"]},{"id":1191,"category":"傷害保險","source_no":77,"answer":"B","stem":"保險業辦理旅行平安保險費率以金融監督管理委員會所公布之個人投保旅行平安保險意外死亡及失能給付標準費率表為上限，各公司得依其經驗損失率資料調整費率，惟意外死亡及失能之欲其損失率下陷應為標準費率表損失率之","options":["95%","90%","80%","70%"]},{"id":1192,"category":"傷害保險","source_no":78,"answer":"B","stem":"若被保險人發生意外事故致國術館接骨，依照傷害醫療保險給付附加條款的規定，可否理賠：","options":["可","不可","依照個案處理","示範條款當中未有明確規定"]},{"id":1193,"category":"傷害保險","source_no":79,"answer":"C","stem":"傷害保險契約若發生疑義時，應以有利於誰的解釋為原則：","options":["受益人","保險人","被保險人","依法院判決而定"]},{"id":1194,"category":"傷害保險","source_no":80,"answer":"A","stem":"現行個人傷害保險重大事故特別準備金提存率為","options":["1%","2%","3%","5%"]},{"id":1195,"category":"傷害保險","source_no":81,"answer":"D","stem":"下列何者適用待記名傷害保險團體承保辦法：","options":["工地工程人員平安保險","交通工具乘客平安保險","遊樂區遊客平安保險","以上皆是"]},{"id":1196,"category":"傷害保險","source_no":82,"answer":"A","stem":"「保險業招攬及核保作業控管自律規範」規定，傷害保險同一被保險人累積同一公司投保金額新臺幣多少以上時，應進行生調作業？","options":["1,001萬元","2,001萬元","2,501萬元","由各公司自 const LS = {
  wrong: "pins_wrong_v1",
  fav: "pins_fav_v1",
  progress: "pins_progress_v1",
  records: "pins_records_v1",
  theme: "pins_theme_v1",
};
function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ /* storage unavailable, fail silently */ }
}
let wrongMap = loadJSON(LS.wrong, {});       // {qid: {count, last}}
let favMap = loadJSON(LS.fav, {});           // {qid: true}
let progress = loadJSON(LS.progress, {});    // {catKey: {attempted, correct}}
let records = loadJSON(LS.records, []);      // [{id,date,mode,label,score,correct,total,passed,subjects:[]}]

function ensureProgress(catKey){
  if(!progress[catKey]) progress[catKey] = {attempted:0, correct:0};
  return progress[catKey];
}
function recordAnswer(q, isCorrect){
  const p = ensureProgress(q.category);
  p.attempted++; if(isCorrect) p.correct++;
  saveJSON(LS.progress, progress);
  if(!isCorrect){
    const cur = wrongMap[q.id] || {count:0};
    cur.count++; cur.last = Date.now();
    wrongMap[q.id] = cur;
    saveJSON(LS.wrong, wrongMap);
  }
}
function clearWrong(qid){ delete wrongMap[qid]; saveJSON(LS.wrong, wrongMap); }
function toggleFav(qid){
  if(favMap[qid]) delete favMap[qid]; else favMap[qid] = true;
  saveJSON(LS.fav, favMap);
}

function applyTheme(mode){
  const root = document.documentElement;
  if(mode === "light" || mode === "dark") root.setAttribute("data-theme", mode);
  else root.removeAttribute("data-theme");
  const icon = document.getElementById("themeIcon");
  const isDark = mode === "dark" || (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  icon.innerHTML = isDark
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>'
    : '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>';
}
let themeMode = loadJSON(LS.theme, "system");
applyTheme(themeMode);
document.getElementById("themeToggle").addEventListener("click", ()=>{
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const curDark = themeMode === "dark" || (themeMode==="system" && sysDark);
  themeMode = curDark ? "light" : "dark";
  saveJSON(LS.theme, themeMode);
  applyTheme(themeMode);
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickN(arr, n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function fmtDate(ts){
  const d = new Date(ts);
  const p = n=>String(n).padStart(2,"0");
  return d.getFullYear()+"/"+p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function go(hash){ window.location.hash = hash; }

const routes = {};
function route(pattern, fn){ routes[pattern] = fn; }
function render(){
  const hash = window.location.hash.slice(1) || "/home";
  const parts = hash.split("/").filter(Boolean);
  const main = document.getElementById("main");
  window.scrollTo(0,0);
  let html = "";
  try{
    if(parts.length===0 || parts[0]==="home") html = viewHome();
    else if(parts[0]==="practice" && parts.length===1) html = viewPracticePicker();
    else if(parts[0]==="practice" && parts[1]) html = startPracticeSession(decodeURIComponent(parts[1]), parts[2]);
    else if(parts[0]==="session") html = viewSession();
    else if(parts[0]==="exam") html = viewExamSetup();
    else if(parts[0]==="exam-run") html = viewExamRunning();
    else if(parts[0]==="exam-result") html = viewExamResult();
    else if(parts[0]==="wrongbook") html = viewWrongbook();
    else if(parts[0]==="favorites") html = viewFavorites();
    else if(parts[0]==="progress") html = viewProgress();
    else html = viewHome();
  }catch(e){
    console.error(e);
    html = '<div class="empty-state">'+icon("info")+'<p>頁面發生錯誤，請返回首頁重新開始。</p></div>';
  }
  main.innerHTML = '<div class="view">'+html+'</div>';

}

/* ============================================================
   SESSION ENGINE (shared by practice / review / exam)
   ============================================================ */
let SESSION = null;
/*
SESSION = {
  mode: 'practice' | 'review-wrong' | 'review-fav' | 'exam',
  title, order: [ids...], idx, answers: {qid:{picked, correct}},
  flagged: Set, startTs, durationSec (exam only), subject label (exam only),
  onFinishHash
}
*/
function buildSession(cfg){
  SESSION = Object.assign({
    idx:0, answers:{}, flagged:new Set(), startTs:Date.now()
  }, cfg);
  return SESSION;
}
function startPracticeSession(catKey, mode){
  const pool = QBY_CAT[catKey];
  if(!pool || !pool.length) return viewPracticePicker();
  buildSession({
    mode:"practice",
    title:catKey,
    order: shuffle(pool).map(q=>q.id),
    onFinishHash:"#/practice"
  });
  go("#/session");
  return "";
}
function startReviewSession(kind){
  const ids = kind==="wrong" ? Object.keys(wrongMap).map(Number) : Object.keys(favMap).map(Number);
  if(!ids.length) return;
  buildSession({
    mode: kind==="wrong" ? "review-wrong" : "review-fav",
    title: kind==="wrong" ? "錯題複習" : "收藏複習",
    order: shuffle(ids),
    onFinishHash: kind==="wrong" ? "#/wrongbook" : "#/favorites"
  });
  go("#/session");
}

function viewSession(){
  if(!SESSION) return `<div class="empty-state">${icon("info")}<p>目前沒有進行中的練習，請從分類練習開始。</p></div>`;
  const s = SESSION;
  if(s.idx >= s.order.length){
    return sessionSummary();
  }
  const q = QBY_ID[s.order[s.idx]];
  const ans = s.answers[q.id];
  const total = s.order.length;
  const modeLabel = {practice:"分類練習", "review-wrong":"錯題複習", "review-fav":"收藏複習"}[s.mode] || "練習";
  return `
  <button class="back-btn" onclick="endSession()">${icon("cross")} 結束練習</button>
  <div class="session-bar" style="margin-top:16px;">
    <div class="progress-track"><div class="progress-fill" style="width:${Math.round((s.idx)/total*100)}%"></div></div>
    <div class="session-meta tabular">${s.idx+1} / ${total}</div>
  </div>
  ${renderQuestionCard(q, ans, {
      showBookmark:true,
      showReveal: s.mode!=="exam",
      footerExtra: renderPracticeFooter(modeLabel)
    })}
  `;
}
function renderPracticeFooter(modeLabel){
  return `<span class="q-tag" style="background:var(--surface-2);color:var(--text-faint);">${escapeHtml(modeLabel)}</span>`;
}
function sessionSummary(){
  const s = SESSION;
  const total = s.order.length;
  let correct = 0;
  s.order.forEach(id=>{ if(s.answers[id] && s.answers[id].correct) correct++; });
  const acc = total ? Math.round(correct/total*100) : 0;
  return `
  <div class="score-hero">
    <div style="font-size:13px;color:var(--text-faint);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;">練習結束</div>
    <div class="big-score tabular">${correct} / ${total}</div>
    <div class="pass-pill ${acc>=70?'pass':'fail'}">正確率 ${acc}%</div>
  </div>
  <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;">
    <button class="btn btn-primary" onclick="restartSession()">${icon("target")} 再練一次</button>
    <a class="btn btn-ghost" href="${s.onFinishHash||'#/home'}">回列表</a>
    <a class="btn btn-ghost" href="#/home">回首頁</a>
  </div>
  `;
}
function restartSession(){
  if(!SESSION) return;
  SESSION.order = shuffle(SESSION.order);
  SESSION.idx = 0;
  SESSION.answers = {};
  render();
}
function endSession(){
  const hash = SESSION ? (SESSION.onFinishHash || "#/home") : "#/home";
  SESSION = null;
  go(hash);
}

/* shared question card renderer used by practice/review (immediate feedback) */
function renderQuestionCard(q, ans, opts){
  opts = opts || {};
  const letters = ["A","B","C","D"];
  const isFav = !!favMap[q.id];
  const answered = !!ans;
  const optionsHtml = q.options.map((opt,i)=>{
    const letter = letters[i];
    let cls = "opt-btn";
    if(answered){
      if(letter === q.answer) cls += " correct";
      else if(letter === ans.picked) cls += " wrong";
    }
    return `<button class="${cls}" ${answered?"disabled":""} data-act="pick" data-letter="${letter}">
      <span class="opt-letter">${letter}</span><span>${escapeHtml(opt)}</span>
    </button>`;
  }).join("");
  let banner = "";
  if(answered){
    banner = ans.correct
      ? `<div class="result-banner ok">${icon("check")} 答對了！`+`</div>`
      : `<div class="result-banner no">${icon("cross")} 答錯了，正確答案是 ${q.answer}</div>`;
  }
  return `
  <div class="q-card" data-qid="${q.id}">
    <div class="q-head">
      <span class="q-tag">${escapeHtml(q.category)} · 題號 ${q.source_no}</span>
      ${opts.showBookmark ? `<button class="bookmark-btn ${isFav?'active':''}" data-act="fav" title="收藏本題">${icon("bookmark")}</button>` : ""}
    </div>
    <div class="q-stem">${escapeHtml(q.stem)}</div>
    <div class="q-options">${optionsHtml}</div>
    ${banner}
    <div class="q-footer">
      <div class="left-actions">
        ${opts.showReveal && !answered ? `<button class="btn btn-ghost btn-sm" data-act="reveal">顯示答案</button>` : ""}
        ${opts.footerExtra || ""}
      </div>
      <button class="btn btn-primary btn-sm" data-act="next" ${answered?"":"disabled"}>下一題 →</button>
    </div>
  </div>
  `;
}

function bindDynamicHandlers(){
  const main = document.getElementById("main");
  main.querySelectorAll('[data-act="pick"]').forEach(btn=>{
    btn.addEventListener("click", ()=>handlePick(btn.dataset.letter));
  });
  const reveal = main.querySelector('[data-act="reveal"]');
  if(reveal) reveal.addEventListener("click", handleReveal);
  const nextBtn = main.querySelector('[data-act="next"]');
  if(nextBtn) nextBtn.addEventListener("click", handleNext);
  const favBtn = main.querySelector('[data-act="fav"]');
  if(favBtn) favBtn.addEventListener("click", ()=>{
    const qid = Number(main.querySelector(".q-card").dataset.qid);
    toggleFav(qid);
    render();
  });
  const submitExam = main.querySelector('[data-act="submit-exam"]');
  if(submitExam) submitExam.addEventListener("click", ()=>finishExamSubject(false));
  main.querySelectorAll('[data-act="start-exam"]').forEach(btn=>{
    btn.addEventListener("click", ()=>startExam(btn.dataset.exam));
  });
  main.querySelectorAll('[data-act="review-start"]').forEach(btn=>{
    btn.addEventListener("click", ()=>startReviewSession(btn.dataset.kind));
  });
  main.querySelectorAll('[data-act="clear-wrong"]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const qid = Number(btn.dataset.qid);
      clearWrong(qid); render();
    });
  });
  main.querySelectorAll('[data-act="unfav"]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const qid = Number(btn.dataset.qid);
      toggleFav(qid); render();
    });
  });
  const clearAllWrong = main.querySelector('[data-act="clear-all-wrong"]');
  if(clearAllWrong) clearAllWrong.addEventListener("click", ()=>{
    if(confirm("確定要清空整個錯題本嗎？")){ wrongMap = {}; saveJSON(LS.wrong, wrongMap); render(); }
  });
  const resetProgress = main.querySelector('[data-act="reset-progress"]');
  if(resetProgress) resetProgress.addEventListener("click", ()=>{
    if(confirm("確定要重設所有學習進度與模擬考紀錄嗎？此動作無法復原。")){
      progress = {}; records = [];
      saveJSON(LS.progress, progress); saveJSON(LS.records, records);
      render();
    }
  });
}

function handlePick(letter){
  const s = SESSION;
  if(!s) return;
  const q = QBY_ID[s.order[s.idx]];
  if(s.answers[q.id]) return;
  const correct = letter === q.answer;
  s.answers[q.id] = {picked:letter, correct};
  recordAnswer(q, correct);
  if(correct && s.mode==="review-wrong") clearWrong(q.id);
  render();
}
function handleReveal(){
  const s = SESSION;
  const q = QBY_ID[s.order[s.idx]];
  if(s.answers[q.id]) return;
  s.answers[q.id] = {picked:null, correct:false};
  recordAnswer(q, false);
  render();
}
function handleNext(){
  const s = SESSION;
  s.idx++;
  render();
}

/* ============================================================
   EXAM ENGINE
   ============================================================ */
let EXAM = null;
/*
EXAM = {
  kind: 'full' | 'practical' | 'regulation',
  subjects: [ {label, pool key, questionIds, durationSec, pointsPer, startedAt, elapsedBefore, answers:{}} ],
  subjectIdx, timerHandle, finished:false, results:[]
}
*/
function startExam(kind){
  const practicalIds = pickN(PRACTICAL_POOL, 100).map(q=>q.id);
  const regulationIds = pickN(REG_POOL, 50).map(q=>q.id);
  const subjects = [];
  if(kind==="full" || kind==="practical"){
    subjects.push({label:"產險實務", ids:practicalIds, durationSec:80*60, pointsPer:1, answers:{}, flagged:new Set()});
  }
  if(kind==="full" || kind==="regulation"){
    subjects.push({label:"產險法規", ids:regulationIds, durationSec:50*60, pointsPer:2, answers:{}, flagged:new Set()});
  }
  EXAM = { kind, subjects, subjectIdx:0, idx:0, results:[], deadline: Date.now() + subjects[0].durationSec*1000 };
  go("#/exam-run");
}
function currentExamSubject(){ return EXAM.subjects[EXAM.subjectIdx]; }

function viewExamRunning(){
  if(!EXAM) return `<div class="empty-state">${icon("info")}<p>目前沒有進行中的模擬考。</p></div>`;
  const subj = currentExamSubject();
  const qid = subj.ids[EXAM.idx];
  const q = QBY_ID[qid];
  const ans = subj.answers[qid];
  const total = subj.ids.length;

  startExamTimerIfNeeded();

  const letters = ["A","B","C","D"];
  const optionsHtml = q.options.map((opt,i)=>{
    const letter = letters[i];
    const picked = ans === letter;
    return `<button class="opt-btn ${picked?'selected':''}" data-act="exam-pick" data-letter="${letter}">
      <span class="opt-letter">${letter}</span><span>${escapeHtml(opt)}</span>
    </button>`;
  }).join("");

  const jumpCells = subj.ids.map((id,i)=>{
    let cls = "jump-cell";
    if(i===EXAM.idx) cls += " current";
    if(subj.answers[id]) cls += " done";
    if(subj.flagged.has(id)) cls += " flagged";
    return `<button class="${cls}" data-act="jump" data-idx="${i}">${i+1}</button>`;
  }).join("");

  const answeredCount = Object.keys(subj.answers).length;

  return `
  <div class="session-bar">
    <button class="back-btn" data-act="abandon-exam">${icon("cross")} 放棄本次模擬考</button>
    <span class="q-tag">${escapeHtml(subj.label)}</span>
    <span class="timer-chip tabular" id="examTimer">${icon("clock")} --:--</span>
  </div>
  <div class="progress-track"><div class="progress-fill" style="width:${Math.round(EXAM.idx/total*100)}%"></div></div>
  <div class="session-meta tabular" style="margin:8px 0 16px;">第 ${EXAM.idx+1} / ${total} 題 · 已作答 ${answeredCount} 題</div>

  <div class="q-card" data-qid="${q.id}">
    <div class="q-head">
      <span class="q-tag" style="background:var(--surface-2);color:var(--text-faint);">題號 ${q.source_no}</span>
      <button class="bookmark-btn ${subj.flagged.has(qid)?'active':''}" data-act="flag" data-qid="${qid}" title="標記待review">${icon("flag")}</button>
    </div>
    <div class="q-stem">${escapeHtml(q.stem)}</div>
    <div class="q-options">${optionsHtml}</div>
    <div class="q-footer">
      <div class="left-actions">
        <button class="btn btn-ghost btn-sm" data-act="exam-prev" ${EXAM.idx===0?"disabled":""}>← 上一題</button>
        <button class="btn btn-ghost btn-sm" data-act="exam-next" ${EXAM.idx>=total-1?"disabled":""}>下一題 →</button>
      </div>
      <button class="btn btn-primary btn-sm" data-act="submit-exam">交卷</button>
    </div>
  </div>

  <div class="section-title" style="margin-top:22px;">${icon("chart")} 作答卡</div>
  <div class="card"><div class="jump-grid">${jumpCells}</div></div>
  `;
}

let examTimerInterval = null;
function startExamTimerIfNeeded(){
  clearInterval(examTimerInterval);
  examTimerInterval = setInterval(()=>{
    if(!EXAM) { clearInterval(examTimerInterval); return; }
    const remain = (EXAM.deadline - Date.now())/1000;
    const chip = document.getElementById("examTimer");
    if(chip){
      chip.innerHTML = icon("clock") + " " + fmtTime(remain);
      chip.classList.toggle("low", remain <= 300);
    }
    if(remain <= 0){
      clearInterval(examTimerInterval);
      finishExamSubject(true);
    }
  }, 1000);
}

function examPick(letter){
  const subj = currentExamSubject();
  const qid = subj.ids[EXAM.idx];
  subj.answers[qid] = letter;
  render();
}
function examNav(delta){
  const subj = currentExamSubject();
  EXAM.idx = Math.max(0, Math.min(subj.ids.length-1, EXAM.idx+delta));
  render();
}
function examJump(i){ EXAM.idx = i; render(); }
function examFlag(qid){
  const subj = currentExamSubject();
  if(subj.flagged.has(qid)) subj.flagged.delete(qid); else subj.flagged.add(qid);
  render();
}
function abandonExam(){
  if(!confirm("確定要放棄本次模擬考嗎？目前作答進度不會列入成績。")) return;
  clearInterval(examTimerInterval);
  EXAM = null;
  go("#/home");
}

function finishExamSubject(auto){
  clearInterval(examTimerInterval);
  const subj = currentExamSubject();
  let correct = 0;
  subj.ids.forEach(id=>{
    const q = QBY_ID[id];
    const picked = subj.answers[id];
    const isCorrect = picked === q.answer;
    if(isCorrect) correct++;
    recordAnswer(q, isCorrect);
  });
  const score = correct * subj.pointsPer;
  EXAM.results.push({label:subj.label, correct, total:subj.ids.length, score, maxScore: subj.ids.length*subj.pointsPer, auto});

  if(EXAM.subjectIdx < EXAM.subjects.length - 1){
    EXAM.subjectIdx++;
    EXAM.idx = 0;
    EXAM.deadline = Date.now() + EXAM.subjects[EXAM.subjectIdx].durationSec*1000;
    go("#/exam-run");
  }else{
    const totalScore = EXAM.results.reduce((a,r)=>a+r.score,0);
    const eachPass = EXAM.results.every(r=> r.score >= r.maxScore*0.6);
    const passThreshold = EXAM.kind==="full" ? 140 : Math.round(EXAM.results[0].maxScore*0.6);
    const passed = EXAM.kind==="full" ? (totalScore>=140 && eachPass) : eachPass;
    const rec = {
      id: Date.now(), date: Date.now(),
      mode: EXAM.kind,
      label: EXAM.kind==="full"?"雙科完整模擬考":EXAM.results[0].label,
      score: totalScore, correct: EXAM.results.reduce((a,r)=>a+r.correct,0),
      total: EXAM.results.reduce((a,r)=>a+r.total,0),
      passed, subjects: EXAM.results
    };
    records.push(rec);
    saveJSON(LS.records, records);
    EXAM.finished = true;
    EXAM.lastRecord = rec;
    go("#/exam-result");
  }
}

function viewExamResult(){
  if(!EXAM || !EXAM.finished) return `<div class="empty-state">${icon("info")}<p>目前沒有模擬考成績可顯示。</p></div>`;
  const rec = EXAM.lastRecord;
  const subjectsHtml = rec.subjects.map(r=>`
    <div class="sb-item">
      <div class="label">${escapeHtml(r.label)}</div>
      <div class="val tabular">${r.score} <span style="font-size:12px;color:var(--text-faint);">/ ${r.maxScore}</span></div>
      <div style="font-size:11.5px;color:var(--text-faint);margin-top:2px;">答對 ${r.correct}/${r.total} 題 ${r.score>=r.maxScore*0.6?"（單科合格）":"（未達單科60分）"}</div>
    </div>
  `).join("");
  return `
  <div class="score-hero">
    <div style="font-size:13px;color:var(--text-faint);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;">${escapeHtml(rec.label)} · 成績單</div>
    <div class="big-score tabular">${rec.score}</div>
    <div class="pass-pill ${rec.passed?'pass':'fail'}">${rec.passed?"通過":"未通過"}</div>
    <div class="subject-breakdown">${subjectsHtml}</div>
  </div>
  <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;">
    <a class="btn btn-primary" href="#/exam">${icon("target")} 再測一次</a>
    <a class="btn btn-ghost" href="#/progress">查看歷次紀錄</a>
    <a class="btn btn-ghost" href="#/home">回首頁</a>
  </div>
  `;
}

/* ============================================================
   VIEW: WRONGBOOK
   ============================================================ */
function viewWrongbook(){
  const ids = Object.keys(wrongMap).map(Number).sort((a,b)=> (wrongMap[b].last||0)-(wrongMap[a].last||0));
  if(!ids.length){
    return `
    <button class="back-btn" onclick="history.back()">${icon("cross")} 返回</button>
    <div class="empty-state">${icon("inbox")}<p>目前沒有錯題，太棒了！去分類練習累積題目吧。</p></div>
    `;
  }
  const rows = ids.map(id=>{
    const q = QBY_ID[id];
    const info = wrongMap[id];
    return `
    <div class="cat-row">
      <div class="cat-main">
        <h4 style="font-weight:500;font-size:13.5px;line-height:1.5;">${escapeHtml(q.stem.slice(0,60))}${q.stem.length>60?"…":""}</h4>
        <div class="cat-figs">${escapeHtml(q.category)} · 題號 ${q.source_no} · 答錯 ${info.count} 次</div>
      </div>
      <button class="btn btn-ghost btn-sm" data-act="clear-wrong" data-qid="${id}">移除</button>
    </div>`;
  }).join("");
  return `
  <button class="back-btn" onclick="history.back()">${icon("cross")} 返回</button>
  <h2 style="margin-top:16px;font-size:20px;">錯題本</h2>
  <p style="color:var(--text-dim);font-size:13.5px;margin-top:6px;">共 ${ids.length} 題待複習，複習答對會自動從錯題本移除。</p>
  <div style="display:flex;gap:10px;margin:14px 0;">
    <button class="btn btn-primary" data-act="review-start" data-kind="wrong">${icon("target")} 開始複習錯題</button>
    <button class="btn btn-danger-ghost btn-sm" data-act="clear-all-wrong">清空錯題本</button>
  </div>
  <div class="cat-list">${rows}</div>
  `;
}

/* ============================================================
   VIEW: FAVORITES
   ============================================================ */
function viewFavorites(){
  const ids = Object.keys(favMap).map(Number);
  if(!ids.length){
    return `
    <button class="back-btn" onclick="history.back()">${icon("cross")} 返回</button>
    <div class="empty-state">${icon("bookmark")}<p>尚未收藏任何題目。作答時點選書籤圖示即可收藏。</p></div>
    `;
  }
  const rows = ids.map(id=>{
    const q = QBY_ID[id];
    return `
    <div class="cat-row">
      <div class="cat-main">
        <h4 style="font-weight:500;font-size:13.5px;line-height:1.5;">${escapeHtml(q.stem.slice(0,60))}${q.stem.length>60?"…":""}</h4>
        <div class="cat-figs">${escapeHtml(q.category)} · 題號 ${q.source_no}</div>
      </div>
      <button class="btn btn-ghost btn-sm" data-act="unfav" data-qid="${id}">取消收藏</button>
    </div>`;
  }).join("");
  return `
  <button class="back-btn" onclick="history.back()">${icon("cross")} 返回</button>
  <h2 style="margin-top:16px;font-size:20px;">收藏</h2>
  <p style="color:var(--text-dim);font-size:13.5px;margin-top:6px;">共 ${ids.length} 題已收藏。</p>
  <div style="margin:14px 0;">
    <button class="btn btn-primary" data-act="review-start" data-kind="fav">${icon("target")} 開始複習收藏</button>
  </div>
  <div class="cat-list">${rows}</div>
  `;
}

/* ============================================================
   VIEW: PROGRESS
   ============================================================ */
function viewProgress(){
  const rows = CATS.map(c=>{
    const p = progress[c.key] || {attempted:0, correct:0};
    const acc = p.attempted ? Math.round(p.correct/p.attempted*100) : 0;
    return `
    <tr>
      <td>${escapeHtml(c.label)}</td>
      <td class="num">${p.attempted}</td>
      <td class="num">${p.correct}</td>
      <td class="num"><span class="mini-bar-track"><span class="mini-bar-fill" style="width:${acc}%"></span></span> ${acc}%</td>
    </tr>`;
  }).join("");
  const stats = overallStats();

  const recRows = records.slice().reverse().map(r=>`
    <div class="record-row">
      <div class="rd-left">
        <span>${escapeHtml(r.label)}</span>
        <span class="date">${fmtDate(r.date)}</span>
      </div>
      <span class="tabular" style="color:var(--text-dim);">${r.correct}/${r.total} 題</span>
      <span class="badge ${r.passed?'pass':'fail'}">${r.score} 分 · ${r.passed?"通過":"未通過"}</span>
    </div>
  `).join("") || `<div class="empty-state" style="padding:24px;">${icon("inbox")}<p>尚無模擬考紀錄</p></div>`;

  return `
  <button class="back-btn" onclick="history.back()">${icon("cross")} 返回</button>
  <h2 style="margin-top:16px;font-size:20px;">學習進度</h2>

  <div class="card" style="margin-top:14px;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;">
      <div>
        <div style="font-size:12px;color:var(--text-faint);">累計作答</div>
        <div class="tabular" style="font-size:26px;font-weight:700;">${stats.attempted} 題</div>
      </div>
      <div>
        <div style="font-size:12px;color:var(--text-faint);">整體正確率</div>
        <div class="tabular" style="font-size:26px;font-weight:700;color:var(--accent);">${stats.acc}%</div>
      </div>
    </div>
    <table class="progress-table">
      <thead><tr><th>分類</th><th>作答</th><th>答對</th><th>正確率</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>

  <div class="section-title">${icon("clock")} 模擬考紀錄</div>
  <div class="card">${recRows}</div>

  <div style="margin-top:22px;text-align:center;">
    <button class="btn btn-ghost btn-sm" data-act="reset-progress">重設所有本機紀錄</button>
  </div>
  `;
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener("click", (e)=>{
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const act = t.dataset.act;
  if(act==="exam-pick") examPick(t.dataset.letter);
  else if(act==="exam-prev") examNav(-1);
  else if(act==="exam-next") examNav(1);
  else if(act==="jump" && EXAM && window.location.hash.startsWith("#/exam-run")) examJump(Number(t.dataset.idx));
  else if(act==="flag" && EXAM) examFlag(Number(t.dataset.qid));
  else if(act==="abandon-exam") abandonExam();
});

render();
</script>
